.adm-status{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:420px}
.adm-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;background:rgba(14,14,17,.6);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted);}
.adm-chip svg{width:14px;height:14px}
.adm-chip.ok{color:#a7f3d0;border-color:rgba(65,221,156,.4)}.adm-chip.bad{color:#ffc2cc;border-color:rgba(255,92,122,.5);animation:glowHot 2s ease-in-out infinite}.adm-chip.warn{color:#fde68a;border-color:rgba(251,191,36,.4)}.adm-chip.info{color:#c4b5fd;border-color:rgba(167,139,250,.5)}
.adm-tabs{display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:10px;background:rgba(14,14,17,.6);border:1px solid var(--line);scrollbar-width:none;position:sticky;top:72px;z-index:5;}
.adm-tabs button{position:relative;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:transparent;color:var(--muted);font:700 .88rem var(--f-body,inherit);padding:10px 14px;border-radius:7px;cursor:pointer;transition:background .2s,color .2s}
.adm-tabs button svg{width:17px;height:17px}
.adm-tabs button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.adm-tabs button[aria-selected="true"]{color:#fff;background:var(--accent);box-shadow:0 8px 22px -10px var(--accent-glow)}
#admin-panel{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
.adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.adm-card{position:relative;padding:22px;border-radius:12px;background:linear-gradient(160deg,rgba(22,22,27,.7),rgba(14,14,17,.94));border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.adm-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.adm-card-head h2,.adm-h2{display:flex;align-items:center;gap:10px;font-size:1.1rem}
.adm-card-head h2 svg,.adm-h2 svg{width:20px;height:20px;color:var(--accent-hi)}
.adm-h2{margin-bottom:12px;font-size:1.25rem}
.adm-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.adm-tools .lb-search{width:240px}
.adm-list{display:flex;flex-direction:column;gap:8px}
.adm-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);transition:border-color .2s,background .2s}
.adm-row:hover{border-color:var(--line-strong);background:rgba(255,255,255,.05)}
.adm-row .avatar{width:40px;height:40px;border-radius:50%}
.adm-row .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.adm-row .who b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adm-row .who .faint{font-size:.82rem}
.adm-row .when{font-size:.82rem;text-align:right}
.adm-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.adm-row.is-banned{border-color:rgba(255,92,122,.35);background:rgba(255,92,122,.06)}
.adm-row.adm-match{grid-template-columns:auto minmax(0,1fr) auto auto}
.adm-flag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:7px;font:800 .66rem var(--f-display);letter-spacing:.08em}
.adm-flag.bad{background:rgba(255,92,122,.16);color:#ff9fb0;border:1px solid rgba(255,92,122,.45)}
.adm-flag.warn{background:rgba(251,191,36,.14);color:#fde68a;border:1px solid rgba(251,191,36,.4)}
.adm-flag.ok{background:rgba(65,221,156,.14);color:#a7f3d0;border:1px solid rgba(65,221,156,.4)}
.adm-kind{font:800 .66rem var(--f-display);letter-spacing:.1em;padding:6px 9px;border-radius:8px}
.adm-kind.epic{background:rgba(255,255,255,.1);color:#fff}.adm-kind.discord{background:rgba(88,101,242,.25);color:#c7cdff}
.adm-switch{display:flex;align-items:flex-start;gap:14px;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:pointer;transition:border-color .2s}
.adm-switch:hover{border-color:var(--line-strong)}
.adm-switch input{position:absolute;opacity:0;pointer-events:none}
.adm-switch .sw{position:relative;flex:none;width:46px;height:26px;border-radius:12px;background:rgba(255,255,255,.12);transition:background .25s;margin-top:2px}
.adm-switch .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.adm-switch input:checked+.sw{background:linear-gradient(90deg,#8b5cf6,#34d399)}
.adm-switch input:checked+.sw::after{transform:translateX(20px)}
.adm-switch input[name="maintenance"]:checked+.sw{background:linear-gradient(90deg,#f43f5e,#fb923c)}
.adm-switch input:focus-visible+.sw{outline:2px solid var(--accent-hi);outline-offset:2px}
.adm-switch>span:last-child{display:flex;flex-direction:column;gap:2px}
.adm-switch small,.adm-radio small{color:var(--faint);font-size:.8rem}
.adm-radios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm-radios.row{grid-template-columns:repeat(3,1fr)}
.adm-radio{position:relative;display:flex;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;transition:border-color .2s,background .2s}
.adm-radio input{position:absolute;opacity:0}
.adm-radio>span{display:flex;flex-direction:column;gap:2px}
.adm-radio:has(input:checked){border-color:rgba(167,139,250,.7);background:rgba(139,92,246,.15);box-shadow:0 0 0 1px rgba(167,139,250,.3)}
.adm-radio.sm{padding:9px 12px;justify-content:center}
.adm-rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.adm-rewards label{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.adm-rewards label span{font:800 .9rem var(--f-display);color:#fde68a}
.adm-rewards .input{height:40px}
.adm-season{overflow:hidden;isolation:isolate;justify-content:center;min-height:220px;background:linear-gradient(150deg,rgba(120,53,15,.4),rgba(18,10,36,.95) 60%);border-color:rgba(251,191,36,.35)}
.adm-season-glow{position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#f59e0b,transparent 65%);opacity:.35;filter:blur(24px);z-index:-1;animation:breathe 3s ease-in-out infinite alternate}
.adm-season-name{font:900 clamp(2rem,4vw,2.8rem) var(--f-display);background:linear-gradient(90deg,#fde68a,#f59e0b,#fff7d6,#f59e0b,#fde68a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.adm-seasons{display:flex;flex-direction:column;gap:12px}
.adm-past{padding:14px 16px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.adm-past-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.adm-past-head .faint{font-size:.82rem}
.adm-past-tops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-past-tops>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.adm-top{display:flex;align-items:center;gap:8px;font-size:.88rem}
.adm-top .rank{min-width:26px;height:26px;font-size:.78rem}
.adm-top .faint{font-size:.78rem}
.adm-log{display:flex;flex-direction:column;gap:6px}
.adm-log-row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.025);animation:slideIn .4s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--d)*25ms)}
.adm-log-row>div{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px;font-size:.9rem;min-width:0}
.adm-log-meta{width:100%;font-size:.76rem;color:var(--faint)}
.adm-log-ico{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:6px;background:rgba(139,92,246,.18);color:var(--accent-hi)}
.adm-log-ico svg{width:16px;height:16px}
.adm-log-row.k-ban .adm-log-ico,.adm-log-row.k-blacklist .adm-log-ico,.adm-log-row.k-kick .adm-log-ico,.adm-log-row.k-mute .adm-log-ico{background:rgba(255,92,122,.18);color:#ff9fb0}
.adm-log-row.k-season .adm-log-ico{background:rgba(251,191,36,.18);color:#fde68a}
.adm-log-row.k-unban .adm-log-ico,.adm-log-row.k-unmute .adm-log-ico,.adm-log-row.k-unblacklist .adm-log-ico{background:rgba(65,221,156,.16);color:#6ee7b7}
.accent{color:var(--accent-hi)}
/* Fiche joueur */
.modal.modal-wide{width:min(900px,calc(100vw - 24px));max-width:none;max-height:calc(100vh - 40px);overflow-y:auto}
.adm-pl-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px;border-radius:10px;background:linear-gradient(120deg,rgba(139,92,246,.18),rgba(255,255,255,.02));border:1px solid var(--line);margin-bottom:14px}
.adm-pl-head>.avatar{width:64px;height:64px;border-radius:50%;box-shadow:0 0 0 3px #121216,0 0 0 5px rgba(167,139,250,.6)}
.adm-pl-head .faint{font-size:.84rem}
.adm-pl-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:800 1.35rem var(--f-display)}
.adm-pl-flags{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.adm-sections{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-sec{padding:16px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.adm-sec h3{display:flex;align-items:center;gap:8px;font-size:.98rem}
.adm-sec h3 svg{width:18px;height:18px;color:var(--accent-hi)}
.adm-sec.danger{border-color:rgba(255,92,122,.3);background:linear-gradient(160deg,rgba(255,92,122,.07),rgba(255,255,255,.02))}
.adm-sec.danger h3 svg{color:#ff9fb0}
.adm-sec:last-child{grid-column:1/-1}
.adm-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adm-inline .input{flex:1;min-width:110px;height:40px}
.adm-inline select.input{flex:0 0 auto;min-width:130px}
.adm-inline input[type=number]{max-width:130px}
.adm-mini{padding:10px 12px;border-radius:8px;background:rgba(14,14,17,.4);border:1px solid var(--line)}
.adm-mini-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem}
.adm-mini-list{display:flex;flex-direction:column;gap:4px}
.adm-mini-list a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:6px;background:rgba(255,255,255,.03);color:var(--text);font-size:.86rem}
.adm-mini-list a:hover{text-decoration:none;background:rgba(255,255,255,.07)}
.adm-mini-list a>span:last-child{margin-left:auto}
.adm-mini-list .ok{color:#6ee7b7}.adm-mini-list .bad{color:#ff8fa3}
.adm-mini-log{display:flex;flex-direction:column;gap:4px;font-size:.84rem;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:900px){.adm-grid,.adm-sections,.adm-past-tops{grid-template-columns:1fr}.adm-row{grid-template-columns:auto minmax(0,1fr)}.adm-row .when{display:none}.adm-row .acts{grid-column:1/-1;justify-content:flex-start}.adm-status{justify-content:flex-start}.adm-tabs{top:60px}}
@media (max-width:560px){.adm-radios,.adm-radios.row,.adm-rewards{grid-template-columns:1fr}.adm-ico{display:none}}
@media (prefers-reduced-motion:reduce){.adm *,.adm-hero::before,.ann,.ann::after{animation:none!important}}

/* ===== Admin : Discord ===== */
.dc-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
.dc-grid>.stack{position:sticky;top:140px}
.dc-tpls{display:flex;gap:6px;flex-wrap:wrap}
.dc-color input{width:64px;height:44px;padding:4px;border-radius:7px;border:1px solid var(--line);background:rgba(14,14,17,.6);cursor:pointer}
.dc-drop{display:flex;align-items:center;gap:14px;padding:18px;border-radius:8px;border:1.5px dashed var(--line-strong);background:rgba(139,92,246,.06);cursor:pointer;transition:background .2s,border-color .2s}
.dc-drop:hover{background:rgba(139,92,246,.12);border-color:#a78bfa}
.dc-drop svg{width:26px;height:26px;color:var(--accent-hi);flex:none}
.dc-drop span{display:flex;flex-direction:column;gap:2px}.dc-drop small{color:var(--faint);font-size:.8rem}
.dc-img{display:flex;align-items:center;gap:14px;padding:10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.dc-img img{width:120px;height:68px;object-fit:cover;border-radius:6px}
.dc-field{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;align-items:center}
.dc-field .input{height:40px}.dc-field .check{font-size:.8rem;white-space:nowrap}
.dc-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.dc-steps b{color:var(--text)}
.dc-guide{border-color:rgba(88,101,242,.45);background:linear-gradient(140deg,rgba(88,101,242,.16),rgba(14,14,17,.94) 60%)}
.dc-chans{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dc-chan{padding:14px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dc-chan.on{border-color:rgba(65,221,156,.35);background:rgba(65,221,156,.05)}
.dc-chan-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-hash{font:800 1.2rem var(--f-display);color:#8e9297}
.dc-autos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
/* Aperçu façon Discord */
.dc-preview{padding:16px 14px;border-radius:8px;background:#313338;font-family:"gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;color:#dbdee1}
.dc-msg{display:flex;gap:14px;align-items:flex-start}
.dc-av{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font:800 1rem var(--f-display)}
.dc-body{min-width:0;flex:1}
.dc-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.dc-meta b{color:#f2f3f5;font-weight:600}
.dc-app{background:#5865f2;color:#fff;font-size:.62rem;font-weight:700;padding:1px 5px;border-radius:4px}
.dc-time{font-size:.74rem;color:#949ba4}
.dc-mention{display:inline-block;margin-bottom:6px;padding:0 3px;border-radius:3px;background:rgba(88,101,242,.3);color:#c9cdfb;font-weight:500}
.dc-embed{max-width:520px;border-left:4px solid var(--c);background:#2b2d31;border-radius:4px;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.dc-title{font-weight:700;color:#f2f3f5;font-size:1rem}
.dc-desc{font-size:.9rem;line-height:1.4;color:#dbdee1;overflow-wrap:anywhere}
.dc-desc b,.dc-fields b{color:#f2f3f5}
.dc-desc code{background:#1e1f22;padding:1px 4px;border-radius:3px;font-size:.85em}
.dc-desc pre{background:#1e1f22;padding:8px;border-radius:4px;white-space:pre-wrap;margin:4px 0}
.dc-fields{display:flex;flex-wrap:wrap;gap:8px 16px}
.dc-fields>div{flex:1 1 100%;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.dc-fields>div.inl{flex:1 1 30%}
.dc-image{width:100%;max-height:300px;object-fit:cover;border-radius:6px;margin-top:4px}
.dc-foot{font-size:.74rem;color:#949ba4}
@media (max-width:980px){.dc-grid{grid-template-columns:1fr}.dc-grid>.stack{position:static}.dc-field{grid-template-columns:1fr 1fr}}

.dc-chan .dc-name{height:36px;flex:1;min-width:0;font-weight:700}
.dc-add{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border-radius:8px;border:1.5px dashed var(--line-strong);background:rgba(139,92,246,.05);color:var(--accent-hi);font-weight:700;cursor:pointer;transition:background .2s}
.dc-add:hover{background:rgba(139,92,246,.12)}.dc-add svg{width:20px;height:20px}
.dc-routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dc-route{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.dc-route select{max-width:180px;height:40px}

/* ===== GIFs / stickers ===== */
.mp-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:var(--muted);background:transparent;transition:color .2s,background .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.mp-btn .ico{width:22px;height:22px}
.mp-btn:hover:not([disabled]),.mp-btn.on{color:#fff;background:rgba(139,92,246,.22);transform:rotate(-8deg) scale(1.06)}
.mp-btn[disabled]{opacity:.35;cursor:not-allowed}
.chat-form:has(.mp-btn){padding-left:5px}
.bubble.bubble-media{background:none!important;border:0!important;box-shadow:none!important;padding:0}
.bubble.bubble-media .bubble-meta{padding:0 4px 4px}
.cm{position:relative;max-width:min(240px,62vw);border-radius:8px;overflow:hidden}
.cm img{display:block;width:100%;height:100%;object-fit:cover}
.cm-gif{background:rgba(139,92,246,.12);box-shadow:0 8px 24px -14px rgba(0,0,0,.8)}
.cm-stk{max-width:min(132px,40vw);border-radius:0;overflow:visible}
.cm-stk img{object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.bubble:not(.bubble-media) .cm{margin:4px 0 6px}
.cm-save,.mp-star{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(7,5,12,.62);opacity:0;transition:opacity .2s,transform .2s,color .2s}
.cm-save .ico,.mp-star .ico{width:15px;height:15px}
.cm:hover .cm-save,.cm-save:focus-visible,.cm-save.on,.mp-cell:hover .mp-star,.mp-star:focus-visible,.mp-star.on{opacity:1}
.cm-save.on,.mp-star.on{color:#ffd166}.cm-save.on .ico,.mp-star.on .ico{fill:currentColor}
.cm-save:hover,.mp-star:hover{transform:scale(1.12)}
@media (hover:none){.cm-save,.mp-star{opacity:.85}}
.mp{position:fixed;z-index:80;display:flex;flex-direction:column;border-radius:10px;background:linear-gradient(180deg,rgba(28,18,50,.97),rgba(16,16,19,.98));border:1px solid var(--line-strong);box-shadow:0 30px 80px -20px rgba(0,0,0,.85),0 0 0 1px rgba(139,92,246,.08),0 0 60px -20px var(--accent-glow);opacity:0;transform:translateY(10px) scale(.98);transform-origin:bottom left;transition:opacity .18s,transform .22s cubic-bezier(.16,1,.3,1);overflow:hidden}
.mp.show{opacity:1;transform:none}
.mp.sheet{left:0;right:0;bottom:0;height:min(72vh,560px);border-radius:22px 22px 0 0;border-bottom:0;transform:translateY(40px)}
.mp.sheet.show{transform:none}
.mp-grab{display:none;width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:8px auto 0;flex:none}
.mp.sheet .mp-grab{display:block}
.mp-top{display:flex;gap:8px;align-items:center;padding:12px 12px 8px}
.mp-search{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.mp-search:focus-within{border-color:rgba(167,139,250,.7);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
.mp-search .ico{width:18px;height:18px;color:var(--muted);flex:none}
.mp-search input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:500 .95rem var(--f-body);outline:none}
.mp-search input::-webkit-search-cancel-button{display:none}
.mp-clear,.mp-x{border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px;padding:4px}
.mp-clear .ico{width:15px;height:15px}.mp-x .ico{width:18px;height:18px}
.mp-clear:hover,.mp-x:hover{color:#fff;background:rgba(255,255,255,.08)}
.mp-tabs{display:flex;gap:4px;padding:0 12px 8px}
.mp-tab{flex:1;height:38px;border-radius:7px;border:0;cursor:pointer;display:grid;place-items:center;color:var(--muted);background:transparent;font:800 .8rem var(--f-body);letter-spacing:.04em;transition:background .2s,color .2s}
.mp-tab .ico{width:20px;height:20px}
.mp-tab b{border:1.8px solid currentColor;border-radius:6px;padding:1px 5px;font-size:.72rem}
.mp-emo-ico{font-size:1.15rem;filter:grayscale(.6);transition:filter .2s}
.mp-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.mp-tab[aria-selected="true"]{color:#fff;background:rgba(139,92,246,.26);box-shadow:inset 0 0 0 1px var(--line-strong)}
.mp-tab[aria-selected="true"] .mp-emo-ico{filter:none}
.mp-tab[aria-selected="true"] .ico{fill:none}
.mp-tab[data-tab="fav"][aria-selected="true"] .ico{fill:currentColor;color:#ffd166}
.mp-chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;flex:none}
.mp-chips::-webkit-scrollbar{display:none}
.mp-chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:6px;padding:6px 12px;font:700 .82rem var(--f-body);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.mp-chip:hover{border-color:var(--line-strong)}
.mp-chip.on{background:var(--accent);border-color:transparent;color:#fff}
.mp-body{flex:1;overflow-y:auto;padding:2px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.5) transparent;overscroll-behavior:contain}
.mp-h{font:700 .82rem var(--f-body);color:var(--muted);margin:6px 2px 8px;letter-spacing:.02em}
.mp-note{font-size:.84rem;color:var(--faint);margin:0 2px 14px}.mp-note .ico{width:14px;height:14px;vertical-align:-2px;color:#ffd166}
.mp-grid{margin-bottom:12px}
.mp-grid.masonry{columns:2 140px;column-gap:6px}
.mp-grid.squares{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mp-grid.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.mp-cell{position:relative;break-inside:avoid;margin-bottom:6px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.04);animation:mpIn .3s both}
.mp-grid.squares .mp-cell,.mp-grid.emojis .mp-cell{margin:0;aspect-ratio:1}
.mp-grid.emojis .mp-cell{background:none}
.mp-grid.squares .mp-cell.gif{aspect-ratio:1!important}
.mp-item{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer}
.mp-item img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mp-grid.squares .mp-cell:not(.gif) img,.mp-grid.emojis img{object-fit:contain;padding:6px}
.mp-grid.emojis img{padding:4px}
.mp-grid.emojis .mp-star{display:none}
.mp-grid.squares .mp-star{top:4px;right:4px;width:24px;height:24px}
.mp-item:hover img{transform:scale(1.08)}
.mp-item:focus-visible{outline:2px solid var(--accent-hi);outline-offset:-2px;border-radius:7px}
.mp-skel{display:block;break-inside:avoid;margin-bottom:6px;height:110px;border-radius:7px;background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(139,92,246,.14) 50%,rgba(255,255,255,.04) 70%) 0 0/300% 100%;animation:mpShim 1.2s linear infinite}
.mp-skel:nth-child(3n){height:150px}.mp-skel:nth-child(4n){height:90px}
.mp-grid.squares .mp-skel{height:auto;aspect-ratio:1;margin:0}
.mp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:36px 16px;color:var(--muted);font-size:.88rem}
.mp-empty>.ico{width:38px;height:38px;color:var(--accent-hi);margin-bottom:4px}
.mp-empty b{color:var(--text);font-size:.95rem;max-width:30ch}
.mp-empty .btn{margin-top:4px}
.mp-foot{flex:none;text-align:right;padding:6px 14px 8px;font-size:.7rem;color:var(--faint);border-top:1px solid var(--line)}
.mp-foot b{color:var(--muted);letter-spacing:.06em}
@keyframes mpIn{from{opacity:0;transform:scale(.94)}}
@keyframes mpShim{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){.mp,.mp-cell,.mp-skel{animation:none;transition:none}}

/* ===== VIP : bannière + verrou GIFs ===== */

.bn-card{display:flex;flex-direction:column;gap:14px}

/* ===== Admin : nouvelles inscriptions ===== */
.su{display:flex;flex-direction:column;gap:18px}
.su .card-head{margin:0;flex-wrap:wrap;gap:8px}
.su-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.su-kpi{padding:14px 16px;border-radius:8px;background:rgba(14,14,17,.55);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.su-kpi b{font:800 1.7rem var(--f-display);line-height:1.1}
.su-kpi span{font-size:.8rem;color:var(--muted)}
.su-kpi i{font-style:normal;font-size:.75rem;font-weight:700;margin-top:4px}
.su-kpi i.up{color:var(--ok)}.su-kpi i.down{color:var(--bad)}
.su-kpi.hl{background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(14,14,17,.55));border-color:var(--line-strong)}
.su-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.su-chart{padding:14px 16px 10px;border-radius:8px;background:rgba(14,14,17,.55);border:1px solid var(--line)}
.su-chart h3{font-size:.9rem;margin:0 0 10px}.su-chart h3 .faint{font-weight:500;font-size:.8rem}
.su-bars{display:flex;align-items:stretch;gap:4px;height:130px}

.su-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0}

.su-col:hover i{filter:brightness(1.35)}
.su-col.now i{background:linear-gradient(180deg,#c4b5fd,#8b5cf6);box-shadow:0 0 16px -4px var(--accent-glow)}
.su-n{font-size:.7rem;font-weight:700;color:var(--muted);min-height:1em}

.su-list{display:flex;flex-direction:column;gap:8px}
.su-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:7px;background:rgba(14,14,17,.55);border:1px solid var(--line)}
.su-row.fresh{border-color:rgba(139,92,246,.45);background:linear-gradient(90deg,rgba(139,92,246,.14),rgba(14,14,17,.55) 60%)}
.su-row .who{display:flex;flex-direction:column;min-width:0;gap:2px}.su-row .who .faint{font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-when{display:flex;flex-direction:column;align-items:flex-end;font-size:.84rem;gap:2px}.su-when b{font-weight:700}.su-when .faint{font-size:.78rem}
.su-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.su-tag{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}

.su-more{align-self:center}
@media (max-width:960px){.su-charts{grid-template-columns:1fr}.su-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== Fiche joueur façon Discord ===== */
.pl{cursor:pointer;border-radius:8px;transition:filter .15s}
.pl:hover{filter:brightness(1.2)}
.bubble-meta .pl:hover span{text-decoration:underline}
.pl.pl-av{display:inline-flex;border-radius:50%}
.pl-row{cursor:pointer}
.gc-person.pl-row{border-radius:7px;transition:background .2s}.gc-person.pl-row:hover{background:rgba(139,92,246,.1)}
.modal.modal-pc{max-width:440px;padding:0;gap:0;background:#0e0e11;border-color:rgba(205,205,220,.22);overflow-x:hidden}
.pc-wait{padding:40px}
.pc{position:relative;display:flex;flex-direction:column}
.pc-x{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(0,0,0,.45);}
.pc-x:hover{background:rgba(0,0,0,.7)}.pc-x .ico{width:18px;height:18px}
.pc-banner{position:relative;overflow:hidden;height:150px;background:radial-gradient(80% 120% at 20% 0%,color-mix(in srgb,var(--ra) 55%,transparent),transparent 70%),radial-gradient(70% 120% at 100% 100%,color-mix(in srgb,var(--rb) 70%,transparent),transparent 70%),linear-gradient(135deg,#2a1856,#121216);background-size:cover;background-position:center}
.pc-banner.img{height:170px}
.pc-top{display:flex;align-items:flex-start;gap:12px;padding:0 18px;margin-top:-58px;position:relative;z-index:1}
.pc-av{position:relative;flex:none;border-radius:50%;padding:6px;background:#0e0e11}
.pc-av .avatar.pc-avatar{width:104px;height:104px;border-radius:50%;font-size:2.4rem}
.pc-dot{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:#5b5470;border:5px solid #0e0e11}
.pc-dot.on{background:#3ba55d}
.pc-bubble{margin-top:66px;max-width:200px;padding:9px 14px;border-radius:8px;background:#1b1430;border:1px solid var(--line-strong);font-size:.88rem;font-style:italic;color:var(--text);position:relative;overflow-wrap:anywhere}
.pc-bubble::before{content:"";position:absolute;left:-7px;top:-6px;width:12px;height:12px;border-radius:50%;background:#1b1430;border:1px solid var(--line-strong)}
.pc-body{padding:10px 20px 22px;display:flex;flex-direction:column;gap:16px}
.pc-name{font:800 1.6rem var(--f-display);margin:0;line-height:1.15;overflow-wrap:anywhere}
.pc-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.92rem;margin-top:4px}
.pc-sub .mono{color:var(--text)}.pc-sub .dot{color:var(--faint)}.pc-on{color:#3ba55d;font-weight:700}
.pc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pc-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9px;background:#17112a;border:1px solid var(--line);font-size:.78rem;font-weight:700;color:var(--text)}
.pc-chip .ico{width:14px;height:14px}
.pc-chip.adm{color:#ff8fa3;border-color:rgba(255,96,121,.35)}.pc-chip.vip{color:#f6bb4f;border-color:rgba(246,187,79,.4)}
.pc-chip.karma-bad{color:var(--bad)}.pc-chip.karma-ok{color:var(--ok)}.pc-chip.karma-warn{color:var(--warn)}
.pc-actions{display:flex;gap:8px}.pc-actions .btn-primary{flex:1;justify-content:center}
.pc-sec h3{font-size:.8rem;font-weight:800;margin:0 0 6px;color:var(--text);display:flex;gap:8px;align-items:center}
.pc-sec h3 .faint{font-weight:600}
.pc-sec p{margin:0}
.pc-since{display:flex;gap:8px;align-items:center}.pc-since .ico{width:17px;height:17px;color:var(--accent-hi)}
.pc-ranks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc-rank{padding:12px;border-radius:8px;background:linear-gradient(160deg,color-mix(in srgb,var(--ra) 12%,#120c22),#0f0a1c);border:1px solid color-mix(in srgb,var(--ra) 25%,transparent);display:flex;flex-direction:column;gap:8px;min-width:0}
.pc-rank.cur{border-color:color-mix(in srgb,var(--ra) 60%,transparent);box-shadow:0 0 30px -14px var(--ra)}
.pc-rank-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pc-mode{font:800 .8rem var(--f-display);letter-spacing:.04em}
.pc-cur{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-hi)}
.pc-rank-main{display:flex;gap:8px;align-items:center}.pc-rank-main b{font-size:.92rem}.pc-rank-main small{color:var(--muted);font-size:.74rem}
.pc-wl{display:flex;gap:8px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}.pc-wl b{color:var(--text);font-size:.85rem}.pc-wl .w{color:var(--ok)}.pc-wl .l{color:var(--bad)}
.pc-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.pc-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--rb),var(--ra))}
.pc-form{display:flex;gap:5px;flex-wrap:wrap}
.pc-res{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:800 .78rem var(--f-body)}
.pc-res.win{background:rgba(65,221,156,.16);color:var(--ok);border:1px solid rgba(65,221,156,.35)}
.pc-res.loss{background:rgba(255,96,121,.14);color:var(--bad);border:1px solid rgba(255,96,121,.32)}
.pc-tot{font-size:.8rem;margin-top:6px!important}
.pc-streak{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:#fb923c;font-weight:700}.pc-streak .ico{width:13px;height:13px}
.pc-badges{display:flex;flex-wrap:wrap;gap:6px}
.pc-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:#fcd34d;font-size:.76rem;font-weight:700}
.pc-badge .ico{width:13px;height:13px}
@media (max-width:480px){.pc-ranks{grid-template-columns:1fr}.pc-bubble{display:none}}

/* ===================== COSMÉTIQUES ===================== */
.av-deco{position:relative;display:inline-grid;place-items:center;flex:none;isolation:isolate;vertical-align:middle}
.av-deco>.avatar{border-radius:50%!important;box-shadow:none}
.adeco{position:absolute;left:-24%;top:-24%;width:148%;height:148%;pointer-events:none;overflow:visible;z-index:2}
.msg.mine .av-deco{display:none}
/* ---- effets de profil : calque posé par-dessus toute la fiche ---- */
.pfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6;border-radius:inherit;container-type:size}
.pfx i,.pfx b,.pfx span,.pfx svg{position:absolute;display:block}
@keyframes fx-tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes fx-breathe{50%{opacity:.6;transform:scaleY(.92)}}
@keyframes dx-spin{to{transform:rotate(360deg)}}
.fx-star{left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 5px #fff,0 0 10px rgba(196,181,253,.8);animation:fx-tw var(--t) ease-in-out infinite var(--dl)}
.fx-spk{left:var(--x);top:var(--y);width:var(--z);height:var(--z);background:var(--c);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:fx-spk var(--t) ease-in-out infinite var(--dl)}
@keyframes fx-spk{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
/* supernova */
.pfx-fx_supernova{--cy:19%}
.sn-glow{left:50%;top:var(--cy);width:130cqw;height:130cqw;margin:-65cqw 0 0 -65cqw;border-radius:50%;background:radial-gradient(circle,rgba(196,181,253,.5),rgba(236,72,153,.22) 25%,rgba(59,130,246,.1) 42%,transparent 62%);mix-blend-mode:screen;animation:sn-glow 3s ease-in-out infinite}
@keyframes sn-glow{0%,100%{opacity:.55}6%{opacity:1}}
.sn-rays{left:50%;top:var(--cy);width:170cqw;height:170cqw;margin:-85cqw 0 0 -85cqw;background:repeating-conic-gradient(rgba(255,255,255,.3) 0deg 1.2deg,transparent 1.2deg 7deg);-webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 12%,transparent 45%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 12%,transparent 45%);mix-blend-mode:screen;animation:dx-spin 50s linear infinite}
.sn-core{left:50%;top:var(--cy);width:22cqw;height:22cqw;margin:-11cqw 0 0 -11cqw;border-radius:50%;background:radial-gradient(circle,#fff 0 14%,#e0f2fe 24%,rgba(165,243,252,.8) 36%,rgba(217,70,239,.45) 55%,transparent 70%);mix-blend-mode:screen;animation:sn-core 3s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes sn-core{0%,100%{transform:scale(.8)}6%{transform:scale(1.7);filter:brightness(1.6)}35%{transform:scale(1)}}
.sn-wave{left:50%;top:var(--cy);width:22cqw;height:22cqw;margin:-11cqw 0 0 -11cqw;border-radius:50%;border:2px solid rgba(240,240,255,.95);box-shadow:0 0 22px rgba(167,139,250,.95),inset 0 0 22px rgba(236,72,153,.7);opacity:0;animation:sn-wave 3s cubic-bezier(.15,.6,.3,1) infinite var(--dl)}
@keyframes sn-wave{0%{transform:scale(.3);opacity:1}70%{opacity:.25}100%{transform:scale(6);opacity:0}}
.sn-p{left:50%;top:var(--cy);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c),0 0 14px var(--c);animation:sn-p var(--t) cubic-bezier(.1,.6,.3,1) infinite var(--dl)}
@keyframes sn-p{0%{transform:rotate(var(--a)) translateX(0) scale(1.6);opacity:0}8%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--d)) scale(.3);opacity:0}}
/* galaxie */
.gx-wrap{left:50%;top:15%;width:115cqw;height:115cqw;margin:-57.5cqw 0 0 -57.5cqw;transform:perspective(700px) rotateX(64deg) rotate(-18deg)}
.gx-disk{inset:0;border-radius:50%;background:conic-gradient(transparent 0deg,rgba(167,139,250,.85) 35deg,transparent 95deg,rgba(236,72,153,.7) 155deg,transparent 215deg,rgba(96,165,250,.75) 275deg,transparent 335deg);-webkit-mask:radial-gradient(circle,transparent 3%,#000 9%,#000 28%,transparent 62%);mask:radial-gradient(circle,transparent 3%,#000 9%,#000 28%,transparent 62%);filter:blur(6px);mix-blend-mode:screen;animation:dx-spin 24s linear infinite}
.gx-disk.d2{background:repeating-conic-gradient(rgba(255,255,255,.4) 0deg 2.5deg,transparent 2.5deg 24deg);filter:blur(2.5px);animation-duration:16s;opacity:.8}
.gx-core{left:50%;top:50%;width:13%;height:13%;margin:-6.5% 0 0 -6.5%;border-radius:50%;background:radial-gradient(circle,#fff,#fef3c7 25%,rgba(251,191,36,.55) 45%,rgba(236,72,153,.25) 65%,transparent 75%);mix-blend-mode:screen;animation:fx-breathe 4s ease-in-out infinite}
.fx-dust{left:var(--x);bottom:-4%;width:3px;height:3px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);animation:fx-dust var(--t) linear infinite var(--dl)}
@keyframes fx-dust{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(18px,-110cqh);opacity:0}}
.fx-shoot{left:var(--x);top:var(--y);width:130px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(196,181,253,.6) 60%,#fff);filter:drop-shadow(0 0 4px #c4b5fd);opacity:0;animation:fx-shoot var(--t) ease-in infinite var(--dl)}
@keyframes fx-shoot{0%{transform:rotate(32deg) translateX(-40cqw);opacity:0}3%{opacity:1}18%{transform:rotate(32deg) translateX(120cqw);opacity:0}100%{transform:rotate(32deg) translateX(120cqw);opacity:0}}
/* pluie d'étoiles filantes */
.fx-comet{left:var(--x);top:var(--y);width:var(--w);height:2.5px;border-radius:3px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 50%,transparent) 55%,var(--c));opacity:0;animation:fx-comet var(--t) cubic-bezier(.4,0,.8,.6) infinite var(--dl)}
.fx-comet::after{content:"";position:absolute;right:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px var(--c),0 0 18px 6px color-mix(in srgb,var(--c) 50%,transparent)}
@keyframes fx-comet{0%{transform:rotate(28deg) translateX(-30cqw);opacity:0}6%{opacity:1}42%{transform:rotate(28deg) translateX(150cqw);opacity:0}100%{transform:rotate(28deg) translateX(150cqw);opacity:0}}
/* ténèbres */
.ab-vig{inset:0;box-shadow:inset 0 0 40px 16px rgba(0,0,0,.75),inset 0 -80px 80px -30px rgba(40,0,70,.85);animation:ab-vig 4s ease-in-out infinite}
@keyframes ab-vig{50%{box-shadow:inset 0 0 60px 24px rgba(0,0,0,.85),inset 0 -110px 90px -30px rgba(70,0,110,.9)}}
.ab-smoke{left:var(--x);bottom:-30%;width:var(--w);height:var(--w);border-radius:50%;background:radial-gradient(circle,rgba(3,0,8,.8) 28%,rgba(91,33,182,.35) 52%,transparent 70%);filter:blur(12px);animation:ab-smoke var(--t) ease-in-out infinite var(--dl)}
@keyframes ab-smoke{0%{transform:translateY(15%) scale(.7);opacity:0}25%{opacity:.75}100%{transform:translate(var(--dx),-38cqh) scale(1.4);opacity:0}}
.ab-tendrils{inset:0;width:100%;height:100%;overflow:visible}
.ab-tendrils path{fill:none;stroke:#05000c;stroke-width:9;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #7c3aed) drop-shadow(0 0 10px rgba(124,58,237,.6));transform-box:fill-box;transform-origin:50% 100%;stroke-dasharray:200;animation:ab-tend var(--t) ease-in-out infinite alternate var(--dl)}
@keyframes ab-tend{0%{transform:rotate(-7deg) scaleY(.75);stroke-dashoffset:40}100%{transform:rotate(8deg) scaleY(1.08);stroke-dashoffset:0}}
.ab-eye{left:var(--x);top:var(--y);width:24px;height:6px;opacity:0;animation:ab-eye 7s ease-in-out infinite var(--dl)}
.ab-eye::before,.ab-eye::after{content:"";position:absolute;top:0;width:8px;height:5px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:#f5d0fe;box-shadow:0 0 6px #d946ef,0 0 14px #9333ea,0 0 24px #7c3aed}
.ab-eye::before{left:0;transform:rotate(12deg)}.ab-eye::after{right:0;transform:rotate(-12deg)}
@keyframes ab-eye{0%,38%,100%{opacity:0;transform:scaleY(.1)}46%,64%{opacity:1;transform:scaleY(1)}55%{transform:scaleY(.1)}72%{opacity:0}}
.fx-mote{left:var(--x);bottom:-2%;width:3px;height:3px;border-radius:50%;background:#c084fc;box-shadow:0 0 6px #a855f7;animation:fx-mote var(--t) ease-in infinite var(--dl)}
@keyframes fx-mote{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-14px,-90cqh);opacity:0}}
/* enfer */
.in-heat{left:0;right:0;bottom:0;height:55%;background:linear-gradient(0deg,rgba(255,70,0,.45),rgba(190,20,0,.12) 45%,transparent);mix-blend-mode:screen;animation:fx-breathe 2s ease-in-out infinite;transform-origin:50% 100%}
.in-top{left:0;right:0;top:0;height:30%;background:linear-gradient(180deg,rgba(120,10,0,.35),transparent);mix-blend-mode:screen}
.in-fl{left:var(--x);bottom:-6%;width:var(--w);height:var(--h);margin-left:calc(var(--w) / -2);opacity:.9;border-radius:50% 50% 45% 45%/72% 72% 28% 28%;background:radial-gradient(ellipse at 50% 88%,#fffbe0 0%,#ffd23d 16%,#ff7a00 38%,rgba(225,29,0,.85) 58%,transparent 72%);filter:blur(3px);mix-blend-mode:screen;transform-origin:50% 100%;animation:in-fl var(--t) ease-in-out infinite alternate var(--dl)}
.in-fl.b{bottom:-3%;background:radial-gradient(ellipse at 50% 88%,#fff 0%,#fde047 20%,#f97316 45%,transparent 70%);opacity:.85}
@keyframes in-fl{0%{transform:scale(.85,.75) skewX(-5deg)}50%{transform:scale(1,1.12) skewX(6deg)}100%{transform:scale(.9,1.3) skewX(-3deg);opacity:.8}}
.in-em{left:var(--x);bottom:4%;width:var(--s);height:var(--s);border-radius:50%;background:#ffe2a8;box-shadow:0 0 6px 2px #ff6a00,0 0 14px #ff3d00;animation:in-em var(--t) linear infinite var(--dl)}
@keyframes in-em{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(var(--dx),-50cqh)}100%{transform:translate(0,-105cqh) scale(.3);opacity:0}}
/* lumière divine */
.dv-glow{left:50%;top:-25%;width:150cqw;height:85cqh;margin-left:-75cqw;background:radial-gradient(ellipse at 50% 0%,rgba(254,240,138,.6),rgba(251,191,36,.2) 40%,transparent 70%);mix-blend-mode:screen;animation:fx-breathe 4s ease-in-out infinite}
.dv-rays{left:50%;top:-110cqw;width:220cqw;height:220cqw;margin-left:-110cqw;background:repeating-conic-gradient(from 150deg,rgba(255,248,210,.16) 0deg 3deg,transparent 3deg 14deg);-webkit-mask:radial-gradient(circle,rgba(0,0,0,.9) 28%,transparent 55%);mask:radial-gradient(circle,rgba(0,0,0,.9) 28%,transparent 55%);filter:blur(1.5px);mix-blend-mode:screen;animation:dv-sway 9s ease-in-out infinite alternate}
@keyframes dv-sway{0%{transform:rotate(-7deg)}100%{transform:rotate(7deg)}}
.dv-feather{left:var(--x);top:-12%;width:calc(20px * var(--s));height:calc(40px * var(--s));animation:dv-fall var(--t) ease-in-out infinite var(--dl);overflow:visible}
.dv-feather path{fill:rgba(255,255,255,.95);filter:drop-shadow(0 0 4px rgba(253,224,71,.9))}.dv-feather path.q{fill:none;stroke:#eab308;stroke-width:.8}
@keyframes dv-fall{0%{transform:translate(0,0) rotate(-35deg);opacity:0}8%{opacity:1}25%{transform:translate(var(--dx),28cqh) rotate(25deg)}50%{transform:translate(0,58cqh) rotate(-25deg)}75%{transform:translate(var(--dx),88cqh) rotate(20deg);opacity:1}100%{transform:translate(0,125cqh) rotate(-15deg);opacity:0}}
/* colère de zeus */
.zs-cloud{left:-10%;right:-10%;top:-12%;height:38%;background:radial-gradient(60% 100% at 30% 0%,rgba(30,27,75,.9),transparent 70%),radial-gradient(60% 100% at 75% 0%,rgba(49,46,129,.85),transparent 70%);filter:blur(8px);animation:fx-breathe 5s ease-in-out infinite}
.zs-bolt{left:var(--x);top:0;width:17cqw;height:var(--h);overflow:visible;opacity:0;animation:zs-bolt 3.4s linear infinite var(--dl)}
.zs-bolt polyline{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #93c5fd) drop-shadow(0 0 12px #3b82f6) drop-shadow(0 0 24px #6366f1)}
.zs-bolt polyline.br{stroke-width:1.6}
@keyframes zs-bolt{0%,82%,100%{opacity:0}83%{opacity:1}85%{opacity:.15}87%{opacity:1}92%{opacity:0}}
.zs-flash{inset:0;background:radial-gradient(80% 70% at 50% 15%,rgba(191,219,254,.55),transparent 70%);mix-blend-mode:screen;opacity:0;animation:zs-bolt 3.4s linear infinite;animation-delay:0s}
.zs-spark{left:var(--x);top:var(--y);width:3px;height:3px;border-radius:50%;background:#e0f2fe;box-shadow:0 0 6px #38bdf8,0 0 12px #3b82f6;animation:zs-spark var(--t) steps(4) infinite var(--dl)}
@keyframes zs-spark{0%{transform:translate(0,0);opacity:1}25%{transform:translate(4px,-3px);opacity:.2}50%{transform:translate(-3px,2px);opacity:1}75%{transform:translate(2px,4px);opacity:0}100%{transform:translate(0,0);opacity:.8}}
/* trou noir */
.bh-wrap{left:72%;top:19%;width:40cqw;height:40cqw;margin:-20cqw 0 0 -20cqw}
.bh-glow{inset:-40%;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.28),rgba(139,92,246,.18) 35%,transparent 62%);mix-blend-mode:screen;animation:fx-breathe 4s ease-in-out infinite}
.bh-lens{left:25%;top:25%;width:50%;height:50%;border-radius:50%;box-shadow:0 0 0 2px rgba(255,237,213,.85),0 0 16px 4px rgba(251,146,60,.85),0 0 40px 10px rgba(234,88,12,.4)}
.bh-tilt{inset:0;transform:rotate(-12deg) scaleY(.28)}
.bh-tilt.front{clip-path:inset(50% 0 0 0)}
.bh-ring{inset:-28%;border-radius:50%;background:conic-gradient(#fff7ed,#fdba74 15%,#9a3412 32%,#fb923c 50%,#fff 66%,#ea580c 82%,#fff7ed);-webkit-mask:radial-gradient(closest-side,transparent 48%,#000 52%,#000 74%,transparent 100%);mask:radial-gradient(closest-side,transparent 48%,#000 52%,#000 74%,transparent 100%);filter:blur(1px) drop-shadow(0 0 10px #f97316);animation:dx-spin 2.4s linear infinite}
.bh-hole{left:27%;top:27%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle,#000 62%,#0a0505 70%,rgba(0,0,0,0) 74%)}
.bh-p{left:72%;top:19%;width:3px;height:3px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);animation:bh-p var(--t) cubic-bezier(.5,0,.9,.6) infinite var(--dl)}
@keyframes bh-p{0%{transform:rotate(var(--a)) translateX(var(--r)) scaleY(1);opacity:0}15%{opacity:1}100%{transform:rotate(calc(var(--a) + 600deg)) translateX(2cqw) scale(.3);opacity:0}}
/* ---- décorations d'avatar ---- */
.adeco *{transform-box:view-box}
.dx-spin-slow{transform-origin:50px 50px;animation:dx-spin 40s linear infinite}
.dx-orbit{transform-origin:50px 50px;animation:dx-spin 9s linear infinite}
.dx-orbit.fast{animation-duration:3s}.dx-orbit.slow{animation-duration:14s}
.dx-claw{fill:#c2410c;stroke:#ffb86b;stroke-width:.6;filter:drop-shadow(0 0 2px #ff6a00) drop-shadow(0 0 5px rgba(255,80,0,.6));transform-origin:50px 50px;animation:dx-claw 2.4s ease-in-out infinite var(--dl)}
@keyframes dx-claw{50%{transform:scale(1.05);fill:#ea580c}}
.dx-ember{fill:#ffd18a;filter:drop-shadow(0 0 2px #ff6a00);animation:dx-ember var(--t) ease-out infinite var(--dl)}
@keyframes dx-ember{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(3px,-34px);opacity:0}}
.dx-flame{fill:#a855f7;filter:drop-shadow(0 0 3px #c084fc);transform-origin:50px 16px;animation:dx-flame .9s ease-in-out infinite alternate var(--dl)}
.dx-flame.hot{fill:#f97316;filter:drop-shadow(0 0 3px #fb923c) drop-shadow(0 0 6px rgba(239,68,68,.8))}.dx-flame.hot.b{fill:#fde047}
@keyframes dx-flame{0%{transform:scale(.8,.75)}100%{transform:scale(1.05,1.2)}}
.dx-float{animation:dx-float 3s ease-in-out infinite}
@keyframes dx-float{50%{transform:translateY(-3px)}}
.dx-halo{fill:none;stroke:#fde68a;stroke-width:3;filter:drop-shadow(0 0 3px #fbbf24) drop-shadow(0 0 7px rgba(251,191,36,.7))}
.dx-twinkle{fill:#fef3c7;filter:drop-shadow(0 0 2px #fbbf24);animation:fx-tw2 2.2s ease-in-out infinite var(--dl)}
.dx-twinkle.ws{fill:#fff;filter:drop-shadow(0 0 2px #a5f3fc) drop-shadow(0 0 4px #e879f9)}
@keyframes fx-tw2{0%,100%{opacity:.1}50%{opacity:1}}
/* supernova */
.ds-glow{fill:none;stroke:rgba(196,181,253,.5);stroke-width:7;filter:blur(3px);animation:fx-breathe 3s ease-in-out infinite}
.ds-ray{fill:#fff;filter:drop-shadow(0 0 2px #a5f3fc) drop-shadow(0 0 4px #e879f9)}.ds-ray.b{fill:#e0e7ff;opacity:.8}
.ds-wave{fill:none;stroke:#e0e7ff;stroke-width:1.6;filter:drop-shadow(0 0 3px #c084fc);transform-origin:50px 50px;animation:ds-wave 2.4s ease-out infinite}
.ds-wave.w2{animation-delay:-1.2s}
@keyframes ds-wave{0%{transform:scale(1);opacity:.95}100%{transform:scale(1.42);opacity:0}}
.ds-ring{fill:none;stroke-linecap:round;transform-origin:50px 50px}
.ds-ring.a{stroke:#f0abfc;stroke-width:2.2;stroke-dasharray:18 7 4 7 30 34;filter:drop-shadow(0 0 3px #e879f9);animation:dx-spin 5s linear infinite}
.ds-ring.b{stroke:#a5f3fc;stroke-width:1.4;stroke-dasharray:6 10;filter:drop-shadow(0 0 3px #22d3ee);animation:dx-spin 7s linear infinite reverse}
/* galaxie */
.dg-halo{fill:none;stroke:rgba(167,139,250,.45);stroke-width:6;filter:blur(2.5px)}
.dg-arm{fill:none;stroke-linecap:round;animation:dg-flow 3s linear infinite}
.dg-arm.a{stroke:#f0abfc;stroke-width:5;stroke-dasharray:22 6 10 6;filter:drop-shadow(0 0 3px #e879f9)}
.dg-arm.b{stroke:#93c5fd;stroke-width:3;stroke-dasharray:8 5;animation-duration:2.2s;filter:drop-shadow(0 0 3px #60a5fa)}
.dg-arm.c{stroke:#fff;stroke-width:1.5;stroke-dasharray:1 7;animation-duration:4s}
@keyframes dg-flow{to{stroke-dashoffset:-100}}
.dg-planet{fill:#c4b5fd;filter:drop-shadow(0 0 4px #a78bfa)}.dg-moon{fill:#fde68a}
.dg-star{fill:#fff;filter:drop-shadow(0 0 2px #c4b5fd);animation:fx-tw2 2.4s ease-in-out infinite var(--dl)}
/* ténèbres */
.da-mist{fill:none;stroke:rgba(10,0,22,.85);stroke-width:8;filter:blur(2px) drop-shadow(0 0 4px #7c3aed)}
.da-t{fill:none;stroke:#07000f;stroke-width:4.5;stroke-linecap:round;filter:drop-shadow(0 0 2px #a855f7) drop-shadow(0 0 5px #6d28d9)}
.da-t2{fill:none;stroke:#a855f7;stroke-width:.7;stroke-linecap:round;opacity:.8}
.da-t,.da-t2{transform-box:fill-box;transform-origin:50% 100%;animation:da-sway 2.6s ease-in-out infinite alternate var(--dl)}
@keyframes da-sway{0%{transform:rotate(-9deg) scaleY(.88)}100%{transform:rotate(9deg) scaleY(1.08)}}
.da-orb{fill:#e9d5ff;filter:drop-shadow(0 0 2px #c084fc) drop-shadow(0 0 4px #7c3aed);animation:da-orb var(--t) ease-in-out infinite var(--dl)}
@keyframes da-orb{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-5px);opacity:1}}
/* cornes de l'enfer */
.dh-horn{fill:#3b0606;stroke:#f97316;stroke-width:.9;filter:drop-shadow(0 0 2px #ef4444) drop-shadow(0 0 6px rgba(249,115,22,.7))}
.dh-rid{fill:none;stroke:#fb923c;stroke-width:.7;opacity:.85}
.dh-horns{animation:dh-pulse 2.2s ease-in-out infinite}
@keyframes dh-pulse{50%{filter:brightness(1.35)}}
/* ailes divines */
.dv-f{fill:#fffdf5;stroke:#facc15;stroke-width:.5;filter:drop-shadow(0 0 2px rgba(253,224,71,.9))}
.dv-wing{animation:dv-flap 2.6s ease-in-out infinite}
.dv-wing.l{transform-origin:17px 50px}.dv-wing.r{transform-origin:83px 50px;animation-name:dv-flap-r}
@keyframes dv-flap{50%{transform:rotate(-9deg)}}
@keyframes dv-flap-r{50%{transform:rotate(9deg)}}
/* foudre de zeus */
.dz-ring{fill:none;stroke:#bfdbfe;stroke-width:1.4;filter:drop-shadow(0 0 3px #3b82f6);animation:dz-flick 1.2s steps(6) infinite}
.dz-ring2{fill:none;stroke:#93c5fd;stroke-width:1;stroke-dasharray:3 5 1 6;transform-origin:50px 50px;animation:dx-spin 3s linear infinite}
@keyframes dz-flick{0%,100%{opacity:1}30%{opacity:.4}60%{opacity:.9}80%{opacity:.5}}
.dz-bolt{fill:none;stroke:#fff;stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 0 2px #93c5fd) drop-shadow(0 0 5px #3b82f6);opacity:0;animation:dz-bolt 1.75s linear infinite var(--dl)}
@keyframes dz-bolt{0%,55%,100%{opacity:0}58%{opacity:1}62%{opacity:.2}66%{opacity:1}74%{opacity:0}}
.dz-spark{fill:#e0f2fe;filter:drop-shadow(0 0 2px #38bdf8);animation:dz-flick .8s steps(3) infinite var(--dl)}
/* trou noir */
.db-lens{fill:none;stroke:rgba(251,146,60,.35);stroke-width:7;filter:blur(3px);animation:fx-breathe 3s ease-in-out infinite}
.db-photon{fill:none;stroke:#ffedd5;stroke-width:1.6;filter:drop-shadow(0 0 2px #fb923c) drop-shadow(0 0 5px #ea580c)}
.db-disk{fill:none;stroke-linecap:round;animation:dg-flow 1.6s linear infinite}
.db-disk.a{stroke:#fb923c;stroke-width:7;stroke-dasharray:30 4 12 4;filter:drop-shadow(0 0 4px #f97316)}
.db-disk.b{stroke:#fff7ed;stroke-width:2.5;stroke-dasharray:10 6;animation-duration:1.1s}
.db-disk.c{stroke:#9a3412;stroke-width:3;stroke-dasharray:4 8;animation-duration:2.2s}
.db-p{fill:#fed7aa;filter:drop-shadow(0 0 2px #f97316)}
/* éclipse */
.de-corona{fill:none;stroke:rgba(254,243,199,.55);stroke-width:9;filter:blur(3.5px);animation:fx-breathe 3.5s ease-in-out infinite}
.de-ray{stroke:#fef3c7;stroke-width:1.1;stroke-linecap:round;filter:drop-shadow(0 0 2px #fbbf24);animation:de-ray 2s ease-in-out infinite var(--dl)}
@keyframes de-ray{50%{opacity:.25}}
.de-rim{fill:none;stroke:#0b0814;stroke-width:3.2}
@media (prefers-reduced-motion:reduce){.pfx *,.adeco *{animation:none!important}}
/* ===================== BOUTIQUE ===================== */
.shop{display:flex;flex-direction:column;gap:22px}
.sh-hero{position:relative;overflow:hidden;border-radius:12px;min-height:240px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px 32px;border:1px solid var(--line-strong)}
.sh-hero-bg{position:absolute;inset:0;background:radial-gradient(70% 120% at 80% 30%,#2a1458,#0a0618 70%)}
.sh-hero .pfx{z-index:0}
.sh-hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,4,14,.9) 0%,rgba(8,4,14,.55) 45%,transparent 100%)}
.sh-hero-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;max-width:520px}

.sh-hero-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}

.sh-feat-tag{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid var(--line-strong);font-size:.82rem;font-weight:700;color:#e9d5ff}

.sh-tabs button .ico{width:17px;height:17px}

.sh-tabs button[aria-selected="true"]{color:#fff;background:var(--accent);box-shadow:0 8px 20px -10px var(--accent-glow)}
.sh-equipped{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:7px;background:rgba(139,92,246,.1);border:1px solid var(--line-strong);font-size:.9rem}
.sh-equipped .ico{width:16px;height:16px;color:var(--accent-hi)}
.sh-sec{display:flex;flex-direction:column;gap:12px}
