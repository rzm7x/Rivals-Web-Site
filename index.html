<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIVALS</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0b0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout : fond quasi noir, halo violet fixe au centre, contenu en colonne centrée (max 1120px), nav haute sur ordinateur, barre d'onglets basse sur mobile. */
:root{
  --bg:#0b0b0e;
  --surface:#121216;
  --surface-2:#1a1a20;
  --surface-3:#212128;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.14);
  --text:#ededf2;
  --muted:#a0a0ab;
  --faint:#6e6e7a;
  --accent:#8b5cf6;
  --accent-press:#7646ee;
  --accent-hi:#b39dff;
  --accent-soft:rgba(139,92,246,.12);
  --accent-glow:rgba(139,92,246,.16);
  --ok:#3ecf8e; --warn:#f0b450; --bad:#f2576f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(55% 42% at 50% 40%, rgba(130,64,246,.42) 0%, rgba(92,34,190,.18) 42%, transparent 72%),
    radial-gradient(90% 60% at 50% 115%, rgba(70,24,140,.40), transparent 65%),
    radial-gradient(60% 50% at 0% 0%, rgba(50,18,100,.35), transparent 60%),
    var(--bg);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(205,205,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(205,205,220,.05) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 40%,#000 15%,transparent 75%);
          mask-image:radial-gradient(ellipse 70% 55% at 50% 40%,#000 15%,transparent 75%);
}
a{color:var(--accent-hi);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.6rem)}
h2{font-size:1.15rem}
h3{font-size:.95rem}
p{margin:0}
.ico{width:1.15em;height:1.15em;flex:none}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-family:var(--f-mono);font-size:.92em}
.accent{color:var(--accent-hi)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;
  padding:14px max(20px,calc((100% - 1120px)/2));
  background:rgba(11,11,14,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.14em;color:var(--text);display:flex;align-items:center;gap:10px}
.logo:hover{text-decoration:none}
.logo-mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#5b21b6);box-shadow:0 0 18px var(--accent-glow);font-size:.8rem;letter-spacing:0}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{color:var(--muted);font-weight:600;font-size:.94rem;padding:8px 14px;border-radius:10px;display:flex;gap:8px;align-items:center}
.nav a:hover{color:var(--text);background:var(--surface-2);text-decoration:none}
.nav a[aria-current="page"]{color:var(--text);background:rgba(139,92,246,.2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:.92rem}
.user-chip:hover{text-decoration:none;border-color:var(--line-strong)}
.user-chip .avatar{width:30px;height:30px;border-radius:10px;font-size:.8rem}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:40px 20px 48px}
main:focus{outline:none}
.footer{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;padding:18px 20px 28px;color:var(--faint);font-size:.82rem}
.tabbar{display:none}

/* ---------- Buttons ---------- */
.btn{
  --bh:46px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--bh);padding:0 22px;
  border-radius:7px;border:1px solid transparent;font:600 .95rem/1 var(--f-body);cursor:pointer;color:var(--text);
  transition:transform .15s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;white-space:nowrap;text-decoration:none
}
.btn:hover{text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);box-shadow:0 8px 28px -8px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:hover:not([disabled]){box-shadow:0 10px 36px -6px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.3);background:var(--accent)}
.btn-ghost{background:var(--surface-2);border-color:var(--line)}
.btn-ghost:hover:not([disabled]){border-color:var(--line-strong);background:rgba(36,36,44,.7)}
.btn-danger{background:rgba(255,96,121,.12);border-color:rgba(255,96,121,.35);color:#ffc2cc}
.btn-danger:hover:not([disabled]){background:rgba(255,96,121,.2)}
.btn-ok{background:rgba(65,221,156,.14);border-color:rgba(65,221,156,.4);color:#bff5dc}
.btn-ok:hover:not([disabled]){background:rgba(65,221,156,.22)}
.btn-sm{--bh:36px;padding:0 14px;font-size:.86rem;border-radius:6px}
.btn-xl{--bh:58px;padding:0 34px;font-size:1.05rem;border-radius:8px}
.btn-block{width:100%}
.btn-icon{--bh:36px;width:36px;padding:0;border-radius:6px}
.spinner{width:1.1em;height:1.1em;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Cards / pills ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font:600 .74rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-hi)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:10px;font-size:.78rem;font-weight:700;letter-spacing:.02em;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-pending{color:var(--warn);background:rgba(246,187,79,.1)}
.pill-reported{color:var(--accent-hi);background:rgba(139,92,246,.14)}
.pill-finished{color:var(--ok);background:rgba(65,221,156,.1)}
.pill-disputed{color:var(--bad);background:rgba(255,96,121,.1)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag-me{background:rgba(139,92,246,.22);color:#e3d6ff;border-color:var(--line-strong)}

/* ---------- Page head ---------- */
.page-head{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.page-head p{color:var(--muted);max-width:60ch}
.page-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:600;font-size:.9rem}
.field .opt{color:var(--faint);font-weight:500}
.input-wrap{position:relative;display:flex}
.input{
  width:100%;min-height:48px;padding:0 14px;border-radius:7px;background:rgba(14,14,17,.7);border:1px solid var(--line);
  color:var(--text);font:500 1rem var(--f-body);transition:border-color .2s,box-shadow .2s
}
.input::placeholder{color:var(--faint)}
.input:hover{border-color:var(--line-strong)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.22)}
.input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 4px rgba(255,96,121,.14)}
.input-wrap .input{padding-right:48px}
.input-wrap .btn-icon{position:absolute;right:6px;top:6px;background:transparent;border:0;color:var(--muted)}
.input-wrap .btn-icon:hover{color:var(--text);background:var(--surface-2)}
.hint{font-size:.82rem;color:var(--faint)}
.error{font-size:.84rem;color:#ff9aab;display:flex;gap:6px;align-items:flex-start}
.error:empty{display:none}
.form-stack{display:flex;flex-direction:column;gap:18px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:7px;font-size:.92rem;border:1px solid}
.alert .ico{margin-top:2px}
.alert-error{background:rgba(255,96,121,.1);border-color:rgba(255,96,121,.35);color:#ffd0d8}
.alert-info{background:rgba(139,92,246,.1);border-color:var(--line-strong);color:#e2d7ff}
.alert-warn{background:rgba(246,187,79,.08);border-color:rgba(246,187,79,.35);color:#fde5b8}
.alert-ok{background:rgba(65,221,156,.08);border-color:rgba(65,221,156,.35);color:#c9f6e2}
.alert b{color:#fff}
.alert[hidden]{display:none}
.alert-body{display:flex;flex-direction:column;gap:10px;flex:1}
.alert-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Auth ---------- */
.auth{min-height:calc(100vh - 160px);display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.wordmark{
  font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,6.4rem);letter-spacing:.06em;line-height:.95;
  background:linear-gradient(180deg,#fff 30%,#c9b2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 32px rgba(139,92,246,.55))
}
.auth-brand{display:flex;flex-direction:column;gap:22px}
.auth-brand .tagline{font-size:1.15rem;color:var(--muted);max-width:34ch}
.auth-points{display:flex;flex-direction:column;gap:12px;margin:8px 0 0;padding:0;list-style:none}
.auth-points li{display:flex;gap:12px;align-items:center;color:#d9d1ee;font-weight:500}
.auth-points .ico{color:var(--accent-hi)}
.auth-card{padding:34px;max-width:460px;width:100%;justify-self:end;box-shadow:0 30px 80px -30px rgba(0,0,0,.8),0 0 0 1px rgba(205,205,220,.05)}
.auth-card h1{font-size:1.6rem}
.auth-switch{text-align:center;color:var(--muted);font-size:.92rem}

/* ---------- Menu ---------- */
.tiles{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:auto auto;gap:18px}
.tile{
  position:relative;display:flex;flex-direction:column;gap:14px;padding:28px;border-radius:10px;color:var(--text);
  background:var(--surface);border:1px solid var(--line);overflow:hidden;min-height:170px;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.tile:hover{text-decoration:none;transform:translateY(-3px);border-color:var(--line-strong);box-shadow:0 18px 50px -20px var(--accent-glow)}
.tile-main{grid-row:span 2;min-height:360px;justify-content:flex-end;
  background:radial-gradient(80% 70% at 70% 20%,rgba(139,92,246,.45),transparent 70%),linear-gradient(160deg,rgba(30,28,40,.6),rgba(18,18,22,.85))}
.tile-main h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.tile-icon{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;background:rgba(139,92,246,.18);border:1px solid var(--line-strong);color:var(--accent-hi)}
.tile-icon .ico{width:22px;height:22px}
.tile-main .tile-icon{position:absolute;top:28px;left:28px}
.tile p{color:var(--muted)}
.tile-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.tile-cta{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--accent-hi)}
.tile-big-glyph{position:absolute;right:-10px;top:-20px;font-family:var(--f-display);font-weight:800;font-size:9rem;line-height:1;color:rgba(205,205,220,.07);letter-spacing:-.04em;pointer-events:none}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{padding:18px 20px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.stat-val{font:700 1.6rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat-label{font-size:.82rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- Segmented ---------- */
.seg{display:inline-flex;padding:4px;border-radius:8px;background:rgba(14,14,17,.7);border:1px solid var(--line);gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 .95rem var(--f-display);letter-spacing:.04em;padding:10px 22px;border-radius:6px;cursor:pointer;transition:background .2s,color .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 6px 20px -8px var(--accent-glow)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Matchmaking ---------- */
.mm-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.mm-stage{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:40px 24px;position:relative;overflow:hidden}
.mm-stage h2{font-size:clamp(1.3rem,2.6vw,1.8rem)}
.mm-stage p{color:var(--muted);max-width:44ch}
.choice-list{display:grid;gap:10px;width:100%;max-width:460px;text-align:left}
.choice{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:7px;border:1px solid var(--line);background:rgba(14,14,17,.55);cursor:pointer;transition:border-color .2s,background .2s}
.choice:hover{border-color:var(--line-strong)}
.choice input{accent-color:var(--accent);margin-top:4px;width:18px;height:18px}
.choice:has(input:checked){border-color:var(--accent);background:rgba(139,92,246,.12)}
.choice b{display:block}
.choice span{color:var(--muted);font-size:.88rem}
.radar{position:relative;width:180px;height:180px;display:grid;place-items:center}
.radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(205,205,220,.0) 0deg,rgba(205,205,220,.35) 60deg,transparent 61deg);animation:spin 2.4s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);mask:radial-gradient(circle,#000 69%,transparent 70%)}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line-strong);animation:pulse 2.4s ease-out infinite;opacity:0}
.radar .ring:nth-child(2){animation-delay:.8s}
.radar .ring:nth-child(3){animation-delay:1.6s}
.radar-core{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#7c4af0,#3b1690);box-shadow:0 0 40px var(--accent-glow);font:800 1rem var(--f-display);letter-spacing:.04em}
@keyframes pulse{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.timer{font:700 2.2rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.slots{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.slot-team{display:flex;gap:8px}
.slot{width:56px;height:56px;border-radius:8px;border:1px dashed var(--line-strong);display:grid;place-items:center;color:var(--faint);font:700 .9rem var(--f-display);transition:all .3s ease}
.slot.filled{border-style:solid;border-color:var(--accent);background:rgba(139,92,246,.2);color:#fff;box-shadow:0 0 20px -6px var(--accent-glow)}
.slot.me{background:var(--accent);border-color:transparent}
.vs{font:800 1rem var(--f-display);color:var(--accent-hi);letter-spacing:.08em}
.rules{display:flex;flex-direction:column;gap:12px}
.rules ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.rules li::marker{color:var(--accent-hi)}

/* ---------- Match ---------- */
.match-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.match-head h1{font-size:clamp(1.5rem,3.4vw,2.3rem)}
.match-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:stretch}
.team{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative}
.team.winner{border-color:rgba(65,221,156,.55);box-shadow:0 0 0 1px rgba(65,221,156,.2),0 20px 50px -25px rgba(65,221,156,.5)}
.team-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.team-name{font:700 .8rem var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-hi)}
.team-b .team-name{color:#ff9dd8}
.win-badge{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;font-size:.82rem}
.vs-col{display:grid;place-items:center}
.vs-big{font:800 1.6rem var(--f-display);color:#fff;text-shadow:0 0 24px var(--accent-glow);letter-spacing:.06em}
.player{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:7px;background:rgba(14,14,17,.6);border:1px solid var(--line)}
.player-top{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:7px;display:grid;place-items:center;font:700 1rem var(--f-display);flex:none;color:#fff}
.player-ids{display:flex;flex-direction:column;gap:6px}
.id-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 8px 8px 12px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(205,205,220,.08)}
.id-row .k{font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.id-row .v{font-family:var(--f-mono);font-size:.92rem;word-break:break-all}
.id-row .v.missing{color:var(--faint);font-family:var(--f-body);font-style:italic}
.copy-btn{display:inline-flex;align-items:center;gap:6px;flex:none}
.copy-btn.done{color:var(--ok);border-color:rgba(65,221,156,.5)}
.status-banner{margin:22px 0}
.match-actions{display:flex;gap:10px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:22px;align-items:start}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.timeline li{display:grid;grid-template-columns:12px 1fr;gap:12px;font-size:.92rem}
.timeline li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow);margin-top:6px}
.timeline time{display:block;color:var(--faint);font-size:.8rem}
.chat{display:flex;flex-direction:column;gap:12px}
.chat .card-head{margin-bottom:0}
.chat-log{height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:7px;background:rgba(6,4,12,.6);border:1px solid var(--line)}
.chat-empty{margin:auto;text-align:center;color:var(--faint);font-size:.9rem;max-width:34ch;display:flex;flex-direction:column;align-items:center;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:85%}
.msg .avatar{width:30px;height:30px;border-radius:9px;font-size:.75rem}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:9px 13px;border-radius:14px 14px 14px 4px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.msg.mine .bubble{border-radius:14px 14px 4px 14px;background:linear-gradient(180deg,rgba(155,109,255,.42),rgba(116,64,234,.34));border-color:rgba(205,205,220,.4)}
.bubble-meta{font-size:.74rem;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.bubble-meta b{color:var(--text);font-weight:700}
.msg.mine .bubble-meta{justify-content:flex-end}
.bubble-text{overflow-wrap:anywhere;white-space:pre-wrap}
.chat-quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(14,14,17,.6);color:var(--muted);border-radius:10px;padding:6px 12px;font:600 .82rem var(--f-body);cursor:pointer;transition:color .2s,border-color .2s}
.chip:hover{color:var(--text);border-color:var(--line-strong)}
.chat-form{display:flex;gap:8px}
.chat-form .input{flex:1;min-width:0}
.live-dot{display:inline-flex;align-items:center;gap:6px}
.live-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.live-dot.off::before{background:var(--bad);box-shadow:none}
.rank-badge{display:inline-flex;align-items:center;gap:12px;min-width:0}
.rank-badge b{display:block;font-family:var(--f-display);font-size:.95rem;letter-spacing:.01em;white-space:nowrap}
.rank-badge small{display:block;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.emblem{flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.player-top .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.player-top .grow > div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rank-chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600}
.delta{font:700 .78rem var(--f-display);padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{color:var(--ok);background:rgba(65,221,156,.12)}
.delta.down{color:var(--bad);background:rgba(255,96,121,.12)}
.rank-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.rank-card{display:flex;flex-direction:column;gap:12px;color:var(--text)}
.rank-card:hover{text-decoration:none;border-color:var(--line-strong)}
.decl-list{display:flex;flex-direction:column;gap:10px}
.decl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:7px;background:rgba(14,14,17,.55);border:1px solid var(--line);flex-wrap:wrap;font-size:.92rem}
.pill-cancelled{color:var(--faint);background:rgba(255,255,255,.04)}
.nav-badge[hidden]{display:none}
.nav-badge{min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:800;display:inline-grid;place-items:center;line-height:1}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ps-mode{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:8px;background:rgba(14,14,17,.55);border:1px solid var(--line)}
.ps-mode.current{border-color:var(--line-strong);box-shadow:0 0 0 1px rgba(139,92,246,.25)}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini-stats div{display:flex;flex-direction:column}
.mini-stats b{font:700 1.05rem var(--f-display);font-variant-numeric:tabular-nums}
.mini-stats span{font-size:.72rem;color:var(--muted)}
.dispute{display:flex;flex-direction:column;gap:16px}
.dispute-teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dispute-team{padding:14px;border-radius:7px;background:rgba(14,14,17,.55);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.chat-peek{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:7px;background:rgba(6,4,12,.6);border:1px solid var(--line)}
.chat-peek b{color:var(--text)}
.modal-wide{max-width:640px}
.demo{border-style:dashed;border-color:rgba(246,187,79,.4);background:rgba(40,28,10,.35)}
.demo .eyebrow{color:var(--warn)}

/* ---------- Profile ---------- */
.profile-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.avatar-xl{width:76px;height:76px;border-radius:10px;font-size:1.8rem;box-shadow:0 0 40px -8px var(--accent-glow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.mode-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mode-stats .stat{padding:14px}
.mode-stats .stat-val{font-size:1.3rem}
.bar{height:6px;border-radius:10px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:12px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#7440ea,#bb9bff);border-radius:inherit}
.history{display:flex;flex-direction:column;gap:8px}
.history a{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:7px;background:rgba(14,14,17,.55);border:1px solid var(--line);color:var(--text)}
.history a:hover{text-decoration:none;border-color:var(--line-strong)}
.res{font:800 .78rem var(--f-display);letter-spacing:.06em;width:34px;height:34px;border-radius:6px;display:grid;place-items:center}
.res-w{background:rgba(65,221,156,.15);color:var(--ok)}
.res-l{background:rgba(255,96,121,.13);color:var(--bad)}
.res-p{background:rgba(246,187,79,.12);color:var(--warn)}

/* ---------- Leaderboard ---------- */
.lb-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.lb-search{position:relative;flex:1;min-width:200px;max-width:340px}
.lb-search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.lb-search .input{padding-left:42px}
.check{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:.92rem;cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:18px;height:18px}
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:700 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 18px;border-bottom:1px solid rgba(205,205,220,.07);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr:hover{background:rgba(139,92,246,.06)}
tr.is-me{background:rgba(139,92,246,.14)}
tr.is-me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rank{font:800 .95rem var(--f-display);display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:6px;background:rgba(255,255,255,.04)}
.rank-1{background:linear-gradient(135deg,#ffd76a,#c9921f);color:#2a1a00}
.rank-2{background:linear-gradient(135deg,#e9e6f5,#9d98b3);color:#1b1726}
.rank-3{background:linear-gradient(135deg,#f0a874,#a35a2a);color:#2a1305}
.lb-player{display:flex;align-items:center;gap:12px;font-weight:600}
.lb-player .avatar{width:32px;height:32px;border-radius:9px;font-size:.8rem}
.lb-me{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px}

/* ---------- Empty / loading ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:56px 24px}
.empty-icon{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;background:rgba(139,92,246,.14);border:1px solid var(--line-strong);color:var(--accent-hi)}
.empty-icon .ico{width:28px;height:28px}
.empty p{color:var(--muted);max-width:42ch}
.loading{display:flex;align-items:center;justify-content:center;gap:14px;padding:80px 0;color:var(--muted)}
#rv-boot{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 42%,#1a1430 0%,#0b0b0e 62%);transition:opacity .4s ease,visibility .4s}
#rv-boot.off{opacity:0;visibility:hidden}#rv-boot canvas{width:100%;height:100%;display:block}
.rv-loading{flex-direction:column;gap:10px}.rv-loading canvas{width:84px;height:84px;margin:-10px 0}.rv-loading span{font:600 .9rem var(--f-body,inherit);letter-spacing:.02em}
.loading .spinner{width:22px;height:22px;border-color:rgba(205,205,220,.25);border-top-color:var(--accent-hi)}
.skeleton{border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Toast / modal ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:calc(100vw - 40px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:7px;background:rgba(24,15,42,.96);border:1px solid var(--line-strong);box-shadow:0 18px 40px -12px rgba(0,0,0,.7);font-weight:600;font-size:.92rem;animation:toastIn .25s ease}
.toast-ok .ico{color:var(--ok)}
.toast-error .ico{color:var(--bad)}
.toast-info .ico{color:var(--accent-hi)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(4,2,10,.72);display:grid;place-items:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;background:#130c22;border:1px solid var(--line-strong);border-radius:10px;padding:28px;box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 0 80px -40px var(--accent-glow);display:flex;flex-direction:column;gap:18px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h2{font-size:1.25rem}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.result-summary{display:grid;gap:10px}
.result-line{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:7px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:.92rem;flex-wrap:wrap}
.result-line b{font-weight:700}
.limits{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;color:#d6cfe8;font-size:.93rem}

/* ---------- Responsive ---------- */
@media (max-width:960px){
  .auth{grid-template-columns:1fr;gap:32px;min-height:auto}
  .auth-card{justify-self:stretch;max-width:none}
  .auth-points{display:none}
  .mm-grid,.split,.grid-2{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:720px){
  main{padding:26px 16px 110px}
  .nav,.user-chip .uname{display:none}
  .user-chip{padding:4px}
  .topbar{padding:12px 16px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(9,6,16,.92);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--faint);font-size:.72rem;font-weight:700;border-radius:6px}
  .tabbar a .ico{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:#fff;background:rgba(139,92,246,.2)}
  .tabbar a:hover{text-decoration:none}
  .footer{padding-bottom:96px}
  .tiles{grid-template-columns:1fr}
  .tile-main{grid-row:auto;min-height:260px}
  .teams,.rank-row,.ps-grid,.dispute-teams{grid-template-columns:1fr}
  .mini-stats{grid-template-columns:repeat(2,1fr)}
  .vs-col{padding:0}
  .vs-big{font-size:1.2rem}
  .mode-stats{grid-template-columns:repeat(2,1fr)}
  .card{padding:20px}
  .auth-card{padding:24px}
  #toasts{left:16px;right:16px;bottom:84px}
  .hide-sm{display:none}
  .history a{grid-template-columns:auto 1fr}
  .history a .pill{grid-column:2;justify-self:start}
  th,td{padding:12px 12px}
  .seg button{padding:10px 18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .radar::before{display:none}
  .radar .ring{opacity:.6;transform:scale(.9)}
}

/* ===================== V3 : animations et finitions ===================== */
.orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:drift 24s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:440px;height:440px;left:6%;top:10%;background:rgba(124,58,237,.45)}
.orbs i:nth-child(2){width:360px;height:360px;right:4%;top:38%;background:rgba(192,38,211,.26);animation-duration:30s;animation-delay:-8s}
.orbs i:nth-child(3){width:320px;height:320px;left:38%;bottom:-10%;background:rgba(79,70,229,.32);animation-duration:27s;animation-delay:-14s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.15)}100%{transform:translate(-50px,60px) scale(.92)}}
body::before{animation:breathe 10s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.82;transform:scale(1)}to{opacity:1;transform:scale(1.07)}}

#view.enter > *, #view.enter .stagger > *{animation:rise .65s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 75ms)}
#view.enter tbody tr{animation:rise .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(120ms + var(--r,0) * 30ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(36px) scale(.96)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}}
.modal{animation:pop .35s cubic-bezier(.16,1,.3,1)}
.slot.filled{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}

.btn{position:relative;overflow:hidden;isolation:isolate}
.btn:hover:not([disabled]){transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(1px) scale(.98)}
.btn-primary::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);transition:transform .75s ease}
.btn-primary:hover:not([disabled])::after{transform:translateX(120%)}
.player,.rank-card,.ps-mode,.decl,.history a,.quick{transition:transform .28s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .28s}
.player:hover,.ps-mode:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.rank-card:hover{transform:translateY(-3px);box-shadow:0 18px 50px -24px var(--accent-glow)}
.history a:hover{transform:translateX(3px)}

/* Menu */
.play-hero{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:center;padding:clamp(26px,4vw,44px);border-radius:12px;overflow:hidden;
  background:radial-gradient(80% 120% at 88% 0%,rgba(139,92,246,.55),transparent 60%),linear-gradient(160deg,rgba(56,28,112,.8),rgba(15,9,28,.92));border:1px solid var(--line-strong);box-shadow:0 30px 80px -40px rgba(139,92,246,.6)}
.play-hero h1{font-size:clamp(2rem,5vw,3.4rem)}
.play-btn{--bh:70px;font:800 1.2rem var(--f-display);letter-spacing:.14em;padding:0 44px;border-radius:10px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 10px 40px -10px var(--accent-glow),0 0 0 0 rgba(139,92,246,.45)}50%{box-shadow:0 14px 60px -8px var(--accent-glow),0 0 0 12px rgba(139,92,246,0)}}
.hero-vs{font:800 clamp(5rem,13vw,10rem)/.8 var(--f-display);color:transparent;-webkit-text-stroke:1.5px rgba(205,205,220,.4);text-align:right;animation:floaty 6s ease-in-out infinite;user-select:none}
@keyframes floaty{50%{transform:translateY(-12px)}}
.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quick{display:flex;align-items:center;gap:16px;padding:20px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.quick:hover{text-decoration:none;border-color:var(--line-strong);transform:translateY(-3px);box-shadow:0 16px 40px -22px var(--accent-glow)}
.quick .arrow{margin-left:auto;color:var(--accent-hi);transition:transform .25s}
.quick:hover .arrow{transform:translateX(5px)}
.stagger{display:flex;flex-direction:column;gap:18px}

/* Résultat du match */
.result-panel{padding:24px;border-radius:10px;border:1px solid var(--line-strong);background:linear-gradient(160deg,rgba(45,24,90,.72),rgba(15,9,28,.88));display:flex;flex-direction:column;gap:18px;margin:22px 0}
.result-panel h2{font-size:1.25rem}
.dispute-panel{border-color:rgba(255,96,121,.45);background:linear-gradient(160deg,rgba(80,20,38,.6),rgba(15,9,28,.9))}
.result-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice-big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:128px;border-radius:10px;border:1px solid;cursor:pointer;color:#fff;font:800 1.3rem var(--f-display);letter-spacing:.1em;transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .25s,filter .2s}
.choice-big .ico{width:30px;height:30px}
.choice-big small{font:600 .82rem var(--f-body);letter-spacing:0;opacity:.8}
.choice-big:hover{transform:translateY(-4px)}
.choice-big:active{transform:scale(.98)}
.choice-win{background:linear-gradient(160deg,rgba(65,221,156,.24),rgba(18,80,58,.4));border-color:rgba(65,221,156,.5)}
.choice-win:hover{box-shadow:0 20px 50px -18px rgba(65,221,156,.75)}
.choice-loss{background:linear-gradient(160deg,rgba(255,96,121,.22),rgba(92,20,36,.4));border-color:rgba(255,96,121,.5)}
.choice-loss:hover{box-shadow:0 20px 50px -18px rgba(255,96,121,.75)}
.result-final{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.result-word{font:800 clamp(2.2rem,6vw,3.4rem)/1 var(--f-display);letter-spacing:.06em;-webkit-background-clip:text;background-clip:text;color:transparent}
.result-word.win{background-image:linear-gradient(180deg,#fff 20%,#86f2c6)}
.result-word.loss{background-image:linear-gradient(180deg,#fff 20%,#ff98ab)}
.dots{display:inline-flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent-hi);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
details.hist summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary .ico{transition:transform .25s}
details.hist[open] summary .ico{transform:rotate(90deg)}
details.hist[open] .timeline{margin-top:18px;animation:rise .4s both}

/* Effets plein écran */
#fx-root{position:fixed;inset:0;z-index:80;pointer-events:none}
.fx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(circle at 50% 45%,rgba(40,18,80,.75),rgba(4,2,10,.92));animation:fade .3s ease both;overflow:hidden}
.fx.out{animation:fadeOut .45s ease forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.fx-found-title{font:800 clamp(.95rem,2.2vw,1.25rem) var(--f-display);letter-spacing:.55em;text-transform:uppercase;color:var(--accent-hi);animation:rise .5s .1s both;text-align:center}
.fx-found-row{display:flex;align-items:center;justify-content:center;gap:clamp(18px,6vw,70px)}
.fx-side{display:flex;flex-direction:column;gap:16px;align-items:center}
.fx-side.left{animation:slideL .65s cubic-bezier(.16,1,.3,1) .15s both}
.fx-side.right{animation:slideR .65s cubic-bezier(.16,1,.3,1) .15s both}
@keyframes slideL{from{opacity:0;transform:translateX(-45vw)}}
@keyframes slideR{from{opacity:0;transform:translateX(45vw)}}
.fx-player{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.fx-player .avatar{width:84px;height:84px;border-radius:12px;font-size:2rem;box-shadow:0 0 50px -6px var(--accent-glow)}
.fx-vs{font:800 clamp(3rem,9vw,6rem)/1 var(--f-display);color:#fff;text-shadow:0 0 40px var(--accent-glow);animation:slam .5s cubic-bezier(.34,1.56,.64,1) .6s both}
@keyframes slam{from{opacity:0;transform:scale(3) rotate(-8deg)}to{opacity:1;transform:none}}
.fx-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(205,205,220,.5),transparent 60%);animation:flash .8s ease .6s both;pointer-events:none}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.fx-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:20px}
.fx-title{font:800 clamp(3rem,12vw,8rem)/1 var(--f-display);letter-spacing:.08em;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn .9s cubic-bezier(.16,1,.3,1) both}
@keyframes titleIn{from{opacity:0;letter-spacing:.55em;filter:blur(14px);transform:scale(1.12)}}
.fx-result.win .fx-title{background-image:linear-gradient(180deg,#fff 20%,#a3f6d2 60%,#a78bfa)}
.fx-result.loss .fx-title{background-image:linear-gradient(180deg,#fff 20%,#ff9cb0 75%)}
.fx-result.loss{background:radial-gradient(circle at 50% 45%,rgba(80,16,34,.75),rgba(4,2,10,.94))}
.fx-rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(rgba(205,205,220,.11) 0 5deg,transparent 5deg 15deg);animation:spin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 50%);mask:radial-gradient(circle,#000 0,transparent 50%)}
.fx-delta{font:800 2rem var(--f-display);font-variant-numeric:tabular-nums;animation:rise .6s .35s both}
.fx-delta.up{color:var(--ok);text-shadow:0 0 24px rgba(65,221,156,.5)}
.fx-delta.down{color:var(--bad);text-shadow:0 0 24px rgba(255,96,121,.45)}
.fx-sub{animation:rise .6s .55s both}
.fx-result .btn{animation:rise .6s .8s both}
.spark{position:absolute;left:50%;top:42%;width:9px;height:9px;border-radius:2px;background:var(--c);opacity:0;animation:burst 1.5s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}}

@media (max-width:720px){
  .play-hero{grid-template-columns:1fr}
  .hero-vs{display:none}
  .quick-links{grid-template-columns:1fr}
  .choice-big{min-height:110px;font-size:1.1rem}
  .fx-player .avatar{width:64px;height:64px;font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){
  .orbs,.fx-rays,.spark{display:none}
}

/* ===================== V4 : espace profil, avatars, chat ===================== */
img.avatar{object-fit:cover;display:block;background:#1d1533}
.avatar.vip{box-shadow:0 0 0 2px #0b0714,0 0 0 4px #f6bb4f,0 0 18px rgba(246,187,79,.45)}
.vip-tag{background:linear-gradient(135deg,#ffe07a,#c9921f);color:#2a1a00;border:0}
.team-tag{color:var(--faint);font-weight:600}
.balance-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:10px;background:rgba(65,221,156,.1);border:1px solid rgba(65,221,156,.3);color:#c4f7df;font:700 .88rem var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.balance-chip:hover{text-decoration:none;background:rgba(65,221,156,.16)}

.pf{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.pf-side{position:sticky;top:88px;padding:24px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.pf-side-head{padding:0 12px 18px;display:flex;flex-direction:column;gap:4px}
.pf-side-head h2{font-size:1.35rem;overflow-wrap:anywhere}
.pf-balance{color:var(--ok);font:700 1.05rem var(--f-display);font-variant-numeric:tabular-nums}
.pf-nav{display:flex;flex-direction:column;gap:2px}
.pf-nav a{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:7px;color:var(--muted);font-weight:600;transition:background .2s,color .2s}
.pf-nav a .ico{width:20px;height:20px}
.pf-nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.pf-nav a[aria-current="page"]{color:var(--accent-hi);background:rgba(139,92,246,.15)}
.pf-nav .nav-badge{margin-left:auto}
.pf-main{display:flex;flex-direction:column;gap:32px;min-width:0}
.pf-title{font:700 1.4rem var(--f-display);margin-bottom:14px}
.pf-main > section > .pf-title:only-child{margin:0}
.st-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center}
.st-avatar{width:150px;height:150px;border-radius:50%;font-size:3.4rem}
.st-name{font:800 clamp(1.6rem,3.4vw,2.2rem) var(--f-display);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.st-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 10px;min-height:150px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:center}
.st-tile .k{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.st-tile .v{font:800 clamp(1.6rem,3vw,2.3rem)/1 var(--f-display);font-variant-numeric:tabular-nums}
.v-gold{color:#f6bb4f}.v-ok{color:var(--ok)}.v-bad{color:var(--bad)}
.streak{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:10px;background:rgba(246,187,79,.14);color:#ffd27a;font-size:.76rem;font-weight:700}
.streak .ico{width:14px;height:14px}
.ring{position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.05rem var(--f-display);color:var(--ok)}
.ring .fg{transition:stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1)}
.karma-line{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:4px}
.karma-ok{color:var(--ok)}.karma-warn{color:var(--warn)}.karma-bad{color:var(--bad)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badges[hidden]{display:none}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.86rem}
.badge .ico{width:16px;height:16px}
.badge.earned{border-color:rgba(246,187,79,.45);background:rgba(246,187,79,.08);color:#ffe2a1}
.badge.locked{opacity:.55}
.badge small{color:var(--faint);font-weight:500}
.link-btn{background:none;border:0;color:var(--muted);font:600 .86rem var(--f-body);cursor:pointer;padding:4px}
.link-btn:hover{color:var(--text)}
.ranks-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res-badge{display:inline-block;padding:4px 9px;border-radius:6px;font:800 .72rem var(--f-display);letter-spacing:.06em;white-space:nowrap}
.res-badge.win{background:rgba(65,221,156,.14);color:var(--ok)}
.res-badge.loss{background:rgba(255,96,121,.14);color:var(--bad)}
.res-badge.wait{background:rgba(246,187,79,.12);color:var(--warn)}
.res-badge.void{background:rgba(255,255,255,.06);color:var(--faint)}
.elo-up{color:var(--ok);font-weight:700}.elo-down{color:var(--bad);font-weight:700}
.clickable-row{cursor:pointer}
.big-amount{font:800 clamp(2.4rem,6vw,3.6rem)/1 var(--f-display);font-variant-numeric:tabular-nums}
.amount-chips{display:flex;gap:10px;flex-wrap:wrap}
.amount-chips button{border:1px solid var(--line);background:rgba(14,14,17,.6);color:var(--text);border-radius:7px;padding:12px 18px;font:700 .95rem var(--f-display);cursor:pointer;transition:all .2s}
.amount-chips button:hover{border-color:var(--line-strong)}
.amount-chips button[aria-pressed="true"]{border-color:var(--accent);background:rgba(139,92,246,.18);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 22px;border-radius:8px;border:1px dashed var(--line-strong);background:rgba(139,92,246,.08)}
.code-box b{font:800 1.8rem var(--f-mono);letter-spacing:.12em}
.uploader{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.perks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.perks li{display:flex;gap:10px;align-items:center}
.perks .ico{color:#f6bb4f}
.vip-card{background:radial-gradient(90% 120% at 90% 0%,rgba(246,187,79,.18),transparent 60%),var(--surface);border-color:rgba(246,187,79,.35)}
.member{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:7px;background:rgba(14,14,17,.55);border:1px solid var(--line)}
.member .avatar{width:38px;height:38px;border-radius:7px;font-size:.9rem}
.mini-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* Chat plus clair */
.chat-head{display:flex;align-items:center;gap:14px}
.av-stack{display:flex;padding-left:8px}
.av-stack .avatar{width:36px;height:36px;border-radius:50%;border:2px solid #140c26;margin-left:-8px;font-size:.8rem}
.chat-log{height:380px;gap:8px;background:rgba(6,4,12,.45);border:0;border-radius:8px;padding:16px}
.msg{gap:8px}
.msg .avatar{width:30px;height:30px;border-radius:50%;font-size:.72rem}
.avatar-spacer{width:30px;flex:none}
.msg.mine .avatar,.msg.mine .avatar-spacer{display:none}
.msg.cont{margin-top:-4px}
.bubble{background:#1e1636;border:0;border-radius:18px 18px 18px 6px;padding:9px 14px}
.msg.cont .bubble{border-radius:6px 18px 18px 6px}
.msg.mine .bubble{background:var(--accent);border-radius:18px 18px 6px 18px}
.msg.mine.cont .bubble{border-radius:18px 6px 6px 18px}
.msg.mine .bubble-meta{color:rgba(255,255,255,.75)}
.msg:last-child{animation:pop .3s cubic-bezier(.16,1,.3,1)}
.chat-quick{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chat-quick::-webkit-scrollbar{display:none}
.chip{white-space:nowrap}
.chat-form{align-items:center;background:rgba(14,14,17,.7);border:1px solid var(--line);border-radius:10px;padding:5px 5px 5px 18px;transition:border-color .2s,box-shadow .2s}
.chat-form:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.chat-form .input{border:0;background:transparent;min-height:42px;padding:0;box-shadow:none!important}
.send-btn{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;cursor:pointer;color:#fff;background:var(--accent);box-shadow:0 6px 18px -6px var(--accent-glow);transition:transform .15s}
.send-btn:hover{transform:scale(1.07)}
.send-btn:disabled{opacity:.5}

@media (max-width:960px){
  .pf{grid-template-columns:1fr}
  .pf-side{position:static;padding:16px 10px}
  .pf-side-head{flex-direction:row;justify-content:space-between;align-items:baseline}
  .pf-nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .pf-nav a{white-space:nowrap;padding:10px 12px}
}
@media (max-width:720px){
  .st-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .st-name{justify-content:center}.karma-line{justify-content:center}
  .st-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ranks-cards,.mini-kpis{grid-template-columns:1fr}
  .balance-chip{padding:6px 10px;font-size:.8rem}
}

/* ===================== V5 : chat général ===================== */
.gchat{max-width:900px;margin:0 auto;gap:14px}
.gchat .g-log{height:min(62vh,640px)}
.gchat .chat-head .tile-icon{flex:none}
.g-rules{font-size:.8rem;color:var(--faint);text-align:center}
.msg-del{opacity:0;border:0;background:none;color:var(--faint);cursor:pointer;align-self:center;padding:4px;border-radius:8px;transition:opacity .2s,color .2s}
.msg-del .ico{width:14px;height:14px}
.msg:hover .msg-del,.msg-del:focus-visible{opacity:1}
.msg-del:hover{color:var(--bad)}
.msg.mine .msg-del{order:-1}
.day-sep{align-self:center;font-size:.74rem;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;padding:6px 0}

/* ===================== V6 : vue d'ensemble admin ===================== */
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.kpi .k{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:800 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--faint)}
.kpi.live{border-color:rgba(65,221,156,.4);background:radial-gradient(90% 120% at 100% 0%,rgba(65,221,156,.14),transparent 60%),var(--surface)}
.kpi.live .v{color:var(--ok);display:flex;align-items:center;gap:10px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(65,221,156,.6);animation:pulseDot 1.8s infinite}
@keyframes pulseDot{70%{box-shadow:0 0 0 10px rgba(65,221,156,0)}100%{box-shadow:0 0 0 0 rgba(65,221,156,0)}}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:7px;background:rgba(14,14,17,.55);border:1px solid var(--line)}
.prow .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .who b{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.av-wrap{position:relative;flex:none}
.av-wrap .avatar{width:40px;height:40px;border-radius:7px;font-size:.9rem}
.av-wrap i{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2px solid #120b22;background:var(--faint)}
.av-wrap i.on{background:var(--ok)}
.st-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid currentColor}
.st-online{color:var(--ok);background:rgba(65,221,156,.08)}
.st-queue{color:var(--accent-hi);background:rgba(139,92,246,.12)}
.st-match{color:var(--warn);background:rgba(246,187,79,.08);cursor:pointer}
.st-offline{color:var(--faint);background:rgba(255,255,255,.03)}
@media (max-width:960px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.prow{grid-template-columns:auto minmax(0,1fr) auto}.prow .when{display:none}}

/* ===================== V7 : admins en rouge ===================== */
.is-admin{color:#ff5f78 !important;text-shadow:0 0 14px rgba(255,95,120,.35)}
.tag-admin{display:inline-flex;align-items:center;gap:4px;background:rgba(255,95,120,.16);color:#ff8095;border-color:rgba(255,95,120,.5)}
.tag-admin .ico{width:12px;height:12px}
.msg.mine .tag-admin{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.35)}

/* ===================== V9 : page matchmaking ===================== */
h1[tabindex="-1"]:focus,h1[tabindex="-1"]:focus-visible{outline:none}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
@keyframes shine{to{background-position:200% center}}
.mm-page{display:flex;flex-direction:column;gap:22px}
.mm-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.mm-title{font-size:clamp(2.4rem,6vw,4.2rem);line-height:1}
.grad{background:linear-gradient(90deg,#bb9bff,#f472b6,#bb9bff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.live-chips{display:flex;gap:8px;flex-wrap:wrap}
.live-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:rgba(14,14,17,.6);border:1px solid var(--line);font-size:.86rem;color:var(--muted);white-space:nowrap}
.live-chip b{color:var(--text);font-variant-numeric:tabular-nums}
.live-chip .pulse{width:8px;height:8px}
.live-chip .ico{width:15px;height:15px;color:var(--accent-hi)}

.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mode-card{position:relative;isolation:isolate;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:14px;padding:26px;min-height:220px;border-radius:12px;
  background:linear-gradient(160deg,rgba(36,20,70,.7),rgba(15,9,28,.85));border:1px solid var(--line);cursor:pointer;color:var(--text);font:inherit;
  transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s,border-color .3s,opacity .3s}
.mode-card:hover:not([disabled]){transform:translateY(-4px);border-color:var(--line-strong)}
.mode-card[disabled]{cursor:not-allowed;opacity:.55}
.mode-card[disabled][aria-pressed="true"]{opacity:1}
.mode-card > :not(.mode-glyph):not(.mode-check){position:relative;z-index:1}
.mode-check{z-index:2}
.mode-card[aria-pressed="false"]{opacity:.78}
.mode-card[aria-pressed="false"]:hover{opacity:1}
.mode-card[aria-pressed="true"]{border-color:transparent;box-shadow:0 26px 70px -28px var(--accent-glow)}
.mode-card[aria-pressed="true"]::before{content:"";position:absolute;inset:0;z-index:-2;border-radius:inherit;background:conic-gradient(from var(--ang),#8b5cf6,#f472b6,#41dd9c,#8b5cf6);animation:ang 5s linear infinite}
.mode-card[aria-pressed="true"]::after{content:"";position:absolute;inset:2px;z-index:-1;border-radius:10px;background:radial-gradient(90% 90% at 85% 0%,rgba(139,92,246,.35),transparent 60%),linear-gradient(160deg,#25154a,#110a21)}
.mode-glyph{position:absolute;right:-4px;top:-26px;z-index:0;font:800 clamp(6rem,11vw,8.5rem)/1 var(--f-display);color:transparent;-webkit-text-stroke:1.5px rgba(205,205,220,.22);letter-spacing:-.02em;pointer-events:none;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.mode-card:hover .mode-glyph,.mode-card[aria-pressed="true"] .mode-glyph{transform:translateY(6px) scale(1.04)}
.mode-art{display:flex;align-items:center;gap:10px}
.mode-art .side{display:flex}
.mode-art .side > *{margin-left:-10px}
.mode-art .side > *:first-child{margin-left:0}
.mode-art .avatar{width:44px;height:44px;border-radius:50%;font-size:1rem;border:2px solid #150c2a}
.ghost-av{width:44px;height:44px;border-radius:50%;border:2px dashed rgba(205,205,220,.45);display:grid;place-items:center;color:var(--accent-hi);font:800 .95rem var(--f-display);background:rgba(139,92,246,.1)}
.mode-art .vs-mini{font:800 .9rem var(--f-display);color:var(--accent-hi);letter-spacing:.08em}
.mode-name{font:800 1.5rem var(--f-display)}
.mode-desc{color:var(--muted);font-size:.94rem;max-width:36ch}
.mode-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mode-meta span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:#d8d0ee}
.mode-meta .ico{width:14px;height:14px}
.mode-check{position:absolute;top:18px;right:18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.mode-check .ico{width:15px;height:15px}
.mode-card[aria-pressed="true"] .mode-check{transform:scale(1)}

.mm-stage2{position:relative;overflow:hidden;padding:34px 24px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.mm-stage2::before{content:"";position:absolute;inset:-40%;z-index:-1;background:radial-gradient(circle at 50% 40%,rgba(139,92,246,.22),transparent 45%);animation:breathe 6s ease-in-out infinite alternate}
.cta-row{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.search-btn{--bh:72px;min-width:min(340px,100%)}
.wait-hint{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem}
.wait-hint .ico{width:15px;height:15px}

.radar2{position:relative;width:min(250px,64vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,rgba(139,92,246,.22),rgba(20,10,40,.55) 62%,rgba(14,14,17,.2) 71%);box-shadow:inset 0 0 0 1px var(--line-strong),0 0 80px -20px var(--accent-glow)}
.radar2 .r{position:absolute;border-radius:50%;border:1px solid rgba(205,205,220,.16)}
.radar2 .r1{inset:17%}.radar2 .r2{inset:34%}
.radar2::before,.radar2::after{content:"";position:absolute;background:rgba(205,205,220,.12)}
.radar2::before{left:50%;top:4%;bottom:4%;width:1px}
.radar2::after{top:50%;left:4%;right:4%;height:1px}

.adm-title{font-size:clamp(2rem,5vw,3.2rem);line-height:1;animation:lineIn .9s cubic-bezier(.16,1,.3,1) both}
