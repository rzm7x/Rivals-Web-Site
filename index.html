const Form = {
  clear(form) {
    form.querySelectorAll('[data-error-for]').forEach(e => e.textContent = '');
    form.querySelectorAll('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
    const a = form.querySelector('.form-alert'); if (a) { a.hidden = true; a.innerHTML = ''; }
  },
  errors(form, fields = {}, message = '') {
    let first = null;
    for (const [name, msg] of Object.entries(fields)) {
      const input = form.elements[name]; const err = form.querySelector(`[data-error-for="${name}"]`);
      if (err) err.innerHTML = icon('alert') + `<span>${esc(msg)}</span>`;
      if (input) { input.setAttribute('aria-invalid', 'true'); first = first || input; }
    }
    const a = form.querySelector('.form-alert');
    if (a && message) { a.hidden = false; a.innerHTML = icon('alert') + `<div class="alert-body">${esc(message)}</div>`; }
    (first || a)?.focus?.();
  },
  loading(btn, on, text) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span><span>${text || 'Patiente…'}</span>`; }
    else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  },
  values(form) { return Object.fromEntries(new FormData(form).entries()); }
};

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

function go(name) { if (location.hash.slice(1) === name) route(); else location.hash = name; }

async function route() {
  let name = location.hash.slice(1);
  const guest = Api.hasAccounts() ? 'login' : 'register';
  if (!ROUTES[name]) name = state.user ? 'menu' : guest;
  if (ROUTES[name].auth && !state.user) name = guest;
  if (!ROUTES[name].auth && state.user) name = 'menu';
  if (ROUTES[name].admin && !(state.user && state.user.admin)) name = 'menu';
  if (location.hash.slice(1) !== name) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }

  if (state.route === 'play' && name !== 'play' && (mm.state === 'searching' || mm.state === 'found')) {
    mm.cancel(); toast('Recherche annulée : tu as quitté le matchmaking.', 'info');
  }
  if (state.tick) { clearInterval(state.tick); state.tick = null; }
  if (state.liveTimer) { clearInterval(state.liveTimer); state.liveTimer = null; }
  state.route = name;
  document.title = `${ROUTES[name].title} · RIVALS`;
  renderShell();
  const view = $('#view');
  await ROUTES[name].view(view);
  animateIn(view);
  window.scrollTo(0, 0);
  const h = view.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

let enterTimer;
function animateIn(view) {
  [...view.children].forEach((c, i) => c.style.setProperty('--i', i));
  view.querySelectorAll('.stagger').forEach(g => [...g.children].forEach((c, i) => c.style.setProperty('--i', i + 1)));
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  clearTimeout(enterTimer); enterTimer = setTimeout(() => view.classList.remove('enter'), 1400);
}

let fxTimer;
function fxClose() {
  const f = $('#fx-root .fx'); if (!f) return;
  f.classList.add('out'); setTimeout(() => f.remove(), 460);
}
function fxMatchFound(slots) {
  SFX.play('found'); flashTitle('⚔ Match trouvé !');
  const half = Math.ceil(slots.length / 2), L = slots.slice(0, half), R = slots.slice(half);
  const pl = p => p ? `<div class="fx-player">${UI.avatar(p)}${UI.name(p)}${UI.adminTag(p)}</div>` : '';
  $('#fx-root').innerHTML = `<div class="fx" role="status" aria-live="assertive"><div class="fx-flash"></div>
    <div class="stack" style="align-items:center;gap:34px"><div class="fx-found-title">Match trouvé</div>
    <div class="fx-found-row"><div class="fx-side left">${L.map(pl).join('')}</div><div class="fx-vs">VS</div><div class="fx-side right">${R.map(pl).join('')}</div></div></div></div>`;
  clearTimeout(fxTimer); fxTimer = setTimeout(fxClose, 2400);
}
function fxResult(m) {
  const u = state.user, t = teamOf(m, u.id); if (t < 0) return;
  const key = 'rivals.fx.' + m.id;
  try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
  if (!m.finishedAt || Date.now() - m.finishedAt > 120000) return;
  const won = m.winner === t, c = m.mmr && m.mmr[u.id], s = Api.statsFor(u.id, m.mode);
  SFX.play(won ? 'victory' : 'defeat'); flashTitle(won ? '🏆 Victoire !' : 'Match terminé');
  const colors = ['#bb9bff', '#41dd9c', '#ffffff', '#8b5cf6'];
  const sparks = won ? Array.from({ length: 40 }, (_, i) => { const a = Math.random() * Math.PI * 2, r = 160 + Math.random() * 300; return `<i class="spark" style="--x:${Math.round(Math.cos(a) * r)}px;--y:${Math.round(Math.sin(a) * r)}px;--r:${Math.round(Math.random() * 540)}deg;--d:${(Math.random() * .3).toFixed(2)}s;--c:${colors[i % 4]}"></i>`; }).join('') : '';
  $('#fx-root').innerHTML = `<div class="fx fx-result ${won ? 'win' : 'loss'}" role="dialog" aria-label="${won ? 'Victoire' : 'Défaite'}" data-action="fx-close">${won ? '<div class="fx-rays"></div>' : ''}${sparks}
    <div class="fx-inner"><div class="fx-title">${won ? 'VICTOIRE' : 'DÉFAITE'}</div>
    ${c ? `<div class="fx-delta ${c.delta >= 0 ? 'up' : 'down'}">${c.delta >= 0 ? '+' : '−'}<span data-count="${Math.abs(c.delta)}">0</span> MMR</div>` : ''}
    <div class="fx-sub">${UI.rankBadge(s, { size: 56 })}</div>
    ${UI.btn({ label: 'Continuer', variant: 'ghost', action: 'fx-close' })}</div></div>`;
  const el = $('#fx-root [data-count]');
  if (el) {
    const target = +el.dataset.count, t0 = performance.now() + 350;
    const step = now => { const k = Math.min(1, Math.max(0, (now - t0) / 900)); el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  clearTimeout(fxTimer); fxTimer = setTimeout(fxClose, 5500);
}

function hmRankCard(mode, s) {
  const [a, b] = RANK_COLORS[s.placed ? s.rank.family : 'unranked'];
  let n = null, nxt = null;
  if (s.placed) {
    const st = RULES.STARTS[mode], i = s.rank.index;
    if (i >= st.length - 1) n = { pct: 100, text: 'Rang maximum atteint' };
    else { const lo = st[i], hi = st[i + 1]; nxt = RULES.TIERS[i + 1]; n = { pct: Math.max(4, Math.min(100, Math.round((s.mmr - lo) / (hi - lo) * 100))), text: `${hi - s.mmr} MMR avant <b>${esc(nxt.name)}</b>` }; }
  }
  return `<a class="hm-rank" href="#leaderboard" data-action="lb-goto" data-mode="${mode}" style="--ra:${a};--rb:${b}">
      <span class="hm-rank-glow" aria-hidden="true"></span><span class="hm-rank-rays" aria-hidden="true"></span>
      <div class="hm-rank-top"><span class="hm-mode">${mode}</span><span class="hm-wl"><b class="w">${s.wins} V</b><b class="l">${s.losses} D</b>${s.played ? `<b>${s.rate}%</b>` : ''}</span></div>
      <div class="hm-rank-main">
        <span class="hm-emblem"><span class="hm-emblem-aura"></span>${rankEmblem(s.placed ? s.rank : null, 84)}</span>
        <div class="stack" style="gap:6px;min-width:0">
          <b class="hm-rank-name">${s.placed ? esc(s.rank.name) : 'Placement'}</b>
          ${s.placed ? `<span class="hm-mmr"><b class="num" data-count="${s.mmr}">${s.mmr}</b><small>MMR</small>${s.rank.division ? `<span class="hm-div">DIV ${ROMAN[s.rank.division]}</span>` : ''}</span>` : `<span class="muted" style="font-size:.9rem">${s.played}/${RULES.PLACEMENTS} matchs · rang caché</span>`}
        </div>
      </div>
      ${n ? `<div class="hm-prog"><div class="hm-prog-row"><div class="hm-bar"><i style="--w:${n.pct}%"><b></b></i></div>${nxt ? `<span class="hm-next" title="${esc(nxt.name)}">${rankEmblem({ ...nxt, index: s.rank.index + 1 }, 30)}</span>` : ''}</div><span class="hint">${n.text}</span></div>`

/* Animations de la page d'accueil : compteurs, inclinaison 3D, données en direct */
function homeFx(v) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  v.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count || 0; if (reduce || !to) return;
    const t0 = performance.now(), dur = 1100 + Math.min(700, to);
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4); el.textContent = Math.round(to * e); if (k < 1 && el.isConnected) requestAnimationFrame(step); };
    el.textContent = '0'; requestAnimationFrame(step);
  });
  const hero = v.querySelector('[data-tilt]');
  if (hero && !reduce && matchMedia('(pointer:fine)').matches) {
    hero.addEventListener('pointermove', e => { const r = hero.getBoundingClientRect(); hero.style.setProperty('--mx', ((e.clientX - r.left) / r.width - .5).toFixed(3)); hero.style.setProperty('--my', ((e.clientY - r.top) / r.height - .5).toFixed(3)); });
    hero.addEventListener('pointerleave', () => { hero.style.setProperty('--mx', 0); hero.style.setProperty('--my', 0); });
  }
  v.querySelectorAll('.quick,.hm-rank,.hm-stat').forEach(el => el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--sx', (e.clientX - r.left) + 'px'); el.style.setProperty('--sy', (e.clientY - r.top) + 'px'); }));
  if (v.querySelector('[data-home-live-text]')) Api.liveStats().then(L => {
    const t = v.querySelector('[data-home-live-text]'); if (!t || !L) return;
    const q = (L.queue['1v1'] || 0) + (L.queue['2v2'] || 0);
    t.textContent = `${L.online} joueur${L.online > 1 ? 's' : ''} en ligne${q ? ` · ${q} en file` : ''}${L.activeMatches ? ` · ${L.activeMatches} match${L.activeMatches > 1 ? 's' : ''} en cours` : ''}`;
  }).catch(() => {});
  if (v.querySelector('[data-home-top]')) Api.leaderboard('1v1').then(rows => {
    const box = v.querySelector('[data-home-top]'); if (!box) return;
    const top = (rows || []).filter(r => r.placed).slice(0, 3);
    if (!top.length) { box.innerHTML = `<div class="hm-empty">${icon('trophy')}<p class="muted">Personne n’est encore classé.<br>Termine tes placements pour être le premier !</p></div>`; return; }
    const slots = [top[1], top[0], top[2]], place = [2, 1, 3];
    box.innerHTML = slots.map((r, k) => { const i = place[k];
      if (!r) return `<div class="hm-step p${i} empty" style="--d:${k}"><span class="hm-step-av"><span class="hm-ghost-av">?</span></span><b class="faint">Libre</b><span class="faint" style="font-size:.78rem">—</span><span class="hm-block"><span>${i}</span></span></div>`;
      const [ra] = RANK_COLORS[r.rank.family];
      return `<div class="hm-step p${i}${r.user.id === state.user.id ? ' me' : ''}" style="--d:${k};--ra:${ra}">
      <span class="hm-beam"></span>
      <span class="hm-step-av">${UI.avatar(r.user)}${i === 1 ? `<span class="hm-crown">${icon('crown')}</span>` : ''}<span class="hm-step-rank">${rankEmblem(r.rank, 22)}</span></span>
      <b class="ellipsis">${UI.name(r.user)}</b><span class="hm-step-mmr num">${r.mmr} MMR</span>
      <span class="hm-block"><span>${i}</span></span></div>`; }).join('');
  }).catch(() => { const box = v.querySelector('[data-home-top]'); if (box) box.innerHTML = ''; });
}

function liveChips(l) {

  return `<span class="live-chip"><span class="pulse" aria-hidden="true"></span><b>${l.online}</b> en ligne</span>

}
async function refreshLive() {
  try { state.live = await Api.liveStats(); } catch (e) { return; }
  const box = $('#mm-live'); if (box) box.innerHTML = liveChips(state.live);
  // En mode serveur, le temps d'attente dépend de la file : on redessine (pas de formulaire à préserver)

    const slots = mode === '1v1'
      ? `${slot(mm.slots[0])}<span class="vs">VS</span>${slot(mm.slots[1])}`
      : `<div class="team">${slot(mm.slots[0])}${slot(mm.slots[1])}</div><span class="vs">VS</span><div class="team">${slot(mm.slots[2])}${slot(mm.slots[3])}</div>`;
    const filled = mm.slots.filter(Boolean).length;
    stage.innerHTML = `
      <div class="radar2" aria-hidden="true"><span class="r r1"></span><span class="r r2"></span><span class="sweep"></span><span class="ping"></span><span class="ping"></span>
        <i class="blip" style="left:68%;top:26%;animation-delay:.3s"></i><i class="blip" style="left:24%;top:62%;animation-delay:1.4s"></i><i class="blip" style="left:72%;top:70%;animation-delay:2s"></i>
        <div class="core">${UI.avatar(u)}</div></div>
      <div class="big-timer" data-elapsed>${fmtClock(Math.floor((Date.now() - mm.startedAt) / 1000))}</div>
      <div class="stack" style="gap:6px;align-items:center"><h2 style="font-size:clamp(1.2rem,2.6vw,1.6rem)">${found ? (mode === '1v1' ? 'Adversaire trouvé !' : 'Lobby complet !') : (mode === '1v1' ? 'Recherche d’un adversaire' : 'Recherche des joueurs')}${found ? '' : ' <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>'}</h2>
        <p class="mm-tip" id="mm-tip">${found ? 'Ouverture du match…' : `${filled} / ${mm.slots.length} joueurs · ${MM_TIPS[0]}`}</p></div>
      <div class="slots2">${slots}</div>
      ${found ? `<p class="muted" style="display:flex;gap:10px;align-items:center"><span class="spinner"></span>Création du match…</p>` : UI.btn({ label: 'Annuler la recherche', variant: 'ghost', action: 'cancel-search', iconName: 'x' })}`;
    if (!state.tick) {
      let n = 0;
      state.tick = setInterval(() => {
        n++;
        const t = $('[data-elapsed]'); if (t && mm.startedAt) t.textContent = fmtClock(Math.floor((Date.now() - mm.startedAt) / 1000));
        document.querySelectorAll('[data-scan]').forEach(el => el.textContent = 'ABCDEFGHJKLMNPRSTVXZ'[Math.floor(Math.random() * 20)]);
        if (n % 27 === 0 && mm.state === 'searching') { const tip = $('#mm-tip'); if (tip) { const f = mm.slots.filter(Boolean).length; tip.textContent = `${f} / ${mm.slots.length} joueurs · ${MM_TIPS[(n / 27) % MM_TIPS.length]}`; } }
      }, 150);
    }
    return;
  }

  const active = Api.activeMatch(u.id);
  if (active) {
    stage.dataset.sig = ""; stage.innerHTML = UI.empty({ iconName: 'swords', title: 'Un match est déjà en cours', text: `Le match ${esc(active.id)} attend son résultat. Termine-le avant de relancer une recherche.`, action: UI.btn({ label: 'Reprendre le match', action: 'open-match', attrs: `data-id="${active.id}"`, iconName: 'arrow' }) });
    return;
  }
  const srv = Api.server();
  if (srv && !u.admin && srv.maintenance) { stage.dataset.sig = ""; stage.innerHTML = UI.empty({ iconName: 'alert', title: 'Maintenance en cours', text: esc(srv.maintenanceMsg || 'Le matchmaking est fermé pour le moment. Reviens un peu plus tard !') }); return; }
  if (srv && !u.admin && srv.modes && srv.modes[mode] === false) { stage.dataset.sig = ""; stage.innerHTML = UI.empty({ iconName: 'lock', title: `Le mode ${mode} est fermé`, text: 'Les admins ont fermé ce mode pour le moment. Essaie l’autre mode !' }); return; }
  const L = Api.links();
  if (L.required && !L.ok) { stage.dataset.sig = ""; stage.innerHTML = linksChecklist(L); return; }
  if (!u.epic) {
    stage.dataset.sig = ""; stage.innerHTML = UI.empty({ iconName: 'user', title: 'Ajoute ton pseudo Epic Games', text: 'Tes adversaires en ont besoin pour t’ajouter en jeu. Renseigne-le dans ton profil, puis reviens ici.', action: UI.linkBtn({ label: 'Aller au profil', href: '#profile', variant: 'primary', iconName: 'arrow' }) });
    return;
  }
  const s = Api.statsFor(u.id, mode), q = state.live ? state.live.queue[mode] : null, need = mode === '1v1' ? 1 : 3;
  const wait = Api.mode !== 'server' ? 'Adversaires simulés · environ 5 s' : q == null ? 'Calcul du temps d’attente…' : q >= need ? 'Des joueurs t’attendent : match quasi instantané' : q > 0 ? `${q} joueur${q > 1 ? 's' : ''} déjà en file` : 'Personne en file : tu seras le premier';
  const [ra, rb] = RANK_COLORS[s.placed ? s.rank.family : 'unranked'];
  const rank = `<div class="lp-rank" style="--ca:${ra};--cb:${rb}">
      <div class="lp-emblem" aria-hidden="true"><span class="mg-aura a1"></span><span class="mg-wave"></span><span class="mg-wave"></span><svg class="hm-rings" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" class="r1"/><circle cx="100" cy="100" r="80" class="r2"/></svg><span class="lp-core">${rankEmblem(s.placed ? s.rank : null, 92)}</span></div>
      <div class="stack" style="gap:4px;align-items:center"><span class="eyebrow">Ton rang ${mode}</span><b class="lp-name">${s.placed ? esc(s.rank.name) : 'Placement'}</b>
      <span class="lp-sub">${s.placed ? `${s.rank.division ? 'Division ' + ROMAN[s.rank.division] + ' · ' : ''}${s.mmr} MMR` : `${s.played}/${RULES.PLACEMENTS} matchs · rang caché`}</span>
      ${s.played ? `<span class="hm-wl" style="margin-top:6px"><b class="w">${s.wins} V</b><b class="l">${s.losses} D</b><b>${s.rate}%</b></span>` : ''}</div></div>`;
  const setStage = html => { const sig = html.replace(/\b(rg|mg)\d+/g, ''); if (stage.dataset.sig === sig) return; stage.dataset.sig = sig; stage.innerHTML = html; };
  if (mode === '2v2' && Api.mode !== 'server') {
    const p = state.play;
    stage.dataset.sig = ""; stage.innerHTML = `${rank}
      <form class="choice-list duo-box" data-form="duo" novalidate>
        <label class="choice"><input type="radio" name="team" value="solo" ${p.team === 'solo' ? 'checked' : ''} data-action="team-choice"><div><b>Seul</b><span>La file te trouve un coéquipier et deux adversaires.</span></div></label>
        <label class="choice"><input type="radio" name="team" value="duo" ${p.team === 'duo' ? 'checked' : ''} data-action="team-choice"><div><b>Avec un coéquipier</b><span>Indique son identifiant RIVALS.</span></div></label>
        <div id="duo-field" ${p.team === 'duo' ? '' : 'hidden'}>${UI.field({ id: 'duo-partner', name: 'partner', label: 'Identifiant RIVALS du coéquipier', value: p.partner, maxlength: 16, placeholder: 'ex. NovaStrike' })}</div>
        <button type="submit" class="hm-play search-play"><span class="hm-play-in">${icon('search')}<span>RECHERCHER EN 2V2</span></span></button>
      </form>
      <span class="wait-hint">${icon('clock')} ${wait}</span>`;
    return;
  }
  setStage(`${rank}
    <button type="button" class="hm-play search-play" data-action="start-search"><span class="hm-play-in">${icon('search')}<span>RECHERCHER EN ${mode.toUpperCase()}</span></span></button>
    <span class="wait-hint lp-wait ${q >= need ? 'ready' : ''}">${icon('clock')} ${wait}</span>`);
}

/* ----- Écran de match ----- */
async function viewMatch(v) {
  const u = state.user;
  let id = state.matchId;
  if (!id) { const a = Api.activeMatch(u.id) || Api.listMatches(u.id)[0]; id = a && a.id; }
  const m = id ? await Api.getMatch(id) : null;
  if (!m || (teamOf(m, u.id) < 0 && !u.admin)) {
    v.innerHTML = UI.pageHead('Match', 'Aucun match à afficher') + `<div class="card">${UI.empty({ iconName: 'swords', title: 'Pas encore de match', text: 'Lance une recherche pour affronter quelqu’un. Ton match s’affichera ici.', action: UI.linkBtn({ label: 'Aller au matchmaking', href: '#play', variant: 'primary', iconName: 'arrow' }) })}</div>`;
    return;
  }
  renderMatch(v, m);
  const log = $('#chat-log'); if (log) log.scrollTop = log.scrollHeight;
}

const matchSig = m => [m.id, m.status, m.winner, ...[0, 1].map(t => m.declarations && m.declarations[t] ? m.declarations[t].at : 0)].join('|');

function renderMatch(v, m) {
  const u = state.user;
  setMatchId(m.id);
  v.dataset.sig = matchSig(m);
  const myTeam = teamOf(m, u.id), spectator = myTeam < 0;
  const decl = m.declarations || {};
  const myDecl = spectator ? null : decl[myTeam], oppDecl = spectator ? null : decl[1 - myTeam];
  const players = m.teams.map(t => t.map(pid => Api.getUser(pid)));
  const title = m.mode === '1v1' ? `${esc(players[0][0].username)} <span class="accent">vs</span> ${esc(players[1][0].username)}` : `Équipe A <span class="accent">vs</span> Équipe B`;
  const we = m.mode === '2v2';

  const choices = `<div class="result-choices">
      <button type="button" class="choice-big choice-win" data-action="declare" data-won="1">${icon('crown')}<span>VICTOIRE</span><small>${we ? 'Nous avons gagné' : 'J’ai gagné'}</small></button>
      <button type="button" class="choice-big choice-loss" data-action="declare" data-won="0">${icon('flag')}<span>DÉFAITE</span><small>${we ? 'Nous avons perdu' : 'J’ai perdu'}</small></button>
    </div>`;
  const lostBtn = UI.btn({ label: we ? 'Finalement, on a perdu' : 'Finalement, j’ai perdu', variant: 'ghost', action: 'declare', attrs: 'data-won="0"', iconName: 'flag' });
  let panel = '';
  if (spectator) {
    panel = `<div class="result-panel"><div class="result-final"><div class="stack" style="gap:8px"><span class="eyebrow">Vue admin</span><h2>Tu ne joues pas ce match</h2></div>${UI.linkBtn({ label: 'Panneau admin', href: '#admin', iconName: 'shield' })}</div></div>`;
  } else if (m.status === 'pending' || (m.status === 'reported' && !myDecl)) {
    panel = `<div class="result-panel"><div class="stack" style="gap:6px"><span class="eyebrow">Fin de partie</span><h2>Quel est le résultat ?</h2></div>${choices}
      <p class="hint">Déclarer une défaite termine le match tout de suite. Si les deux camps déclarent une victoire, un admin tranche.${oppDecl ? ' <b>L’adversaire a déjà déclaré.</b>' : ''}</p></div>`;
  } else if (m.status === 'reported') {
    panel = `<div class="result-panel"><div class="result-final"><div class="stack" style="gap:8px"><span class="eyebrow">Victoire déclarée</span>
      <h2 style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">En attente de l’adversaire <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></h2>
      <p class="muted" style="font-size:.92rem">Le match se termine dès que l’adversaire déclare sa défaite.</p></div>${lostBtn}</div></div>`;
  } else if (m.status === 'disputed') {
    panel = `<div class="result-panel dispute-panel"><div class="result-final"><div class="stack" style="gap:8px"><span class="eyebrow" style="color:var(--bad)">Litige · admin appelé</span>
      <h2>Les deux camps déclarent une victoire</h2><p class="muted" style="font-size:.92rem">Un admin va trancher. Expliquez-vous dans le chat. ${we ? 'Si ton équipe a perdu' : 'Si tu as perdu'}, déclare-le pour clore le match.</p></div>
      <div class="match-actions">${lostBtn}${u.admin ? UI.linkBtn({ label: 'Panneau admin', href: '#admin', iconName: 'shield' }) : ''}</div></div></div>`;
  } else if (m.status === 'finished') {
    const won = m.winner === myTeam, c = m.mmr && m.mmr[u.id], s = Api.statsFor(u.id, m.mode);
    panel = `<div class="result-panel"><div class="result-final"><div class="stack" style="gap:12px"><span class="result-word ${won ? 'win' : 'loss'}">${won ? 'VICTOIRE' : 'DÉFAITE'}</span>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${UI.delta(c)}${UI.rankBadge(s, { size: 44 })}</div></div>${UI.linkBtn({ label: 'Rejouer', href: '#play', variant: 'primary', iconName: 'swords' })}</div></div>`;
  } else if (m.status === 'cancelled') {
    panel = `<div class="result-panel"><div class="result-final"><div class="stack" style="gap:8px"><span class="eyebrow">Match annulé</span><h2>Annulé par un admin</h2><p class="muted" style="font-size:.92rem">Aucun MMR n’a été attribué.</p></div>${UI.linkBtn({ label: 'Rejouer', href: '#play', variant: 'primary', iconName: 'swords' })}</div></div>`;
  }

  // Déclarations : celle de l'adversaire reste cachée tant que les deux camps n'ont pas déclaré
  const declRow = t => {
    const d = decl[t];
    const reveal = d && (spectator || t === myTeam || (decl[0] && decl[1]));
    const val = !d ? '<span class="faint">En attente</span>'
      : reveal ? `<b style="color:${d.won ? 'var(--ok)' : 'var(--bad)'}">${d.won ? 'Victoire' : 'Défaite'}</b> <span class="faint">par ${esc(Api.getUser(d.by).username)}</span>`
      : '<span class="muted">Déclaration reçue</span>';
    return `<div class="decl"><span>Équipe ${TEAM(t)}${t === myTeam ? ' (toi)' : ''}</span><span>${val}</span></div>`;
  };
  const declCard = `<section class="card stack" style="gap:14px"><div class="card-head" style="margin:0"><h2>Déclarations</h2></div><div class="decl-list">${declRow(0)}${declRow(1)}</div></section>`;

  // Outil de démo (prototype local) : joue le rôle de l'adversaire
  let demo = '';
  if (Api.mode === 'local' && !spectator) {
    if (OPEN.includes(m.status) && !oppDecl) demo = UI.btn({ label: 'Il déclare une victoire', variant: 'ghost', size: 'sm', action: 'demo', attrs: 'data-op="opp-win"' }) + UI.btn({ label: 'Il déclare une défaite', variant: 'ghost', size: 'sm', action: 'demo', attrs: 'data-op="opp-loss"' });
    else if (m.status === 'disputed') demo = UI.linkBtn({ label: 'Trancher dans le panneau admin', href: '#admin', size: 'sm', iconName: 'shield' });
  }
  const demoText = m.status === 'disputed' ? 'Dans le prototype, ton compte est admin : ouvre le panneau pour trancher ce litige.' : `Aucun vrai adversaire n’est connecté. Ces boutons jouent l’équipe ${TEAM(1 - myTeam)} pour tester l’accord et la contradiction.`;

  const teamCard = t => `<section class="team team-${'ab'[t]} ${m.status === 'finished' && m.winner === t ? 'winner' : ''}" aria-label="Équipe ${TEAM(t)}">
      <div class="team-head"><span class="team-name">Équipe ${TEAM(t)}${t === myTeam ? ' · la tienne' : ''}</span>${m.status === 'finished' && m.winner === t ? `<span class="win-badge">${icon('crown')}Vainqueur</span>` : ''}</div>
      ${players[t].map(p => UI.playerCard(p, u.id, m.mode, m.status === 'finished' && m.mmr ? m.mmr[p.id] : null)).join('')}
    </section>`;

  v.innerHTML = `
    <div class="match-head">
      <div class="stack" style="gap:12px">
        <span class="eyebrow">Match ${m.mode} · <span class="mono">${esc(m.id)}</span></span>
        <h1>${title}</h1>
        <div class="match-meta">${UI.pill(m.status)}<span>${icon('clock')} Créé le ${fmtDate(m.createdAt)}</span></div>
      </div>
      <div class="match-actions"><button type="button" class="btn btn-ghost btn-sm copy-btn" data-action="copy" data-copy="${esc(m.id)}" data-what="le code du match" aria-label="Copier le code du match">${icon('copy')}<span>Copier le code</span></button></div>
    </div>
    <div class="teams">${teamCard(0)}<div class="vs-col"><span class="vs-big">VS</span></div>${teamCard(1)}</div>
    ${panel}
    <div class="split">
      ${chatHtml(m)}
      <div class="stack">
        ${demo ? `<section class="card demo stack" style="gap:14px"><span class="eyebrow">Outil de démo</span><h2>Simuler l’autre camp</h2><p class="muted" style="font-size:.92rem">${demoText}</p><div class="match-actions">${demo}</div></section>` : ''}
        ${declCard}
        <details class="card hist"><summary><h2>Historique du match</h2>${icon('arrow')}</summary>
          <ol class="timeline">${m.history.slice().reverse().map(h => `<li><div>${esc(h.text)}<time>${fmtDate(h.at)}</time></div></li>`).join('')}</ol>
        </details>
      </div>
    </div>`;
  if (m.status === 'finished') fxResult(m);
}

/* ----- Captures d'écran dans le chat de match : bouton, Ctrl+V, glisser-déposer ----- */
const ChatImg = {
  pending: null,
  async load(file) {
    if (!file) return;
    if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) { toast('Envoie une image JPG, PNG ou WebP.', 'error'); return; }
    if (file.size > 25 * 1024 * 1024) { toast('Image trop lourde (25 Mo maximum avant compression).', 'error'); return; }
    let bmp;
    try { bmp = await createImageBitmap(file); } catch (e) { toast('Impossible de lire cette image.', 'error'); return; }
    // Redimensionnée et compressée dans le navigateur : le texte d'un tableau des scores reste lisible
    let max = 1920, q = .86, data, w, h;
    for (let i = 0; i < 4; i++) {
      const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      w = Math.round(bmp.width * k); h = Math.round(bmp.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
      data = c.toDataURL('image/jpeg', q);
      if (data.length < 2.3 * 1024 * 1024 * 4 / 3) break;
      max = Math.round(max * .8); q -= .08;
    }
    bmp.close && bmp.close();
    this.pending = { data, w, h, kb: Math.round(data.length * 3 / 4 / 1024) };
    this.show();
  },
  show() {
    const box = $('#chat-attach'); if (!box || !this.pending) return;
    const p = this.pending;
    box.innerHTML = `<img src="${p.data}" alt="Aperçu de la capture"><div class="ca-txt"><b>Capture prête</b><span>${p.w}×${p.h} · ${p.kb > 1024 ? (p.kb / 1024).toFixed(1) + ' Mo' : p.kb + ' Ko'} · ajoute un message si tu veux, puis envoie</span></div><button type="button" class="btn btn-ghost btn-sm" data-action="chat-img-cancel">Retirer</button>`;
    box.hidden = false;
    const i = $('#chat-input'); if (i) { i.placeholder = 'Ajoute une légende (facultatif)…'; i.focus(); }
  },
  busy(on) { const box = $('#chat-attach'); if (box) box.classList.toggle('sending', on); },
  clear() {
    this.pending = null;
    const box = $('#chat-attach'); if (box) { box.hidden = true; box.innerHTML = ''; box.classList.remove('sending'); }
    const i = $('#chat-input'); if (i) i.placeholder = 'Écris un message…';
  }
};
document.addEventListener('change', e => { if (e.target && e.target.id === 'chat-file' && e.target.files[0]) ChatImg.load(e.target.files[0]); });
document.addEventListener('paste', e => {
  if (state.route !== 'match' || !$('#match-chat')) return;
  const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => /^image\//.test(x.type));
  if (f) { e.preventDefault(); ChatImg.load(f); }
});
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('#match-chat'); if (c) { e.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('#match-chat'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drop'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('#match-chat'); if (!c) return;
  e.preventDefault(); c.classList.remove('drop');
  const f = [...(e.dataTransfer.files || [])].find(x => /^image\//.test(x.type)); if (f) ChatImg.load(f);
});
addEventListener('hashchange', () => { ChatImg.pending = null; ImgView.close(); });
const ImgView = {
  el: null,
  open(src) {
    this.close();
    const d = document.createElement('div'); d.className = 'imgv'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Capture d’écran');
    d.innerHTML = `<img src="${esc(src)}" alt="Capture d’écran"><div class="imgv-bar"><a class="btn btn-ghost btn-sm" href="${esc(src)}" target="_blank" rel="noopener">${icon('eye')}Ouvrir en grand</a><button type="button" class="btn btn-ghost btn-sm" aria-label="Fermer">${icon('x')}Fermer</button></div>`;
    d.addEventListener('click', e => { if (e.target === d || e.target.closest('button')) this.close(); });
    document.body.appendChild(d); this.el = d;
  },
  close() { if (this.el) { this.el.remove(); this.el = null; } }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') ImgView.close(); });

/* ----- GIFs, stickers et emojis animés (façon TikTok) ----- */
function mediaHtml(md) {
  if (!md || !md.url) return '';
  if (md.kind === 'image') {
    const r = (md.w || 16) / (md.h || 9), w = r >= 1 ? 280 : Math.round(Math.max(140, 280 * r));
    return `<button type="button" class="cm cm-img" data-action="img-view" data-src="${esc(md.url)}" style="width:${w}px;aspect-ratio:${md.w || 16}/${md.h || 9}" aria-label="Agrandir la capture d’écran"><img src="${esc(md.url)}" alt="Capture d’écran" loading="lazy" decoding="async" draggable="false"><span class="cm-zoom">${icon('search')}</span></button>`;
  }
  const big = md.kind === 'gif', w = big ? Math.min(240, md.w || 240) : 132;
  const saved = MP.isSaved(md);
  return `<div class="cm cm-${md.kind === 'gif' ? 'gif' : 'stk'}" style="width:${w}px;aspect-ratio:${md.w || 1}/${md.h || 1}"><img src="${esc(md.url)}" alt="${esc(md.alt || (big ? 'GIF' : 'Sticker'))}" loading="lazy" decoding="async" draggable="false"><button type="button" class="cm-save ${saved ? 'on' : ''}" data-action="mp-save" data-m="${esc(JSON.stringify(md))}" aria-label="${saved ? 'Retirer des enregistrés' : 'Enregistrer'}" title="${saved ? 'Retirer des enregistrés' : 'Enregistrer'}">${icon('star')}</button></div>`;
}
function msgContent(c) { return mediaHtml(c.media) + (c.text ? `<div class="bubble-text">${esc(c.text)}</div>` : ''); }

const MP = {
  el: null, target: null, tab: 'fav', q: '', items: [], next: null, loading: false, seq: 0, timer: null, err: '',
  load(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } },
  store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  recents() { return this.load('rv-media-recent'); },
  saved() { return this.load('rv-media-saved'); },
  isSaved(md) { return md && this.saved().some(x => x.url === md.url); },
  pushRecent(md) { this.store('rv-media-recent', [md, ...this.recents().filter(x => x.url !== md.url)].slice(0, 16)); },
  toggleSave(md) {
    const list = this.saved(), had = list.some(x => x.url === md.url);
    this.store('rv-media-saved', had ? list.filter(x => x.url !== md.url) : [md, ...list].slice(0, 60));
    return !had;
  },
  vip() { const u = state.user; return !!(u && u.vip); },
  gifsOn() { const s = Api.server && Api.server(); return Api.mode === 'server' && !!(s && s.gifs); },
  open(btn) {
    const target = btn.dataset.target;
    if (this.el && this.target === target) { this.close(); return; }
    this.target = target; this.btn = btn;
    if (!this.el) {
      this.el = document.createElement('div');
      this.el.className = 'mp'; this.el.id = 'mp'; this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-label', 'GIFs, stickers et emojis');
      document.body.appendChild(this.el);
    }
    this.tab = this.recents().length || this.saved().length ? 'fav' : this.gifsOn() && this.vip() ? 'gifs' : 'emoji';
    this.q = ''; this.render(); this.place();
    document.querySelectorAll('.mp-btn').forEach(b => b.classList.toggle('on', b === btn));
    btn.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(() => this.el && this.el.classList.add('show'));
    if (matchMedia('(pointer:fine)').matches) setTimeout(() => { const i = $('#mp-q'); if (i) i.focus({ preventScroll: true }); }, 60);
  },
  close() {
    if (!this.el) return;
    const el = this.el; this.el = null; this.target = null; this.seq++;
    el.classList.remove('show'); setTimeout(() => el.remove(), 180);
    document.querySelectorAll('.mp-btn').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); });
  },
  place() {
    if (!this.el) return;
    const form = this.btn && this.btn.closest('form');
    if (!form || !document.body.contains(form) || innerWidth < 640) { this.el.classList.add('sheet'); this.el.style.cssText = ''; return; }
    this.el.classList.remove('sheet');
    const r = form.getBoundingClientRect(), w = Math.min(400, innerWidth - 24);
    const left = Math.max(12, Math.min(r.left, innerWidth - w - 12));
    const h = Math.min(460, Math.max(280, r.top - 24));
    this.el.style.cssText = `left:${left}px;width:${w}px;height:${h}px;bottom:${innerHeight - r.top + 10}px`;
  },
  render() {
    if (!this.el) return;
    const tabs = [['fav', icon('star'), 'Favoris'], ['gifs', '<b>GIF</b>', 'GIFs'], ['stickers', icon('sticker'), 'Stickers'], ['emoji', '<span class="mp-emo-ico">😂</span>', 'Emojis animés']];
    const ph = this.tab === 'stickers' ? 'Rechercher des stickers…' : this.tab === 'emoji' ? 'Rechercher un emoji (mdr, feu, gg…)' : 'Rechercher des GIFs…';
    this.el.innerHTML = `<div class="mp-grab" aria-hidden="true"></div>
      <div class="mp-top"><div class="mp-search">${icon('search')}<input id="mp-q" type="search" autocomplete="off" placeholder="${ph}" value="${esc(this.q)}" aria-label="${ph}">${this.q ? `<button type="button" class="mp-clear" data-action="mp-clear" aria-label="Effacer">${icon('x')}</button>` : ''}</div>
        <button type="button" class="mp-x" data-action="mp-close" aria-label="Fermer">${icon('x')}</button></div>
      <div class="mp-tabs" role="tablist">${tabs.map(([k, ic, l]) => `<button type="button" role="tab" class="mp-tab" data-action="mp-tab" data-tab="${k}" aria-selected="${this.tab === k}" title="${l}${(k === 'gifs' || k === 'stickers') && !this.vip() ? ' (VIP)' : ''}" aria-label="${l}">${ic}${(k === 'gifs' || k === 'stickers') && !this.vip() ? `<i class="mp-lock">${icon('lock')}</i>` : ''}</button>`).join('')}</div>
      ${(this.tab === 'gifs' || this.tab === 'stickers') && this.vip() ? `<div class="mp-chips">${MP_CHIPS.map(([q, l]) => `<button type="button" class="mp-chip ${this.q.toLowerCase() === q ? 'on' : ''}" data-action="mp-chip" data-q="${esc(q)}">${l}</button>`).join('')}</div>` : ''}
      <div class="mp-body" id="mp-body"></div>
      ${this.tab === 'gifs' || this.tab === 'stickers' ? '<div class="mp-foot">Propulsé par <b>GIPHY</b></div>' : ''}`;
    const inp = $('#mp-q');
    inp.addEventListener('input', () => { this.q = inp.value; clearTimeout(this.timer); this.timer = setTimeout(() => this.refresh(), this.tab === 'emoji' || this.tab === 'fav' ? 0 : 380); });
    inp.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); this.close(); } });
    const body = $('#mp-body');
    body.addEventListener('scroll', () => { if (body.scrollTop + body.clientHeight > body.scrollHeight - 220) this.more(); }, { passive: true });
    this.refresh();
  },
  refresh() {
    const body = $('#mp-body'); if (!body) return;
    const clear = this.el.querySelector('.mp-clear'), sb = this.el.querySelector('.mp-search');
    if (this.q && !clear) sb.insertAdjacentHTML('beforeend', `<button type="button" class="mp-clear" data-action="mp-clear" aria-label="Effacer">${icon('x')}</button>`);
    if (!this.q && clear) clear.remove();
    this.el.querySelectorAll('.mp-chip').forEach(c => c.classList.toggle('on', c.dataset.q === this.q.trim().toLowerCase()));
    body.scrollTop = 0;
    if (this.tab === 'fav') return this.renderFav(body);
    if (this.tab === 'emoji') return this.renderEmoji(body);
    this.items = []; this.next = 0; this.err = ''; this.seq++;
    body.innerHTML = `<div class="mp-grid ${this.tab === 'gifs' ? 'masonry' : 'squares'}" id="mp-grid">${'<span class="mp-skel"></span>'.repeat(9)}</div>`;
    this.more(true);
  },
  async more(first) {
    if (this.loading || this.next == null || !this.el || this.tab === 'fav' || this.tab === 'emoji') return;
    if (!this.vip()) { this.showVip(); return; }
    if (!this.gifsOn()) { this.showErr(Api.mode === 'server' ? 'Les GIFs et stickers ne sont pas encore activés sur le serveur.' : 'Les GIFs et stickers GIPHY ne marchent qu’avec le serveur RIVALS.', true); return; }
    const seq = this.seq, tab = this.tab; this.loading = true;
    try {
      const d = await Api.searchMedia(tab, this.q.trim(), this.next);
      if (seq !== this.seq || !this.el) return;
      const kind = tab === 'gifs' ? 'gif' : 'sticker';
      const add = d.items.map(x => ({ kind, url: x.url, preview: x.preview, w: x.w, h: x.h, alt: x.alt }));
      this.items.push(...add); this.next = d.next;
      const grid = $('#mp-grid'); if (!grid) return;
      if (first) grid.innerHTML = '';
      if (!this.items.length) { $('#mp-body').innerHTML = `<div class="mp-empty">${icon('search')}<b>Aucun résultat</b><span>Essaie un autre mot-clé.</span></div>`; return; }
      grid.insertAdjacentHTML('beforeend', add.map(m => this.cell(m)).join(''));
    } catch (e) {
      if (seq === this.seq) this.showErr(e.message || 'Impossible de charger les GIFs.');
    } finally { if (seq === this.seq) this.loading = false; else this.loading = false; }
  },
  showErr(msg, setup) {
    const body = $('#mp-body'); if (!body) return;
    this.next = null;
    const admin = setup && state.user && state.user.admin && Api.mode === 'server';
    body.innerHTML = `<div class="mp-empty">${icon('sticker')}<b>${esc(msg)}</b><span>${admin ? 'Ajoute une clé GIPHY gratuite dans Admin → Intégrations.' : setup ? 'En attendant, les emojis animés sont dispo.' : ''}</span>
      ${admin ? `<a class="btn btn-ghost btn-sm" href="#admin" data-action="mp-close">Ouvrir l’admin</a>` : ''}<button type="button" class="btn btn-ghost btn-sm" data-action="mp-tab" data-tab="emoji">Emojis animés</button></div>`;
  },
  showVip() {
    const body = $('#mp-body'); if (!body) return;
    this.next = null;
    body.innerHTML = `<div class="mp-empty mp-vip"><span class="mp-vip-ico">${icon('crown')}</span><b>Les GIFs et stickers sont réservés aux VIP</b><span>Passe VIP pour envoyer des GIFs et des stickers, et personnaliser ta bannière de profil. Les emojis animés restent gratuits.</span>
      <a class="btn btn-primary btn-sm" href="#vip" data-action="mp-close">${icon('crown')}<span>Devenir VIP · ${fmtRC(CORE.CFG.VIP_PRICE)}</span></a><button type="button" class="btn btn-ghost btn-sm" data-action="mp-tab" data-tab="emoji">Emojis animés</button></div>`;
  },
  renderEmoji(body) {
    const q = this.q.trim().toLowerCase();
    const list = MP_EMOJIS.filter(([, k]) => !q || k.includes(q));
    body.innerHTML = list.length ? `<div class="mp-grid emojis">${list.map(([cp, k]) => this.cell({ kind: 'emoji', url: mpEmojiUrl(cp), w: 512, h: 512, alt: k.split(' ')[0] })).join('')}</div>`
      : `<div class="mp-empty">${icon('search')}<b>Aucun emoji</b><span>Essaie « mdr », « feu », « gg »…</span></div>`;
  },
  renderFav(body) {
    const q = this.q.trim().toLowerCase(), f = l => l.filter(m => !q || (m.alt || '').toLowerCase().includes(q));
    const rec = f(this.recents()), sav = f(this.saved());
    const sec = (title, l, empty) => `<h3 class="mp-h">${title}</h3>${l.length ? `<div class="mp-grid squares">${l.map(m => this.cell(m)).join('')}</div>` : `<p class="mp-note">${empty}</p>`}`;
    body.innerHTML = sec('Récemment utilisés', rec, 'Les GIFs et stickers que tu envoies apparaîtront ici.') + sec('Enregistrés', sav, `Appuie sur ${icon('star')} sur un GIF ou un sticker pour l’enregistrer ici.`);
  },
  cell(m) {
    const sv = this.isSaved(m), data = esc(JSON.stringify(m));
    return `<div class="mp-cell ${m.kind === 'gif' ? 'gif' : ''}" ${m.kind === 'gif' ? `style="aspect-ratio:${m.w}/${m.h}"` : ''}>
      <button type="button" class="mp-item" data-action="mp-send" data-m="${data}" aria-label="Envoyer ${esc(m.alt || (m.kind === 'gif' ? 'ce GIF' : 'ce sticker'))}"><img src="${esc(m.preview || m.url)}" alt="" loading="lazy" decoding="async" draggable="false" onerror="this.closest('.mp-cell').remove()"></button>
      <button type="button" class="mp-star ${sv ? 'on' : ''}" data-action="mp-save" data-m="${data}" aria-label="${sv ? 'Retirer des enregistrés' : 'Enregistrer'}">${icon('star')}</button></div>`;
  },
  async send(md) {
    if (md.kind !== 'emoji' && !this.vip()) { toast('Les GIFs et stickers sont réservés aux VIP.', 'info'); this.tab = 'gifs'; this.render(); return; }
    const target = this.target, media = { kind: md.kind, url: md.url, w: md.w, h: md.h, alt: md.alt || '' };
    this.pushRecent({ ...media, preview: md.preview });
    this.close();
    try {
      if (target === 'dm') {
        if (!state.dmWith) return;
        const d = await Api.dmSend(state.dmWith, '', media);
        SFX.play('send'); addDmMsg(d.msg); renderDmLog(true); return;
      }
      if (target === 'match') {
        if (!state.matchId) return;
        const m = await Api.sendChat(state.matchId, state.user.id, '', media);
        SFX.play('send'); renderChatLog(m, true);
      } else {
        const d = await Api.sendGlobal('', media);
        SFX.play('send'); addGlobal(d.msg, d.user); renderGlobal(true);
      }
    } catch (e) { toast(e.message || 'Envoi impossible.', 'error'); }
  }
};

/* Après « Rejoindre » le serveur Discord : on revérifie tout seul quand le joueur revient sur le site */
let guildBusy = false, guildTimer = null;
async function guildWatchTick() {
  clearTimeout(guildTimer);
  if (!state.guildWatch || Date.now() - state.guildWatch > 10 * 60000 || Api.mode !== 'server') { state.guildWatch = 0; return; }
  const L = Api.links && Api.links();
  if (L && L.inGuild) { state.guildWatch = 0; return; }
  if (!guildBusy && !document.hidden) {
    guildBusy = true;
    try {
      const d = await Api.verifyLinks(); state.user = Api.me();
      if (d.links.inGuild) {
        state.guildWatch = 0; SFX.play('coin');
        toast(d.links.ok ? 'Serveur Discord rejoint : tu peux jouer !' : 'Serveur Discord rejoint, étape validée.', 'ok');
        if (state.route === 'play') renderPlayBody(); else if (pfSection()) renderPf(pfSection());
      }
    } catch (e) {}
    guildBusy = false;
  }
  if (state.guildWatch) guildTimer = setTimeout(guildWatchTick, 6000);
}
addEventListener('focus', () => { if (state.guildWatch) guildWatchTick(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.guildWatch) guildWatchTick(); });

function renderDmLog(force) {
  const log = $('#dm-log'); if (!log || !state.dm) return;
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  const msgs = state.dm.messages, other = state.dm.with, today = new Date().toDateString();
  if (!msgs.length) { log.innerHTML = `<div class="chat-empty">${UI.avatar(other, 'avatar-xl')}<b style="color:var(--text)">${esc(other.username)}</b><span>C’est le début de votre conversation privée. Dis bonjour !</span></div>`; return; }
  let prev = null, prevDay = '';
  log.innerHTML = msgs.map(c => {
    const mine = c.by === state.user.id, p = mine ? state.user : other, day = new Date(c.at).toDateString();
    const sep = day !== prevDay ? `<div class="day-sep">${day === today ? 'Aujourd’hui' : new Date(c.at).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>` : '';
    const cont = !sep && prev && prev.by === c.by && c.at - prev.at < 180000; prev = c; prevDay = day;
    const time = new Date(c.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    return `${sep}<div class="msg ${mine ? 'mine' : ''} ${cont ? 'cont' : ''}">${cont ? '<span class="avatar-spacer"></span>' : playerLink(p, UI.avatar(p), 'pl-av')}<div class="bubble${c.media && !c.text ? ' bubble-media' : ''}">${cont ? '' : `<div class="bubble-meta"><b>${playerLink(p, UI.name(p, mine ? 'Toi' : ''))}</b><time>${time}</time></div>`}${msgContent(c)}</div></div>`;
  }).join('');
  if (near || force) log.scrollTop = log.scrollHeight;
}
function addDmMsg(m) { if (state.dm && !state.dm.messages.some(x => x.id === m.id)) state.dm.messages.push(m); }
function onDmEvent(d) {
  const otherId = d.with, mine = d.msg.by === state.user.id;
  const viewing = state.route === 'messages' && state.dmWith === otherId && !document.hidden;
  if (state.route === 'messages' && state.dmWith === otherId && state.dm) { addDmMsg(d.msg); renderDmLog(); }
  if (!mine) {
    if (viewing) { Api.dmRead(otherId).then(updateDmBadge).catch(() => {}); }
    else { if (d.unread != null && Api.mode === 'server') {} SFX.play('message'); flashTitle(`✉ ${d.from.username}`); if (state.route !== 'messages' || state.dmWith !== otherId) toast(`${d.from.username} : ${d.msg.text ? d.msg.text.slice(0, 60) : (d.msg.media && d.msg.media.kind === 'gif' ? 'GIF' : 'Sticker')}`, 'info'); }
  }
  if (state.route === 'messages') loadDmList(); else updateDmBadge();
}

/* ----- Chat du match ----- */
function quickReplies() {
  const q = ['Salut, prêt ?', 'Je t’ajoute sur Epic', 'Invitation envoyée', 'GG !'];
  if (state.user.epic) q.splice(1, 0, `Mon pseudo Epic : ${state.user.epic}`);
  return q;
}
function chatLogHtml(m) {
  const msgs = m.chat || [];
  if (!msgs.length) return `<div class="chat-empty">${icon('chat')}<span>Aucun message. Dis bonjour et organisez-vous pour lancer la partie.</span></div>`;
  const myTeam = teamOf(m, state.user.id);
  let prev = null;
  return msgs.map(c => {
    const p = Api.getUser(c.by), mine = c.by === state.user.id, t = teamOf(m, c.by);
    const cont = prev && prev.by === c.by && c.at - prev.at < 180000; prev = c;
    const time = new Date(c.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const role = UI.adminTag(p) || (m.mode === '2v2' && !mine ? `<span>${t === myTeam ? 'coéquipier' : 'adversaire'}</span>` : '');
    return `<div class="msg ${mine ? 'mine' : ''} ${cont ? 'cont' : ''}">${cont ? '<span class="avatar-spacer"></span>' : playerLink(p, UI.avatar(p), 'pl-av')}<div class="bubble${c.media && !c.text ? ' bubble-media' : ''}">${cont ? '' : `<div class="bubble-meta"><b>${playerLink(p, UI.name(p, mine ? 'Toi' : ''))}</b>${role}<time>${time}</time></div>`}${msgContent(c)}</div></div>`;
  }).join('');
}
function chatHtml(m) {
  const others = m.teams.flat().filter(id => id !== state.user.id).map(id => Api.getUser(id));
  return `<section class="card chat" id="match-chat" aria-labelledby="chat-title">
    <div class="chat-head"><div class="av-stack">${others.map(p => UI.avatar(p)).join('')}</div>
      <div class="stack" style="gap:2px"><h2 id="chat-title">Chat du match</h2><span class="live-dot" style="font-size:.8rem;color:var(--muted)">${Api.mode === 'server' ? 'En direct' : 'Réponses simulées (prototype)'}</span></div></div>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite" aria-label="Messages du match">${chatLogHtml(m)}</div>
    <div class="chat-quick" aria-label="Réponses rapides">${quickReplies().map(q => `<button type="button" class="chip" data-action="chat-quick" data-text="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="chat-attach" id="chat-attach" hidden></div>
    <form class="chat-form" data-form="chat" novalidate>
      <button type="button" class="mp-btn" data-action="mp-open" data-target="match" aria-label="GIFs, stickers et emojis" aria-haspopup="dialog" title="GIFs et stickers">${icon('sticker')}</button>
      <button type="button" class="mp-btn" data-action="chat-img" aria-label="Envoyer une capture d’écran" title="Envoyer une capture d’écran (ou colle-la avec Ctrl+V)">${icon('image')}</button>
      <input type="file" id="chat-file" accept="image/png,image/jpeg,image/webp" hidden>
      <label for="chat-input" class="sr-only">Ton message</label>
      <input class="input" id="chat-input" name="text" maxlength="300" autocomplete="off" placeholder="Écris un message…">
      <button class="send-btn" type="submit" aria-label="Envoyer le message">${icon('send')}</button>
    </form>
    <p class="error" data-error-for="text"></p>
  </section>`;
}
function renderChatLog(m, force = false) {
  const log = $('#chat-log'); if (!log) return;
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 90;
  log.innerHTML = chatLogHtml(m);
  if (near || force) log.scrollTop = log.scrollHeight;
}
// Mise à jour en direct d'un match (message reçu, résultat signalé par l'adversaire…)
function onMatchUpdated(m, event) {
  if (!state.user) return;
  const fromOther = event && event.by && event.by !== state.user.id;
  if (state.route === 'match' && state.matchId === m.id) {
    if (fromOther && event.kind === 'chat') SFX.play('message');
    if (fromOther && event.kind !== 'chat') flashTitle('⚔ Ton match a été mis à jour');
    const v = $('#view');
    if (v.dataset.sig === matchSig(m)) renderChatLog(m);
    else {
      const input = $('#chat-input'), draft = input ? input.value : '', focused = document.activeElement === input;
      const scroll = window.scrollY;
      renderMatch(v, m);
      const ni = $('#chat-input'); if (ni) { ni.value = draft; if (focused) ni.focus({ preventScroll: true }); }
      window.scrollTo(0, scroll);
      renderChatLog(m, true);
      if (fromOther) toast('Le match a été mis à jour par l’autre camp.', 'info');
    }
    return;
  }
  if (fromOther && event.kind === 'chat') SFX.play('message');
  if (fromOther) {
    const who = Api.getUser(event.by).username;
    toast(event.kind === 'chat' ? `Nouveau message de ${who} (match ${m.id}).` : `${who} a mis à jour le match ${m.id}.`, 'info');
  }
  if (state.route === 'menu') ROUTES.menu.view($('#view'));
}

  state.shopTab = state.shopTab || 'all';

// Mini fiche joueur utilisée pour les aperçus (l'effet se pose par-dessus)
const miniCard = (u, big = false) => `<div class="mc ${big ? 'big' : ''}"><span class="mc-ban"></span><span class="mc-av">${UI.avatar(u)}</span><span class="mc-txt"><b>${esc(u.username)}</b><i></i><i></i><i class="s"></i></span></div>`;
function shopPreview(it, me) {
  if (it.type === 'banner') return `<div class="sp sp-fx">${miniCard({ ...me, deco: '' })}${profileFx(it.id)}</div>`;
  if (it.type === 'deco') return `<div class="sp sp-deco"><span class="sp-aura"></span><span class="sp-big">${UI.avatar({ ...me, deco: it.id })}</span></div>`;
  const b = it.items.find(i => CORE.shopItem(i).type === 'banner'), d = it.items.find(i => CORE.shopItem(i).type === 'deco');
  return `<div class="sp sp-fx sp-pack">${miniCard({ ...me, deco: d || '' })}${b ? profileFx(b) : ''}<span class="sp-count">${it.items.length} articles</span></div>`;
}
function shopCard(it, p, i) {
  const sh = p.shop, me = p.user;
  const owned = it.type === 'pack' ? it.items.every(x => sh.owned.includes(x)) : sh.owned.includes(it.id);
  const equipped = it.type !== 'pack' && sh[it.type] === it.id;
  const price = CORE.priceFor({ shop: sh }, it), full = it.type === 'pack' ? CORE.packValue(it) : it.price;
  const off = it.type === 'pack' && full > price && price > 0 ? Math.round((1 - price / full) * 100) : 0;
  return `<button type="button" class="sh-card ${owned ? 'owned' : ''} t-${it.type}" data-action="shop-open" data-id="${it.id}" style="--d:${i}">
    ${shopPreview(it, me)}
    ${equipped ? `<span class="sh-flag eq">${icon('check')}Équipé</span>` : owned ? `<span class="sh-flag">${icon('check')}Possédé</span>` : off ? `<span class="sh-flag off">-${off}%</span>` : ''}
    <span class="sh-info"><b>${esc(it.name)}</b>
      <span class="sh-price">${owned ? '<span class="faint">Dans ta collection</span>' : `${icon('bag')}${fmtRC(price)}${off ? ` <s>${fmtRC(full)}</s>` : ''}`}</span></span>
  </button>`;
}
function renderShop() {
  const box = $('#shop'), p = state.pf; if (!box || !p) return;
  const tab = state.shopTab, sh = p.shop, S = CORE.SHOP;
  const ownedItems = S.filter(it => it.type !== 'pack' && sh.owned.includes(it.id));
  const group = (title, sub, list, ico) => list.length ? `<section class="sh-sec"><div class="sh-sec-head"><h2>${icon(ico)}${title}</h2><span class="faint">${sub}</span></div><div class="sh-grid">${list.map((it, i) => shopCard(it, p, i)).join('')}</div></section>` : '';
  const featured = CORE.shopItem('p_supernova');
  let body = '';
  if (tab === 'mine') body = ownedItems.length ? group('Ma collection', `${ownedItems.length} article${ownedItems.length > 1 ? 's' : ''} · clique pour équiper`, ownedItems, 'check')
    : `<div class="card">${UI.empty({ iconName: 'bag', title: 'Ta collection est vide', text: 'Les effets de profil et décorations que tu achètes apparaîtront ici.', action: `<button type="button" class="btn btn-primary" data-action="shop-tab" data-tab="all">${icon('sparkle')}<span>Voir la boutique</span></button>` })}</div>`;
  else body = [
    (tab === 'all' || tab === 'pack') && group('Packs', 'Moins cher que les articles séparés', S.filter(x => x.type === 'pack'), 'bag'),
    (tab === 'all' || tab === 'banner') && group('Effets de profil', 'Une animation par-dessus ta fiche joueur', S.filter(x => x.type === 'banner'), 'image'),
    (tab === 'all' || tab === 'deco') && group('Décorations d’avatar', 'Animées autour de ta photo, partout sur le site', S.filter(x => x.type === 'deco'), 'user')
  ].filter(Boolean).join('');
  box.innerHTML = `
    <section class="sh-hero">
      <span class="sh-hero-bg"></span>${profileFx('fx_galaxy')}<span class="sh-hero-shade"></span>
      <div class="sh-hero-txt"><span class="eyebrow">Boutique · cosmétiques</span><h1>Boutique</h1>
        <p>Effets de profil et décorations d’avatar, visibles par tous les joueurs sur ta fiche.</p>
        <div class="sh-hero-act"><span class="sh-bal">${icon('wallet')}<b data-balance>${fmtRC(p.wallet.balance)}</b></span><a class="btn btn-ghost btn-sm" href="#wallet">${icon('plus')}<span>Ajouter des fonds</span></a></div></div>
      <button type="button" class="sh-hero-feat" data-action="shop-open" data-id="${featured.id}"><span class="sh-big">${UI.avatar({ ...p.user, deco: 'd_supernova' }, 'avatar-xl')}</span><span class="sh-feat-tag">${icon('sparkle')}${esc(featured.name)} · ${fmtRC(CORE.priceFor({ shop: sh }, featured) || featured.price)}</span></button>
    </section>
    <div class="sh-tabs" role="tablist">${SHOP_TABS.map(([k, l, ic]) => `<button type="button" role="tab" aria-selected="${tab === k}" data-action="shop-tab" data-tab="${k}">${icon(ic)}<span>${l}${k === 'mine' && ownedItems.length ? ` <em>${ownedItems.length}</em>` : ''}</span></button>`).join('')}</div>
    ${(sh.banner || sh.deco) && tab !== 'mine' ? `<div class="sh-equipped">${icon('user')}<span>Équipé : ${[sh.deco && CORE.shopItem(sh.deco) && esc(CORE.shopItem(sh.deco).name), sh.banner && CORE.shopItem(sh.banner) && esc(CORE.shopItem(sh.banner).name)].filter(Boolean).join(' · ')}</span><button type="button" class="link-btn" data-action="player-stats" data-id="${esc(p.user.id)}">Voir ma fiche</button></div>` : ''}
    ${body}`;
}
function shopModal(id) {
  const it = CORE.shopItem(id), p = state.pf; if (!it || !p) return;
  const sh = p.shop, me = p.user;
  const items = it.type === 'pack' ? it.items.map(CORE.shopItem) : [it];
  const owned = items.every(x => sh.owned.includes(x.id));
  const price = CORE.priceFor({ shop: sh }, it), full = it.type === 'pack' ? CORE.packValue(it) : it.price;
  const fx = items.find(x => x.type === 'banner'), deco = items.find(x => x.type === 'deco');
  const showB = fx ? fx.id : sh.banner, showD = deco ? deco.id : sh.deco;
  const enough = p.wallet.balance >= price;
  const kind = it.type === 'pack' ? `Pack · ${items.length} articles` : KIND_LABEL[it.type];
  const row = x => { const has = sh.owned.includes(x.id), eq = sh[x.type] === x.id;
    return `<div class="shm-item"><span class="shm-thumb ${x.type}">${x.type === 'banner' ? `<span class="mc-ban"></span>${profileFx(x.id)}` : UI.avatar({ ...me, deco: x.id })}</span>
      <div class="stack" style="gap:1px;min-width:0"><b>${esc(x.name)}</b><small class="faint">${KIND_LABEL[x.type]}${has ? '' : ' · ' + fmtRC(x.price)}</small></div>
      ${has ? (eq ? `<button type="button" class="btn btn-ghost btn-sm" data-action="shop-equip" data-slot="${x.type}" data-id="">${icon('x')}<span>Retirer</span></button>` : `<button type="button" class="btn btn-primary btn-sm" data-action="shop-equip" data-slot="${x.type}" data-id="${x.id}">${icon('check')}<span>Équiper</span></button>`) : ''}</div>`; };
  openModal(`<div class="shm">
    <button type="button" class="pc-x" data-action="close-modal" aria-label="Fermer">${icon('x')}</button>
    <div class="shm-stage">${miniCard({ ...me, deco: showD || '' }, true)}${showB ? profileFx(showB) : ''}</div>
    <div class="shm-body">
      <div class="stack" style="gap:4px"><span class="eyebrow">${kind}</span><h2 id="modal-title" class="shm-title">${esc(it.name)}</h2><p class="muted" style="margin:0">${esc(it.desc)}</p></div>
      ${items.length > 1 || owned ? `<div class="shm-items">${items.map(row).join('')}</div>` : ''}
      ${owned ? `<p class="faint" style="margin:0;font-size:.85rem">${icon('check')} Dans ta collection.</p>`
        : `<div class="shm-buy"><div class="stack" style="gap:0"><span class="shm-price">${fmtRC(price)}</span>${full > price ? `<span class="faint"><s>${fmtRC(full)}</s> · tu économises ${fmtRC(full - price)}</span>` : `<span class="faint">Solde : ${fmtRC(p.wallet.balance)}</span>`}</div>
          ${enough ? `<button type="button" class="btn btn-primary" data-action="shop-buy" data-id="${it.id}">${icon('bag')}<span>Acheter pour ${fmtRC(price)}</span></button>` : `<a class="btn btn-ghost" href="#wallet" data-action="close-modal">${icon('wallet')}<span>Il te manque ${fmtRC(price - p.wallet.balance)}</span></a>`}</div>`}
    </div></div>`);
  const box = $('#modal-root .modal'); if (box) box.classList.add('modal-pc', 'modal-shop');
}

function declareModal(won) {
  confirmModal({
    title: won ? 'Déclarer une victoire ?' : 'Déclarer une défaite ?',
    text: won ? 'Le match sera validé dès que l’adversaire déclarera sa défaite. S’il déclare lui aussi une victoire, un admin tranchera.' : 'Le match se termine tout de suite et l’adversaire gagne. Cette action est définitive.',
    confirmLabel: won ? 'Oui, victoire' : 'Oui, défaite', variant: won ? 'ok' : 'danger',
    onConfirm: () => afterMatchChange(() => Api.declare(state.matchId, state.user.id, won), 'Déclaration envoyée.')
  });
}

function confirmModal({ title, text, confirmLabel, variant = 'primary', onConfirm }) {

}

function renderChatNotice() {
  const box = $('#g-notice'); if (!box) return;
  const s = Api.server(), mu = Api.mute(), admin = state.user && state.user.admin, out = [];
  if (mu) out.push(`<div class="gc-note bad">${icon('lock')} Tu es réduit au silence ${mu.until ? 'jusqu’au ' + fmtDate(mu.until) : 'définitivement'}.${mu.reason ? ' Raison : ' + esc(mu.reason) : ''}</div>`);
  if (s && s.chatEnabled === false) out.push(`<div class="gc-note warn">${icon('alert')} Le chat général est fermé par les admins${admin ? ' (tu peux écrire car tu es admin)' : ''}.</div>`);
  if (s && s.slowmode) out.push(`<div class="gc-note">${icon('clock')} Mode lent : un message toutes les ${s.slowmode} s${admin ? ' (sauf admins)' : ''}.</div>`);

}
function renderGSide() {
  if (!state.g) return;
  const msgs = state.g.messages, dayAgo = Date.now() - 864e5, today = new Date().toDateString();
  const last = new Map();
  for (let i = msgs.length - 1; i >= 0; i--) { const c = msgs[i]; if (c.at < dayAgo) break; if (!last.has(c.by)) last.set(c.by, c.at); }
  const ppl = $('#g-people');
  if (ppl) ppl.innerHTML = last.size ? [...last].slice(0, 8).map(([id, at], i) => { const p = state.g.users[id] || { id, username: 'Joueur' }; return `<div class="gc-person pl-row" style="--d:${i}" role="button" tabindex="0" data-action="player-stats" data-id="${esc(id)}">${UI.avatar(p)}<div style="min-width:0"><b class="ellipsis">${UI.name(p)}</b>${UI.nameTags(p)}<span class="faint">${new Date(at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span></div>${Date.now() - at < 600000 ? '<span class="gc-on" title="Actif à l’instant"></span>' : ''}</div>`; }).join('') : '<p class="faint" style="font-size:.88rem">Personne n’a parlé dans les dernières 24 h.</p>';
  const k = $('#g-kpis');
  if (k) { const n = msgs.filter(c => new Date(c.at).toDateString() === today).length; k.innerHTML = `<div class="gc-kpi"><b>${n}</b><span>message${n > 1 ? 's' : ''} aujourd’hui</span></div><div class="gc-kpi"><b>${last.size}</b><span>joueur${last.size > 1 ? 's' : ''} actif${last.size > 1 ? 's' : ''} (24 h)</span></div>`; }
}
function globalLogHtml() {
  const msgs = state.g.messages;
  if (!msgs.length) return `<div class="chat-empty">${icon('chat')}<span>Personne n’a encore parlé. Lance la conversation !</span></div>`;
  let prev = null, prevDay = '';
  const today = new Date().toDateString();
  return msgs.map(c => {
    const p = state.g.users[c.by] || { id: c.by, username: 'Joueur' }, mine = c.by === state.user.id;
    const day = new Date(c.at).toDateString();
    const sep = day !== prevDay ? `<div class="day-sep">${day === today ? 'Aujourd’hui' : new Date(c.at).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>` : '';
    const cont = !sep && prev && prev.by === c.by && c.at - prev.at < 180000;

  }).join('');
}
function renderGlobal(force = false) {

async function handleBanner(file) {
  const err = $('#banner-err'); if (err) err.textContent = '';
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { if (err) err.textContent = 'Choisis une image JPG, PNG ou WebP.'; return; }
  if (file.size > 15 * 1024 * 1024) { if (err) err.textContent = 'Image trop lourde : 15 Mo maximum.'; return; }
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Impossible de lire cette image.')); i.src = url; });
    const W = 1200, H = 400, c = document.createElement('canvas'); c.width = W; c.height = H;
    const iw = img.naturalWidth, ih = img.naturalHeight, r = Math.max(W / iw, H / ih), sw = W / r, sh = H / r;
    c.getContext('2d').drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, W, H);
    let data = '';
    for (const q of [.82, .72, .6, .5, .4]) { data = c.toDataURL('image/jpeg', q); if (data.length <= 255000) break; }
    if (data.length > 255000) throw new Error('Image trop détaillée : essaie une autre image.');
    await pfAction(() => Api.setBanner(data), 'Bannière mise à jour.');
  } catch (e) { if (err) err.textContent = e.message || 'Impossible de lire cette image.'; }
  finally { if (url) URL.revokeObjectURL(url); }
}
async function handleAvatar(file) {
  const err = $('#avatar-err'); if (err) err.textContent = '';
  if (!file) return;
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { if (err) err.textContent = 'Choisis une image JPG, PNG ou WebP.'; return; }
  if (file.size > 10 * 1024 * 1024) { if (err) err.textContent = 'Image trop lourde : 10 Mo maximum.'; return; }
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Impossible de lire cette image.')); i.src = url; });
    const S = 192, c = document.createElement('canvas'); c.width = c.height = S;
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    await pfAction(() => Api.setAvatar(c.toDataURL('image/jpeg', .85)), 'Photo de profil mise à jour.');
  } catch (e) { if (err) err.textContent = e.message || 'Impossible de lire cette image.'; }
  finally { if (url) URL.revokeObjectURL(url); }
}

async function loadLeaderboard() {
  const body = $('#lb-body'); if (!body) return;
  const req = ++lbReq, lb = state.lb, u = state.user;
  body.innerHTML = UI.loading('Chargement du classement…');
  let rows;
  try { rows = await Api.leaderboard(lb.mode, { includeBots: lb.bots }); }
  catch (e) { if (req === lbReq && $('#lb-body')) $('#lb-body').innerHTML = `<div class="card">${UI.empty({ iconName: 'alert', title: 'Classement indisponible', text: esc(e.message), action: UI.btn({ label: 'Réessayer', variant: 'ghost', action: 'lb-retry' }) })}</div>`; return; }
  if (req !== lbReq || !$('#lb-body')) return;
  const me = rows.find(r => r.user.id === u.id);
  const q = lb.q.trim().toLowerCase();
  const shown = q ? rows.filter(r => r.user.username.toLowerCase().includes(q)) : rows;

  if (!rows.length) {
    body.innerHTML = `<div class="card">${UI.empty({ iconName: 'trophy', title: `Aucun classement ${lb.mode} pour le moment`, text: 'Personne n’a encore de match validé dans ce mode. Joue un match et déclarez le résultat pour ouvrir le classement.', action: UI.linkBtn({ label: 'Lancer un match', href: '#play', variant: 'primary', iconName: 'swords' }) })}</div>`;
    return;
  }
  const placed = rows.filter(r => r.placed);
  const top = placed.slice(0, 3);
  const podium = top.length ? `<section class="lb-podium">${[top[1], top[0], top[2]].map((r, k) => { const i = [2, 1, 3][k];

      <div class="su-kpi"><b>${yest}</b><span>hier</span></div>

/* Son du clic selon l'élément : bouton principal, onglet, interrupteur, fermeture… */
function clickSound(el) {
  if (el.matches('.adm-switch, label.adm-switch')) { const i = el.querySelector('input'); return i && !i.checked ? 'toggleOn' : 'toggleOff'; }
  if (el.matches('[data-action="close-modal"], [data-action="ann-hide"], [data-action="cancel-search"]')) return 'close';
  if (el.matches('.hm-play, .btn-primary, .btn-ok, .btn-danger, [type="submit"], .send-btn, .mode-card, .mx-card')) return 'press';
  if (el.matches('.topbar a, .adm-tabs button, .seg button, .pf-nav a, .lb-seg button, nav a, .gc-emo, .adm-radio')) return 'tab';
  if (el.matches('[data-action="admin-player"], [data-action="limits"], [data-action="show-stats"]')) return 'open';
  return 'click';
}
/* ========================= ÉCOUTEURS ========================= */
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target.closest && e.target.closest('.btn, .hm-play, .mode-card, .mx-card, .quick, .adm-tabs button, .topbar nav a, .hm-rank, .hm-stat');
  if (el && !el.disabled && (!e.relatedTarget || !el.contains(e.relatedTarget))) SFX.play('hover');
});
document.addEventListener('click', e => {
  const hit = e.target.closest('button, a, [role="button"], label.btn, .choice');
  if (hit && !hit.disabled) { SFX.unlock(); if (!hit.matches('[data-action="toggle-sfx"]')) SFX.play(clickSound(hit)); }
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'INPUT') return;
  const fn = Actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.action === 'team-choice') Actions['team-choice'](el);
  if (el.id === 'lb-bots') { state.lb.bots = el.checked; loadLeaderboard(); }
  if (el.id === 'avatar-file') { handleAvatar(el.files && el.files[0]); el.value = ''; }
  if (el.id === 'banner-file') { handleBanner(el.files && el.files[0]); el.value = ''; }
  if (el.id === 'dc-file') { dcImage(el.files && el.files[0]); el.value = ''; }
  if (el.closest && el.closest('#dc-form')) dcSync();
});
let qTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'lb-q') { state.lb.q = el.value; clearTimeout(qTimer); qTimer = setTimeout(loadLeaderboard, 160); }
  if (el.id === 'adm-q') { state.admQ = el.value; renderAdminPlayers(); }
  if (el.id === 'own-q') { state.ownQ = el.value; renderOwner(); }
  if (el.closest && el.closest('#dc-form')) dcSync();
  if (el.closest && el.closest('form[data-form="profile"]')) syncProfileDirty();
  if (el.getAttribute && el.getAttribute('aria-invalid') === 'true') {
    el.removeAttribute('aria-invalid'); const err = el.form && el.form.querySelector(`[data-error-for="${el.name}"]`); if (err) err.textContent = '';
  }
});
document.addEventListener('submit', e => {
  const form = e.target; if (!form.dataset.form) return;
  e.preventDefault();
  Form.clear(form);

});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML && !$('#modal-root .mp-modal')) closeModal(); });

/* ========================= DÉMARRAGE ========================= */
(async function boot() {
  if (await detectServer()) { Api = createRemoteApi(); mm = new RemoteMatchmaker(Api); }
  else { Api = LocalApi; mm = new LocalMatchmaker(); }
  await Api.boot();
  state.user = Api.me();

  mm.on(m => {
    if (m.state === 'found') fxMatchFound(m.slots.filter(Boolean));
    if (m.state === 'ready') {
      const id = m.matchId; m.reset();
      if (state.tick) { clearInterval(state.tick); state.tick = null; }
      setMatchId(id); go('match'); setTimeout(showMapPopup, 350);
      return;
    }
    if (m.state === 'idle' && state.tick) { clearInterval(state.tick); state.tick = null; }
    if (state.route === 'play') renderPlayBody();
  });

  Api.onEvent(d => {
    if (d.type === 'kicked') { if (mm.state !== 'idle') mm.reset && mm.reset(); state.user = null; state.loginNotice = d.reason || 'Tu as été déconnecté.'; toast(state.loginNotice, 'error'); go('login'); return; }
    if (d.type === 'notice') toast(d.text, d.kind === 'error' ? 'error' : d.kind === 'info' ? 'info' : 'ok');
    if (d.type === 'snapshot' && state.route === 'chat') renderChatNotice();
    if (d.type === 'server' || d.type === 'snapshot') { renderAnnounce(); if (d.type === 'server') { if (state.route === 'play' && mm.state === 'idle') renderPlayBody(); if (state.route === 'chat') renderChatNotice(); if (state.route === 'admin') adminRerender(); } }
    if (d.type === 'global-clear' && state.g) { state.g.messages = []; if (state.route === 'chat') renderGlobal(); }
    if (d.type === 'match') { onMatchUpdated(d.match, d.event); refreshChrome(); }
    if (d.type === 'dm' && state.user && d.msg) onDmEvent(d);
    if (d.type === 'snapshot') updateDmBadge();
    if (d.type === 'global') {
      addGlobal(d.msg, d.user);
      // pas de son pour le chat général (seulement la pastille, sauf en sourdine)
      const notify = state.user && d.msg.by !== state.user.id && !gMuted();
      if (state.route === 'chat') renderGlobal();
      else if (notify) { state.unread++; updateChatBadge(); }
    }
    if (d.type === 'global-del' && state.g) { state.g.messages = state.g.messages.filter(x => x.id !== d.id); if (state.route === 'chat') renderGlobal(); }
    if (d.type === 'presence') { state.online = d.online; const o = $('#g-online'); if (o) o.textContent = onlineText(); }
    if (d.type === 'admin-refresh' || d.type === 'presence' || d.type === 'dispute') scheduleOverview();
    if (d.type === 'admin-signup' && d.user) { SFX.play('alert'); toast(`Nouvelle inscription : ${d.user.username}${d.ref ? ' (parrainé par ' + d.ref + ')' : ''}.`, 'info'); scheduleOverview(); }
    if (d.type === 'invite') { SFX.play('alert'); flashTitle('✉ Invitation d’équipe'); toast(`${d.from} t’invite dans l’équipe ${d.team}.`, 'info'); refreshChrome(); if (state.route === 'invites') ROUTES.invites.view($('#view')); }
    if (d.type === 'dispute') {
      updateDisputeBadge();
      if (state.user && state.user.admin && d.event && d.event.kind === 'dispute') { SFX.play('alert'); flashTitle('⚠ Litige à trancher'); }
      if (state.user && state.user.admin && d.event && d.event.kind === 'dispute') toast(`Litige sur le match ${d.match.id} : un admin doit trancher.`, 'error');
      if (state.route === 'admin') loadAdmin();
    }
    if (d.type === 'snapshot' && d.flash) { const f = Api.takeFlash(); if (f) toast(f.text, f.kind === 'error' ? 'error' : 'ok'); }
    if (d.type === 'snapshot' && state.user) {
      const wasAdmin = state.user.admin; state.user = Api.me();
      if (state.user && state.user.admin !== wasAdmin) route(); else { updateDisputeBadge(); refreshChrome(); }
    }
    if (d.type === 'connected' || d.type === 'disconnected') {
      const c = $('#conn'); if (c) { c.classList.toggle('off', d.type === 'disconnected'); c.textContent = d.type === 'connected' ? 'connecté' : 'reconnexion…'; }
    }
  });

  window.addEventListener('hashchange', route);
  await route();
  const f = Api.takeFlash(); if (f) toast(f.text, f.kind === 'error' ? 'error' : 'ok');
})();
</script>
</body>
</html>
