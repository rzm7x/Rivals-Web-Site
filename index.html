.sp{position:relative;height:200px;overflow:hidden;background:radial-gradient(70% 80% at 50% 40%,#211640,#0a0716)}
.sp-big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.sp-big .avatar{width:84px;height:84px;font-size:2rem}
.sp-aura{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.25),transparent 70%)}
.sp-count{position:absolute;left:12px;top:12px;z-index:7;font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:10px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.14)}
/* mini fiche joueur pour les aperçus */
.mc{position:absolute;left:50%;top:14px;bottom:-30px;width:70%;margin-left:-35%;border-radius:8px;overflow:hidden;background:#0e0e11;border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -18px rgba(0,0,0,.9);display:block}
.mc-ban{position:absolute;left:0;right:0;top:0;height:34%;background:radial-gradient(80% 140% at 20% 0%,rgba(139,92,246,.6),transparent 70%),linear-gradient(135deg,#2a1856,#141418)}
.mc-av{position:absolute;left:10%;top:calc(34% - 26px);padding:3px;border-radius:50%;background:#0e0e11;display:block}
.mc-av .avatar{width:46px;height:46px;font-size:1.05rem;border-radius:50%}
.mc-txt{position:absolute;left:10%;right:10%;top:calc(34% + 28px);display:flex;flex-direction:column;gap:6px}
.mc-txt b{font:800 .85rem var(--f-display);position:static}
.mc-txt i{position:static;display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.08)}.mc-txt i.s{width:55%}
.mc.big{position:relative;left:auto;top:auto;bottom:auto;width:auto;margin:0;height:300px;border:0;border-radius:0;box-shadow:none}
.mc.big .mc-ban{height:120px}
.mc.big .mc-av{top:64px;left:22px;padding:6px}
.mc.big .mc-av .avatar{width:96px;height:96px;font-size:2.2rem}
.mc.big .mc-txt{top:176px;left:24px;right:24px;gap:10px}.mc.big .mc-txt b{font-size:1.3rem}.mc.big .mc-txt i{height:9px}
.sh-flag{position:absolute;right:10px;top:10px;z-index:7;display:inline-flex;gap:4px;align-items:center;font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:10px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15)}
.sh-flag .ico{width:12px;height:12px}
.sh-flag.eq{background:rgba(65,221,156,.2);border-color:rgba(65,221,156,.5);color:var(--ok)}
.sh-flag.off{background:linear-gradient(135deg,#22c55e,#15803d);border:0;color:#fff}
.sh-info{position:relative;z-index:7;display:flex;flex-direction:column;gap:4px;padding:12px 14px 14px;background:#0e0a1a}
.sh-info b{font-size:1rem}
.sh-price{display:inline-flex;gap:6px;align-items:center;font-weight:800;color:var(--text)}
.sh-price .ico{width:15px;height:15px;color:var(--accent-hi)}
.sh-price s{color:var(--faint);font-weight:600;font-size:.85rem}
.sh-card.owned .sh-info b{color:var(--muted)}
/* fenêtre d'achat */
.modal.modal-shop{max-width:460px}
.shm{position:relative}
.shm-stage{position:relative;overflow:hidden}
.shm-body{padding:16px 20px 22px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.shm-title{font:800 1.5rem var(--f-display);margin:0}
.shm-items{display:flex;flex-direction:column;gap:8px}
.shm-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:#120c22;border:1px solid var(--line)}
.shm-thumb{position:relative;width:64px;height:44px;border-radius:9px;overflow:hidden;display:grid;place-items:center;background:#0e0e11}
.shm-thumb .mc-ban{height:100%}
.shm-thumb.deco{overflow:visible;background:none}
.shm-thumb.deco .avatar{width:32px;height:32px;font-size:.8rem}
.shm-buy{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px;border-radius:8px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(18,12,34,.9));border:1px solid var(--line-strong)}
.shm-price{font:800 1.6rem var(--f-display)}
.shm-body .faint .ico{width:14px;height:14px;vertical-align:-2px;color:var(--ok)}
@media (max-width:720px){.sh-hero{flex-direction:column;align-items:flex-start;padding:22px}.sh-hero-feat{align-self:center}.sh-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sp{height:170px}.mc{width:84%;margin-left:-42%}.sp-big .avatar{width:62px;height:62px}}

/* ===================== MESSAGES PRIVÉS ===================== */
@media (max-width:1480px) and (min-width:901px){.user-chip .uname{display:none}.topbar-right{gap:8px}}
.dm-top{position:relative}
.dm-top .nav-badge{position:absolute;top:-4px;right:-4px}
.dm-top.on{color:#fff;background:rgba(139,92,246,.22);border-color:var(--line-strong)}
.dm{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;height:calc(100vh - 150px);min-height:520px}
.dm-side,.dm-main{border-radius:10px;background:linear-gradient(160deg,rgba(28,17,52,.7),rgba(14,14,17,.85));border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dm-side{padding:18px 12px 12px;gap:12px}
.dm-side-head{padding:0 8px;display:flex;flex-direction:column;gap:2px}.dm-side-head h1{font:800 1.5rem var(--f-display);margin:0}
.dm-new{display:flex;gap:6px;align-items:center;padding:4px 4px 4px 12px;border-radius:8px;background:rgba(6,4,14,.7);border:1px solid var(--line)}
.dm-new:focus-within{border-color:rgba(167,139,250,.7)}
.dm-new-ico .ico{width:16px;height:16px;color:var(--faint)}
.dm-new .input{flex:1;min-width:0;border:0!important;background:none!important;box-shadow:none!important;height:38px;padding:0}
.dm-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.5) transparent}
.dm-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:8px;border:0;background:none;color:var(--text);text-align:left;cursor:pointer;transition:background .15s}
.dm-item:hover{background:rgba(255,255,255,.05)}
.dm-item.on{background:rgba(139,92,246,.2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.dm-item .avatar{width:42px;height:42px;border-radius:50%}
.dm-item-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.dm-item-txt b{display:flex;gap:6px;align-items:center;font-size:.95rem;white-space:nowrap;overflow:hidden}
.dm-item-txt>span{font-size:.82rem;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-item.unread .dm-item-txt>span{color:var(--text);font-weight:700}
.dm-item-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dm-item-side time{font-size:.72rem;color:var(--faint)}
.dm-item-side em{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.dm-none{padding:12px;font-size:.88rem}
.dm-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dm-head .avatar{width:42px;height:42px;border-radius:50%}
.dm-head-name{display:flex;gap:6px;align-items:center;font-size:1.05rem}
.dm-head .btn-sm{margin-left:auto}
.dm-back{display:none}.dm-back .ico{transform:rotate(180deg)}
.dm-log.chat-log{flex:1;height:auto;min-height:0;border:0;border-radius:0;background:radial-gradient(60% 40% at 50% 0%,rgba(139,92,246,.1),transparent 70%),transparent;padding:18px}
.dm-form{margin:0 14px 6px}
.dm-main>.error{margin-bottom:10px}
.dm-empty{margin:auto;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px}
.dm-empty h2{margin:0}
.dm-empty-ico{width:68px;height:68px;border-radius:10px;display:grid;place-items:center;background:var(--accent);box-shadow:0 14px 40px -12px var(--accent-glow)}
.dm-empty-ico .ico{width:30px;height:30px;color:#fff}
@media (max-width:820px){
  .dm{grid-template-columns:1fr;height:calc(100vh - 180px)}
  .dm.has-chat .dm-side{display:none}
  .dm:not(.has-chat) .dm-main{display:none}
  .dm-back{display:inline-grid}
  .dm-head .btn-sm span{display:none}
}

/* ===================== CARTES DE MODE (1v1 / 2v2) ===================== */
.mx-card{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr auto;gap:16px 12px;padding:24px 24px 20px;min-height:236px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:#0c0818;color:var(--text);text-align:left;cursor:pointer;font:inherit;opacity:.8;transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s,border-color .35s,opacity .3s}
.mx-card:hover:not([disabled]):not(.locked){opacity:1;transform:translateY(-4px);border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.mx-bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--a) 34%,transparent),transparent 55%),radial-gradient(80% 90% at 0% 110%,color-mix(in srgb,var(--b) 26%,transparent),transparent 60%),linear-gradient(160deg,#1a1033,#0a0614)}
.mx-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;-webkit-mask:radial-gradient(80% 80% at 80% 30%,#000,transparent 75%);mask:radial-gradient(80% 80% at 80% 30%,#000,transparent 75%)}
.mx-spot{position:absolute;inset:0;z-index:-1;background:radial-gradient(260px circle at var(--sx,80%) var(--sy,20%),color-mix(in srgb,var(--a) 20%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.mx-card:hover .mx-spot{opacity:1}
.mx-num{position:absolute;right:-8px;bottom:-34px;z-index:-1;font:900 8.5rem/1 var(--f-display);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--a) 35%,transparent);opacity:.55;transition:opacity .4s,transform .5s cubic-bezier(.16,1,.3,1),-webkit-text-stroke-color .4s}
.mx-card.on .mx-num{opacity:1;transform:translateY(-6px);-webkit-text-stroke-color:color-mix(in srgb,var(--a) 75%,transparent);filter:drop-shadow(0 0 18px color-mix(in srgb,var(--a) 50%,transparent))}
.mx-body{display:flex;flex-direction:column;gap:6px;min-width:0;align-self:start}
.mx-kicker{display:inline-flex;gap:6px;align-items:center;font:800 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--a) 80%,#fff)}
.mx-kicker .ico{width:14px;height:14px}
.mx-name{font:900 clamp(2rem,3.4vw,2.6rem)/1 var(--f-display);letter-spacing:-.02em;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--a) 60%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.mx-desc{color:var(--muted);font-size:.93rem;max-width:32ch;line-height:1.45}
.mx-arena{grid-column:2;grid-row:1;align-self:start;display:flex;align-items:center;gap:6px;padding-top:4px}
.mx-team{display:flex}.mx-team>*+*{margin-left:-14px}
.mx-team .avatar,.mx-ghost{width:52px;height:52px;border-radius:50%!important;box-shadow:0 0 0 3px #120b24}
.mx-team .av-deco{width:52px;height:52px}
.mx-ghost{display:grid;place-items:center;background:rgba(255,255,255,.04);border:2px dashed color-mix(in srgb,var(--a) 50%,transparent);color:color-mix(in srgb,var(--a) 80%,#fff);font:800 1rem var(--f-display)}
.mx-clash{position:relative;width:42px;height:42px;display:grid;place-items:center;flex:none}
.mx-clash .ico{width:22px;height:22px;color:#fff;filter:drop-shadow(0 0 8px var(--a));position:relative;z-index:1}
.mx-ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 55%,transparent),transparent 70%)}
.mx-card.on .mx-ring{animation:mx-pulse 1.6s ease-in-out infinite}
@keyframes mx-pulse{50%{transform:scale(1.5);opacity:.4}}
.mx-card.on .mx-team:not(.opp){animation:mx-push 2.4s ease-in-out infinite}.mx-card.on .mx-team.opp{animation:mx-push-r 2.4s ease-in-out infinite}
@keyframes mx-push{50%{transform:translateX(4px)}}@keyframes mx-push-r{50%{transform:translateX(-4px)}}
.mx-foot{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mx-chip{display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border-radius:10px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.09);font-size:.8rem;font-weight:700;}
.mx-chip .w{color:var(--ok)}.mx-chip .l{color:var(--bad)}
.mx-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.mx-chip.hot .mx-dot{background:var(--ok);box-shadow:0 0 0 0 rgba(65,221,156,.6);animation:mx-live 1.6s infinite}
@keyframes mx-live{70%{box-shadow:0 0 0 7px rgba(65,221,156,0)}}
.mx-sel{position:absolute;right:16px;bottom:18px;display:inline-flex;gap:6px;align-items:center;padding:7px 13px;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--b));color:#0b0716;font:800 .78rem var(--f-body);box-shadow:0 8px 24px -8px var(--a);transform:scale(.6);opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.mx-sel .ico{width:14px;height:14px;stroke-width:3}
.mx-card.on{opacity:1;border-color:transparent;box-shadow:0 0 0 2px var(--a),0 0 0 6px color-mix(in srgb,var(--a) 18%,transparent),0 30px 70px -26px var(--a);transform:translateY(-2px)}
.mx-card.on .mx-sel{transform:none;opacity:1}
.mx-card[disabled]{cursor:not-allowed}
.mx-card.locked{cursor:not-allowed;opacity:1}
.mx-card.locked>:not(.mx-lock):not(.mx-bg){filter:grayscale(.7) brightness(.55)}
.mx-lock{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(8,5,16,.35),rgba(8,5,16,.7));}
.mx-lock-ico{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;background:rgba(14,14,17,.8);border:1px solid color-mix(in srgb,var(--a) 50%,transparent);box-shadow:0 0 30px -6px var(--a);margin-bottom:4px}
.mx-lock-ico .ico{width:24px;height:24px;color:color-mix(in srgb,var(--a) 80%,#fff)}
.mx-lock b{font:800 1.05rem var(--f-display)}.mx-lock small{color:var(--muted);font-size:.84rem;max-width:30ch}
.mx-card.locked:hover .mx-lock-ico{animation:mx-shake .4s}
@keyframes mx-shake{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@media (max-width:720px){.mx-card{min-height:auto;padding:20px;grid-template-columns:1fr}.mx-arena{grid-column:1;grid-row:auto;order:-1}.mx-num{font-size:6.5rem}.mx-sel{top:16px;bottom:auto}}
@media (prefers-reduced-motion:reduce){.mx-card *{animation:none!important}}
.int-yrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* PRO-LAYER-START */
/* =====================================================================
   RIVALS — charte « pro » (couche finale)
   Fond neutre, une seule couleur d'accent, typo condensée, angles nets.
   Les animations d'entrée, de survol, l'emblème de rang et les
   cosmétiques de la boutique sont conservés.
   ===================================================================== */
body{font-size:15.5px;line-height:1.5;letter-spacing:.005em}
body::before{background:radial-gradient(1100px 420px at 50% -180px,rgba(139,92,246,.07),transparent 70%),var(--bg)}
body::after{display:none}
::selection{background:rgba(139,92,246,.35)}
h1,h2,h3{font-weight:700;letter-spacing:.005em}
h1{font-size:clamp(2rem,4.4vw,2.9rem);line-height:1.02}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
a{color:var(--accent-hi)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- Barre du haut ---------- */
.topbar{padding-top:10px;padding-bottom:10px;gap:28px;border-bottom-color:var(--line)}
.logo{font-size:1.45rem;font-weight:800;letter-spacing:.1em;gap:10px}
.logo-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);box-shadow:none;font-size:.95rem}
.nav{gap:2px;margin-left:4px}
.nav a{position:relative;border-radius:6px;padding:8px 12px;font-weight:600;font-size:.95rem;color:var(--muted)}
.nav a .ico{opacity:.8}
.nav a:hover{background:rgba(255,255,255,.04)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.06);box-shadow:none;color:var(--text)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;background:var(--accent);border-radius:2px}
.user-chip{border-radius:6px;background:var(--surface);padding:3px 12px 3px 3px}
.user-chip .avatar{border-radius:5px}
.footer{color:var(--faint);font-size:.8rem;border-top:1px solid var(--line);margin-top:24px;padding-top:20px}
main{padding-top:32px}

/* ---------- Boutons ---------- */
.btn{border-radius:6px;font:600 .95rem/1 var(--f-body);letter-spacing:.01em;--bh:42px;padding:0 18px;gap:8px}
.btn-primary{background:var(--accent);box-shadow:none;color:#fff}
.btn-primary:hover:not([disabled]){background:var(--accent-press);box-shadow:none}
.btn-ghost{background:var(--surface-2);border-color:var(--line-strong)}
.btn-ghost:hover:not([disabled]){background:var(--surface-3);border-color:rgba(255,255,255,.2)}
.btn-danger{background:rgba(242,87,111,.1);border-color:rgba(242,87,111,.32);color:#ffb4c0}
.btn-ok{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.32);color:#b5f0d4}
.btn-sm{--bh:34px;border-radius:5px;padding:0 12px;font-size:.88rem}
.btn-xl{--bh:52px;border-radius:7px;font-size:1.02rem;padding:0 28px}
.btn-icon{border-radius:6px}
.btn-discord{border-radius:6px!important;box-shadow:none!important}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border-color:var(--line);border-radius:10px;box-shadow:none}
.eyebrow{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;color:var(--faint)}
.pill{border-radius:4px;border:0;padding:4px 8px;font-size:.74rem;letter-spacing:.03em}
.pill::before{width:6px;height:6px}
.tag{border-radius:4px}
.tag-me{background:var(--accent-soft);color:#d9ceff;border-color:rgba(139,92,246,.35)}
.input{border-radius:6px;background:#0e0e12;border-color:var(--line-strong);min-height:44px;font-family:var(--f-body)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.alert{border-radius:8px}
.seg{border-radius:7px;background:#0e0e12;padding:3px;gap:2px}
.seg button{border-radius:5px;font:600 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:8px 18px}
.seg button[aria-pressed="true"]{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-strong);color:#fff}
.page-head{gap:8px;margin-bottom:28px}

/* Les mots en dégradé deviennent des couleurs pleines */
.grad,.hm-grad,.adm-grad,.gc-title .hm-grad{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--accent-hi)!important;filter:none!important;animation:none!important;-webkit-text-fill-color:currentColor}
.wordmark,.hm-stat b,.gc-kpi b,.lbp-mmr,.lb-mmr,.mc2 .mode-name,.hm-rank-name,.st-best b,.lb-me-pos b,.mm-vs,.mc2 .vs-mini{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--text)!important;-webkit-text-fill-color:currentColor;filter:none!important}
.mc2[aria-pressed="true"] .mode-name{animation:none}

/* ---------- Bandeaux de page (accueil, matchmaking, chat, classements, stats, admin) ---------- */
.hm-hero,.mm-arena,.gc-hero,.lb-hero,.st-hero,.adm-hero{border-radius:12px!important;border:1px solid var(--line)!important;box-shadow:none!important;
  background:linear-gradient(180deg,#15151a 0%,#111115 100%)!important}
.hm-hero::before,.mm-arena::before,.gc-hero::before,.lb-hero::before,.st-hero::before,.adm-hero::before{display:none!important}
.hm-hero::after,.mm-arena::after,.gc-hero::after,.lb-hero::after,.st-hero::after,.adm-hero::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.6),transparent);pointer-events:none}
.hm-blob{opacity:.16!important;filter:blur(80px)!important}
.hm-blob.b2{background:radial-gradient(circle,#3b3b55,transparent 65%)!important}
.hm-floor{opacity:.28}
.hm-particles i{box-shadow:none;background:rgba(255,255,255,.55)}
.hm-sweep{display:none}
.hm-title{font-size:clamp(2.6rem,6vw,4.4rem);line-height:.95;letter-spacing:-.005em;text-transform:uppercase}
.mm-arena .mm-title,.gc-title,.lb-hero h1,.st-hero h1,.adm-hero h1{text-transform:uppercase;letter-spacing:0;line-height:.95}
.hm-live{border-radius:4px;background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.25);padding:4px 10px 4px 8px;font-size:.8rem}
.live-chip{border-radius:4px!important}
.hm-chip{border-radius:4px;background:rgba(255,255,255,.03)}
.hm-chip b{color:var(--text)}
.hm-vs{-webkit-text-stroke:1px rgba(255,255,255,.06)}

/* Gros bouton « Jouer » : plein, net, sans bordure arc-en-ciel */
.hm-play{padding:0;border-radius:8px;background:none!important;animation:none!important;box-shadow:none!important}
.hm-play-in{height:56px;padding:0 40px;border-radius:8px;background:var(--accent);font:700 1.2rem var(--f-display);letter-spacing:.12em;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 24px -14px rgba(139,92,246,.9)}
.hm-play:hover .hm-play-in{background:var(--accent-press);transform:translateY(-1px)}
.hm-play-in::after{opacity:.35}
.hm-ghost{height:56px;border-radius:8px;background:var(--surface-2);border-color:var(--line-strong)}
.hm-ghost:hover{background:var(--surface-3);transform:none}

/* Tuiles d'icône : sobres */
.hm-stat-ico,.hm-h-ico,.tile-icon,.hm-quick .tile-icon,.gc-hero-ico,.adm-ico,.lb-hero-ico,.st-ico,.pf-ico{background:rgba(255,255,255,.05)!important;color:var(--text)!important;box-shadow:none!important;border:1px solid var(--line)!important;border-radius:8px!important}
.hm-h-ico.gold{color:#f2c14e!important}
.gc-hero-ico{width:56px;height:56px}
.gc-hero-ico svg{width:26px;height:26px}
.gc-hero-ico i{display:none}

/* Statistiques */
.hm-stat{border-radius:10px!important;background:var(--surface)!important;border:1px solid var(--line)!important}
.hm-stat::before,.hm-stat::after{display:none!important}
.hm-stat b{font:700 1.9rem var(--f-display)!important;letter-spacing:.01em}
.hm-stat div>span{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.hm-ring .fg{filter:none}

/* Cartes de rang : on garde l'emblème, on calme le fond */
.hm-rank{border-radius:12px!important;background:radial-gradient(260px circle at 12% 40%,color-mix(in srgb,var(--ra) 10%,transparent),transparent 70%),var(--surface)!important;border:1px solid var(--line)!important}
.hm-rank::before{opacity:.35}
.hm-rank:hover{box-shadow:none;border-color:var(--line-strong)!important}
.hm-rank-rays{opacity:.35}
.hm-mode,.hm-wl b,.hm-div,.mc-wl b{border-radius:4px}
.hm-bar{border-radius:3px;height:8px}
.hm-bar i{border-radius:3px;box-shadow:none}
.hm-pips i{border-radius:2px}
.hm-pips i.on{background:var(--accent);box-shadow:none}

/* Panneaux */
.hm-panel,.gc-main,.mm-stage2.lp{border-radius:12px!important;background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.hm-panel-head h2{font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.hm-match{border-radius:7px}
.hm-res{border-radius:5px}
.hm-block{border-radius:6px 6px 2px 2px}
.tile,.quick{border-radius:10px}
.hm-quick .quick{background:var(--surface)!important}
.tile:hover{box-shadow:none}

/* ---------- Matchmaking ---------- */
.mc2{background:radial-gradient(300px circle at 85% 0%,color-mix(in srgb,var(--mc) 9%,transparent),transparent 70%),var(--surface)!important;border-radius:12px!important;border:1px solid var(--line)!important;box-shadow:none!important}
.mc2[aria-pressed="true"]{border-color:color-mix(in srgb,var(--mc) 60%,transparent)!important;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mc) 35%,transparent)!important}
.mode-card.mc2[aria-pressed="true"]>span.mc-aura{opacity:.18}
.mode-card.mc2[aria-pressed="true"]>span.mc-rays{opacity:.2}
.mc2 .mode-glyph{-webkit-text-stroke-color:rgba(255,255,255,.06)!important;filter:none!important}
.mc2 .mode-name{font-size:2.4rem;text-transform:uppercase;letter-spacing:.01em}
.mode-sel,.mc-sel{border-radius:4px!important}
.search-play .hm-play-in{height:54px}
.lp-name{letter-spacing:.06em}

/* ---------- Chat ---------- */
.gc-kpi{border-radius:8px;background:rgba(255,255,255,.03)}
.gc-kpi b{font:700 1.8rem var(--f-display)!important}
.gc-log.chat-log{border-radius:8px;background:#0e0e12!important;border:1px solid var(--line)}
.gc-log .day-sep{color:var(--faint)}
.gc-form .input{border-radius:6px}
.gc-send,.chat-send{border-radius:6px!important;background:var(--accent)!important;box-shadow:none!important}

/* ---------- Classements ---------- */
.lb-hero{border-color:var(--line)!important}
.lb-podium{background:none!important}

/* ---------- Profil ---------- */
.pf-side{background:var(--surface)!important;box-shadow:none!important;border-radius:12px!important}
.pf-side::before{display:none}
.pf-side-av .avatar{box-shadow:0 0 0 2px #121216,0 0 0 3px rgba(255,255,255,.14)}
.pf-nav a{border-radius:6px}
.pf-nav a[aria-current="page"]{background:rgba(255,255,255,.06)!important;box-shadow:inset 2px 0 0 var(--accent)!important;color:var(--text)!important}

/* ---------- Admin ---------- */
.adm-hero{border-color:var(--line)!important}
.adm-tabs button,.adm-tab,[data-tab]{border-radius:6px}

/* ---------- Boutique ---------- */
.sh-hero{border-radius:12px;border-color:var(--line)}
.sh-cat,.sh-tabs button{border-radius:6px}

/* ---------- Divers ---------- */
.toast{border-radius:8px!important;background:#18181e!important;border:1px solid var(--line-strong)!important;box-shadow:0 18px 40px -18px rgba(0,0,0,.8)!important}
.modal,.dialog,[role="dialog"]>.card{border-radius:12px}
.req-list li{border-radius:8px}
.linked-row{border-radius:10px}

/* ---------- Passe 2 ---------- */
.orbs i{opacity:.12!important}
body::before{animation:none}
.lb-trophy{width:56px;height:56px;border-radius:8px;background:rgba(242,193,78,.1);color:#f2c14e;border:1px solid rgba(242,193,78,.28);box-shadow:none}
.lb-trophy svg{width:26px;height:26px}
.lb-trophy i{display:none}
.lb-hero .hm-blob.b1{opacity:.1!important}
.lb-title,.mm-title,.adm-title,.gc-title,.sh-hero-txt h1{text-transform:uppercase;letter-spacing:0;line-height:.95}
.mode-card[aria-pressed="true"]{box-shadow:none}
.mode-card[aria-pressed="true"]::before{background:color-mix(in srgb,var(--mc,#8b5cf6) 55%,transparent);animation:none}
.mode-card[aria-pressed="true"]::after{inset:1px;background:radial-gradient(300px circle at 85% 0%,color-mix(in srgb,var(--mc,#8b5cf6) 12%,transparent),transparent 70%),#141419}
.mode-check,.mc2 .mode-check{border-radius:4px!important;background:var(--accent)!important;box-shadow:none!important}
.msg.mine .bubble{background:#2a2244;border:1px solid rgba(139,92,246,.28);box-shadow:none}
.bubble{background:#1b1b21;border-radius:10px 10px 10px 3px}
.msg.mine .bubble{border-radius:10px 10px 3px 10px}
.mp{background:#16161b!important}
.modal-backdrop{background:rgba(5,5,8,.74)}
.fx{background:radial-gradient(circle at 50% 45%,rgba(22,20,32,.8),rgba(5,5,8,.94))}
.tabbar{background:rgba(11,11,14,.94)!important}
/* onglets : soulignés, pas de pastille pleine */
.adm-tabs,.sh-tabs{background:transparent!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:0 2px!important;gap:2px!important}
.adm-tabs{background:rgba(11,11,14,.92)!important}
.adm-tabs button,.sh-tabs button{border-radius:0!important;padding:12px 14px!important;font:600 .92rem var(--f-body)!important;background:transparent!important;box-shadow:none!important}
.adm-tabs button[aria-selected="true"],.sh-tabs button[aria-selected="true"]{color:#fff!important;background:transparent!important;box-shadow:inset 0 -2px 0 var(--accent)!important}
.sh-tabs button em{background:rgba(255,255,255,.08);border-radius:3px}
/* profil : menu latéral */
.pf-nav a .ico{background:transparent!important;box-shadow:none!important;padding:7px}
.pf-nav a[aria-current="page"] .ico{background:transparent!important;color:var(--accent-hi)!important}
.pf-nav a[aria-current="page"]::before{display:none}
.pf-nav a:hover .ico{transform:none}
.st-tile .k{font-size:.72rem;letter-spacing:.08em}
/* cartes de mode 1v1 / 2v2 */
.mx-card{background:var(--surface)!important;border-color:var(--line)!important}
.mx-bg{background:radial-gradient(90% 90% at 100% 0%,color-mix(in srgb,var(--a) 12%,transparent),transparent 60%),#131318!important}
.mx-bg::after{opacity:.5}
.mx-num{-webkit-text-stroke:1px rgba(255,255,255,.07)!important;opacity:1!important;filter:none!important}
.mx-card.on .mx-num{-webkit-text-stroke-color:color-mix(in srgb,var(--a) 35%,transparent)!important}
.mx-name{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--text)!important;-webkit-text-fill-color:currentColor;text-transform:uppercase;letter-spacing:.01em!important;font-weight:800!important}
.mx-kicker{color:var(--muted)!important}
.mx-kicker .ico{color:color-mix(in srgb,var(--a) 75%,#fff)}
.mx-chip{border-radius:4px;background:rgba(255,255,255,.04)}
.mx-sel{border-radius:4px;background:var(--a)!important;color:#fff!important;box-shadow:none!important;font-weight:700}
.mx-card.on{box-shadow:inset 0 0 0 1px var(--a)!important;border-color:var(--a)!important;transform:none}
.mx-clash .ico{filter:none}
.mx-team .avatar,.mx-ghost{box-shadow:0 0 0 3px #131318}
.mx-lock{background:rgba(11,11,14,.72)}
.mx-lock-ico{box-shadow:none;border-color:var(--line-strong)}
/* étapes du matchmaking */
#mm-steps.steps li{background:var(--surface)!important}
#mm-steps.steps li:hover{box-shadow:none;border-color:var(--line-strong)}
#mm-steps .st-ico,#mm-steps li .ico-wrap,#mm-steps li>span:first-child{background:rgba(255,255,255,.05)!important;color:var(--text)!important;box-shadow:none!important;border-radius:6px!important}
#mm-steps .st-num{-webkit-text-stroke-color:rgba(255,255,255,.08)}
#mm-steps .n{background:rgba(255,255,255,.05)!important;box-shadow:none!important;border:1px solid var(--line)!important;color:var(--text)}
#mm-steps li:hover .n{transform:none}
#mm-steps li::after{background:linear-gradient(90deg,transparent,rgba(139,92,246,.5),transparent);opacity:.5}
.gc-log .msg.mine .bubble{background:#2a2244!important;box-shadow:none!important;border:1px solid rgba(139,92,246,.28)!important}
.ann{box-shadow:none!important}
.empty-ico,.dm-empty-ico,.mp-empty .ico-tile{background:rgba(255,255,255,.05)!important;box-shadow:none!important}
.amount-chips button{border-radius:6px}
.amount-chips button[aria-pressed="true"]{box-shadow:none;background:var(--accent-soft)}
@media (max-width:760px){.hm-stat div>span,.st-tile .k{letter-spacing:.04em;font-size:.7rem}.hm-title{font-size:2.5rem}}
.tabbar a[aria-current="page"]{background:rgba(255,255,255,.06)!important;box-shadow:inset 0 2px 0 var(--accent)!important;border-radius:6px}

/* ---------- Admin : rangs ---------- */
.rk-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.rk-table{width:100%;border-collapse:collapse;font-size:.92rem}
.rk-table th{position:sticky;top:0;text-align:left;font:600 .72rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 12px;background:#141419;border-bottom:1px solid var(--line)}
.rk-table td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.rk-table tr:last-child td{border-bottom:0}
.rk-table tr.rk-fam td{padding:8px 12px 6px;font:700 .8rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.02)}
.rk-emb{width:52px}
.rk-emb .emblem{display:block}
.rk-table .input{min-height:36px;padding:0 10px}
.rk-name{min-width:180px}
.rk-num{width:110px;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.9rem}
.rk-table [data-changed]{border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.06)}
.rk-zero{display:inline-flex;align-items:center;height:36px;padding:0 10px;color:var(--faint);font-family:var(--f-mono);font-size:.9rem}
.rk-table .error{display:block;margin-top:4px;font-size:.76rem}
.rk-table .error:empty{display:none}
.rk-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ---------- Emblèmes de rang v2 : aura qui grandit avec le rang ---------- */
.rk-au{position:relative;display:inline-grid;place-items:center;flex:none;vertical-align:middle;isolation:isolate;line-height:0}
.rk-au>.emblem{position:relative;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.rk-au>i,.rk-au>b,.rk-au>span{position:absolute;left:50%;top:50%;pointer-events:none;transform:translate(-50%,-50%)}
.rk-glow{width:calc(82% + var(--rl)*14%);height:calc(82% + var(--rl)*14%);border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 68%);opacity:calc(.14 + var(--rl)*.07);animation:rkBreathe 3s ease-in-out infinite;z-index:0}
.rk-glow.still{animation:none;width:150%;height:150%;opacity:calc(var(--rl)*.06)}
.rk-rays{width:175%;height:175%;border-radius:50%;background:repeating-conic-gradient(var(--rc) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);opacity:calc(.08 + var(--rl)*.05);animation:rkSpin 18s linear infinite;z-index:0}
.rk-ring{width:142%;height:142%;border-radius:50%;border:1.5px dashed var(--rc);opacity:.5;animation:rkSpin 12s linear infinite reverse;z-index:1}
.rk-flare{width:152%;height:152%;border-radius:50%;background:conic-gradient(from 0deg,var(--rc),transparent 25%,#fff 50%,transparent 75%,var(--rc));filter:blur(14px);opacity:.5;animation:rkSpin 5s linear infinite;z-index:0}
.rk-wave{width:105%;height:105%;border-radius:50%;border:2px solid var(--rc);opacity:0;animation:rkWave 2.4s ease-out infinite;z-index:1}
.rk-w2{animation-delay:1.2s}
.rk-sp{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--rc);animation:rkTw 2s ease-in-out infinite;z-index:3}
.rk-orb{width:154%;height:154%;animation:rkSpin 6s linear infinite;z-index:3}
.rk-orb em{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px var(--rc);transform:rotate(0deg) translateY(-77cqw)}
.rk-orb{container-type:inline-size}
.rk-orb em:nth-child(1){transform:rotate(0deg) translateY(-50cqw)}
.rk-orb em:nth-child(2){transform:rotate(120deg) translateY(-50cqw)}
.rk-orb em:nth-child(3){transform:rotate(240deg) translateY(-50cqw)}
.rk-ssl .rk-glow{background:radial-gradient(circle,#fff,#c6b8ff 30%,transparent 68%)}
.rk-ssl .rk-flare{background:conic-gradient(#ff7ad9,#7ac8ff,#9dffb0,#ffe27a,#ff7ad9);filter:blur(16px);opacity:.6;animation-duration:3.5s}
.rk-ssl .rk-rays{opacity:.5;background:repeating-conic-gradient(#fff 0 3deg,transparent 3deg 15deg)}
@keyframes rkSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes rkBreathe{50%{transform:translate(-50%,-50%) scale(1.12)}}
@keyframes rkWave{0%{transform:translate(-50%,-50%) scale(.8);opacity:.7}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
@keyframes rkTw{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.rk-au *{animation:none!important}}
.adm-tabs button{padding:12px 11px!important;font-size:.9rem!important}
/* ---------- Captures d'écran dans le chat de match ---------- */
.cm-img{padding:0;border:1px solid var(--line-strong);background:#0e0e12;cursor:zoom-in;max-width:min(280px,64vw);display:block;font:inherit;color:inherit}
.cm-img img{object-fit:cover}
.cm-img .cm-zoom{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:rgba(11,11,14,.78);color:#fff;opacity:0;transition:opacity .15s}
.cm-img:hover .cm-zoom,.cm-img:focus-visible .cm-zoom{opacity:1}
.cm-img:hover{border-color:rgba(139,92,246,.6)}
.chat-attach{display:flex;align-items:center;gap:12px;margin:0 0 8px;padding:8px;border-radius:8px;background:#141419;border:1px solid rgba(139,92,246,.4)}
.chat-attach[hidden]{display:none}
.chat-attach img{width:72px;height:48px;object-fit:cover;border-radius:5px;flex:none;border:1px solid var(--line)}
.chat-attach .ca-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chat-attach .ca-txt b{font-size:.9rem}
.chat-attach .ca-txt span{font-size:.78rem;color:var(--faint)}
.chat-attach.sending{opacity:.6;pointer-events:none}
.chat-attach.sending .ca-txt b::after{content:" · envoi…";color:var(--accent-hi)}
#match-chat.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.imgv{position:fixed;inset:0;z-index:200;background:rgba(5,5,8,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;animation:fade .15s ease}
.imgv img{max-width:min(1600px,96vw);max-height:84vh;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.7);cursor:zoom-out}
.imgv-bar{display:flex;gap:8px}
.adm-shot{display:inline-block;vertical-align:middle;margin-left:4px}
.adm-shot img{height:44px;border-radius:4px;border:1px solid var(--line-strong)}
.req-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* Sécurité du compte */
.sec-h{font:700 1rem/1.2 var(--font-display,inherit);letter-spacing:.02em;margin:0}
.sec-sep{height:1px;background:var(--line,rgba(255,255,255,.08))}
.sec-pill{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid currentColor;letter-spacing:.04em}
.sec-pill.ok{color:#3ecf8e}.sec-pill.warn{color:#fbbf24}
.tfa-steps{margin:0;padding-left:1.2em;display:grid;gap:4px;color:var(--muted,#a0a0ab);font-size:.92rem}
.tfa-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tfa-qr{width:180px;height:180px;border-radius:8px;background:#fff;padding:6px;image-rendering:pixelated}
.tfa-key{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:1rem;letter-spacing:.08em;word-break:break-all;padding:8px 10px;border-radius:6px;background:var(--bg-2,#141419);border:1px solid var(--line-strong,rgba(255,255,255,.14))}
.tfa-codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tfa-codes code{font-family:var(--font-mono,'JetBrains Mono',monospace);text-align:center;padding:8px;border-radius:6px;background:var(--bg-2,#141419);border:1px solid var(--line-strong,rgba(255,255,255,.14));letter-spacing:.06em}
/* Onglet propriétaire */
.own-stats{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 10px;color:var(--muted,#a0a0ab);font-size:.9rem}.own-stats b{color:#fff;margin-right:4px}
.own-note{display:flex;gap:8px;align-items:center;font-size:.84rem;margin:0 0 12px}.own-note svg{width:15px;height:15px;flex:none}
.own-table td{vertical-align:middle}
.own-name{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.own-dot{width:8px;height:8px;border-radius:50%;background:#3ecf8e;display:inline-block}
.own-tag{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.3}
.own-tag.own{color:#fbbf24}.own-tag.adm{color:#a78bfa}.own-tag.ok{color:#3ecf8e}.own-tag.bad{color:#f87171}.own-tag.warn{color:#fb923c}
.own-modal-wrap{max-width:760px!important;width:min(760px,94vw)!important}
.own-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.own-kv{display:flex;flex-direction:column;gap:2px;padding:9px 11px;border-radius:7px;background:var(--bg-2,#141419);border:1px solid var(--line,rgba(255,255,255,.08));min-width:0}
.own-kv span{font-size:.75rem;color:var(--faint,#77777f);text-transform:uppercase;letter-spacing:.06em}.own-kv b{font-weight:600;word-break:break-word}
.own-list{display:grid;gap:6px}.own-list>div{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 11px;border-radius:7px;background:var(--bg-2,#141419);font-size:.88rem}
.own-temp{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}.own-temp code{font-family:var(--font-mono,'JetBrains Mono',monospace);font-size:1.15rem;letter-spacing:.06em;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.35);user-select:all}
@media (max-width:640px){.own-grid{grid-template-columns:1fr}.own-list>div{grid-template-columns:1fr}}
/* Onglets admin : passent à la ligne au lieu d'être coupés */
@media (min-width:901px){.adm-tabs{flex-wrap:wrap!important;overflow:visible!important;row-gap:0!important}}

<script>
/* Chargement RIVALS dessiné en canvas : grand écran au démarrage + petite version dans les pages */
window.RVLoader = (() => {
  const TAU = Math.PI * 2;
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  // Logo R + anneau qui tourne, centré en (cx, cy), taille s (côté du carré)
  function mark(c, cx, cy, s, t) {
    const pulse = 1 + Math.sin(t * 3.2) * 0.035, k = s * pulse;
    // halo
    const g0 = c.createRadialGradient(cx, cy, k * .2, cx, cy, k * 1.3);
    g0.addColorStop(0, 'rgba(139,92,246,.35)'); g0.addColorStop(1, 'rgba(139,92,246,0)');
    c.fillStyle = g0; c.beginPath(); c.arc(cx, cy, k * 1.3, 0, TAU); c.fill();
    // anneau : piste + deux arcs qui s’allongent et se rétractent
    const R = k * .9, lw = Math.max(2, s * .07);
    c.lineCap = 'round'; c.lineWidth = lw;
    c.strokeStyle = 'rgba(255,255,255,.07)'; c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
    const head = t * 4.6, len = .55 + (Math.sin(t * 2.3) + 1) * 1.05;
    c.shadowColor = '#8b5cf6'; c.shadowBlur = s * .25;
    const ga = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    ga.addColorStop(0, '#c4b5fd'); ga.addColorStop(1, '#8b5cf6');
    c.strokeStyle = ga; c.beginPath(); c.arc(cx, cy, R, head, head + len); c.stroke();
    c.globalAlpha = .45; c.beginPath(); c.arc(cx, cy, R, head + Math.PI, head + Math.PI + len * .45); c.stroke();
    c.globalAlpha = 1; c.shadowBlur = 0;
    // carré violet
    const q = k * .62;
    const g1 = c.createLinearGradient(cx - q / 2, cy - q / 2, cx + q / 2, cy + q / 2);
    g1.addColorStop(0, '#a78bfa'); g1.addColorStop(1, '#6d28d9');
    rr(c, cx - q / 2, cy - q / 2, q, q, q * .22); c.fillStyle = g1; c.fill();
    // reflet qui balaie le carré
    c.save(); rr(c, cx - q / 2, cy - q / 2, q, q, q * .22); c.clip();
    const sx = cx - q + ((t * .7) % 1.6) * q * 1.6;
    const g2 = c.createLinearGradient(sx - q * .3, 0, sx + q * .3, 0);
    g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(.5, 'rgba(255,255,255,.28)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g2; c.fillRect(cx - q, cy - q, q * 2, q * 2); c.restore();
    // R
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `800 ${Math.round(q * .78)}px "Barlow Condensed","Arial Narrow",sans-serif`;
    c.fillText('R', cx, cy + q * .04);
  }
  function fit(cv) {
    const d = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h); return [c, w, h];
  }
  function boot(cv, t) {
    const [c, w, h] = fit(cv), cy = h * .46, s = Math.min(150, Math.max(96, Math.min(w, h) * .2));
    mark(c, w / 2, cy, s, t);
    // RIVALS
    c.fillStyle = '#f4f4f6'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = `800 ${Math.round(s * .3)}px "Barlow Condensed","Arial Narrow",sans-serif`;
    if ('letterSpacing' in c) c.letterSpacing = `${(s * .3 * .32).toFixed(1)}px`;
    c.fillText('RIVALS', w / 2 + (('letterSpacing' in c) ? s * .3 * .16 : 0), cy + s * 1.18);
    if ('letterSpacing' in c) c.letterSpacing = '0px';
    // barre de chargement
    const bw = s * 1.5, bh = 3, bx = w / 2 - bw / 2, by = cy + s * 1.42;
    rr(c, bx, by, bw, bh, 1.5); c.fillStyle = 'rgba(255,255,255,.08)'; c.fill();
    const p = (t * .9) % 1.4 - .2, seg = bw * .35, x0 = bx + p * bw;
    c.save(); rr(c, bx, by, bw, bh, 1.5); c.clip();
    const gb = c.createLinearGradient(x0 - seg / 2, 0, x0 + seg / 2, 0);
    gb.addColorStop(0, 'rgba(139,92,246,0)'); gb.addColorStop(.5, '#a78bfa'); gb.addColorStop(1, 'rgba(139,92,246,0)');
    c.fillStyle = gb; c.fillRect(x0 - seg / 2, by, seg, bh); c.restore();
  }
  let raf = 0; const t0 = performance.now();
  function loop(now) {
    const t = (now - t0) / 1000, bc = document.getElementById('rv-boot-cv');
    if (bc && bc.isConnected) boot(bc, t);
    const small = document.querySelectorAll('canvas.rv-spin');
    small.forEach(cv => { const [c, w, h] = fit(cv); mark(c, w / 2, h / 2, Math.min(w, h) * .37, t); });
    raf = (bc && bc.isConnected) || small.length ? requestAnimationFrame(loop) : 0;
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  kick();
  // cache l’écran de démarrage dès que l’appli a affiché sa première page (au moins 0,7 s pour voir l’anim)
  function hideBoot() {
    const b = document.getElementById('rv-boot'); if (!b || b.dataset.off) return;
    b.dataset.off = '1'; const wait = Math.max(0, 700 - (performance.now() - t0));
    setTimeout(() => { b.classList.add('off'); setTimeout(() => b.remove(), 450); }, wait);
  }
  document.addEventListener('DOMContentLoaded', () => {
    const app = document.getElementById('app');
    const ready = () => app && app.children.length && !app.querySelector(':scope > .boot-wait');
    if (ready()) hideBoot();
    else new MutationObserver((_, o) => { if (ready()) { o.disconnect(); hideBoot(); } }).observe(app, { childList: true });
    setTimeout(hideBoot, 10000);
  });
  return { kick, html: (text) => `<div class="loading rv-loading" role="status"><canvas class="rv-spin" aria-hidden="true"></canvas><span>${text}</span></div>` };
})();
</script>

<script>
'use strict';
/* =====================================================================
   RIVALS — prototype front-end
   Architecture :
   1. Storage     : persistance (localStorage, repli en mémoire)
   2. Api         : « faux backend » asynchrone. Chaque méthode correspond
                    à un futur endpoint REST (voir commentaires). Pour brancher
                    un serveur, remplace le corps des méthodes par des fetch().
   3. Matchmaker  : file d'attente. En prototype, elle complète le lobby avec
                    des joueurs simulés. À remplacer par un WebSocket.
   4. UI          : composants réutilisables (chaînes HTML) + vues + routeur.
   ===================================================================== */

/* ========================= 1. STORAGE ========================= */
const Storage = (() => {
  const KEY = 'rivals.db.v1', SESSION = 'rivals.session';
  const mem = {};
  let ok = true;
  try { localStorage.setItem('__rv', '1'); localStorage.removeItem('__rv'); } catch (e) { ok = false; }
  const get = k => { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } };
  const set = (k, v) => { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } };
  const del = k => { try { if (ok) localStorage.removeItem(k); } catch (e) {} delete mem[k]; };
  return {
    persistent: ok,
    load() { const raw = get(KEY); if (!raw) return null; try { return JSON.parse(raw); } catch (e) { return null; } },
    save(db) { set(KEY, JSON.stringify(db)); },
    getSession() { return get(SESSION); },
    setSession(id) { id ? set(SESSION, id) : del(SESSION); },
    get, set, del,
    reset() { del(KEY); del(SESSION); del('rivals.match'); }
  };
})();

/* ========================= 2. API (backend simulé) ========================= */
const rid = (n = 8) => Math.random().toString(36).slice(2, 2 + n);
const wait = (min = 220, max = 520) => new Promise(r => setTimeout(r, min + Math.random() * (max - min)));
const norm = s => String(s ?? '').trim();

class ApiError extends Error {
  constructor(message, fields = {}) { super(message); this.fields = fields; }
}

// @@RULES_START@@
/* RIVALS — règles partagées (site + serveur) : rangs, MMR, placements, ELO.
   Seuils repris du tableau de rangs fourni (début de chaque rang, par mode). */
const RIVALS_RULES = (() => {
  const FAMILIES = [
    ['bronze', 'Bronze'], ['silver', 'Argent'], ['gold', 'Or'], ['platinum', 'Platine'],
    ['diamond', 'Diamant'], ['champion', 'Champion'], ['gc', 'Grand Champion']
  ];
  const TIERS = [];
  FAMILIES.forEach(([key, name]) => [1, 2, 3].forEach(lvl => TIERS.push({ family: key, name: `${name} ${'I'.repeat(lvl)}`, lvl })));
  TIERS.push({ family: 'ssl', name: 'Supersonic Legend', lvl: 0 });

  // MMR minimum de chaque rang (Bronze I → Supersonic Legend)
  const STARTS = {
    '1v1': [0, 140, 200, 260, 320, 380, 440, 500, 560, 620, 680, 740, 800, 860, 920, 980, 1040, 1100, 1160, 1220, 1280, 1340],
    '2v2': [0, 180, 240, 300, 360, 420, 480, 540, 600, 680, 760, 840, 920, 1000, 1100, 1200, 1300, 1400, 1500, 1620, 1740, 1860]
  };
  const PLACEMENTS = 5;
  const START_MMR = { '1v1': 600, '2v2': 680 };
  const K = 32, K_PLACEMENT = 64;

  function rankFor(mode, mmr) {
    const s = STARTS[mode];
    let i = 0;
    while (i + 1 < s.length && mmr >= s[i + 1]) i++;
    const t = TIERS[i];
    if (i === s.length - 1) return { ...t, index: i, division: null };
    // Pas des divisions comme dans le tableau : (écart du rang + 15 de chevauchement) / 4
    const span = s[i + 1] - s[i];
    const step = i === 0 ? span / 4 : (span + 15) / 4;
    const division = Math.min(4, Math.floor((mmr - s[i]) / step) + 1);
    return { ...t, index: i, division };
  }
  const newRating = mode => ({ mmr: START_MMR[mode], played: 0, wins: 0 });

  function summary(mode, r) {
    r = r || newRating(mode);
    const placed = r.played >= PLACEMENTS;
    return {
      mmr: r.mmr, played: r.played, wins: r.wins, losses: r.played - r.wins,
      rate: r.played ? Math.round(r.wins / r.played * 100) : 0,
      placed, placementsLeft: Math.max(0, PLACEMENTS - r.played),
      rank: placed ? rankFor(mode, r.mmr) : null
    };
  }

  const expected = (a, b) => 1 / (1 + Math.pow(10, (b - a) / 400));

  // ELO d'équipe : chaque joueur gagne/perd selon la moyenne MMR des deux équipes.
  // Pendant les placements, les variations sont doublées pour trouver le bon rang vite.
  function computeElo(teams, winner, getRating) {
    const avg = t => t.reduce((s, id) => s + getRating(id).mmr, 0) / t.length;
    const ra = [avg(teams[0]), avg(teams[1])];
    const out = {};
    teams.forEach((t, ti) => {
      const e = expected(ra[ti], ra[1 - ti]);
      const score = ti === winner ? 1 : 0;
      t.forEach(id => {
        const r = getRating(id);
        const placement = r.played < PLACEMENTS;
        let d = Math.round((placement ? K_PLACEMENT : K) * (score - e));
        if (score === 1 && d < 1) d = 1;
        if (score === 0 && d > -1) d = -1;
        const after = Math.max(0, r.mmr + d);
        out[id] = { before: r.mmr, after, delta: after - r.mmr, placement, won: score === 1 };
      });
    });
    return out;
  }
  function applyElo(changes, getRating) {
    for (const [id, c] of Object.entries(changes)) {
      const r = getRating(id);
      r.mmr = c.after; r.played += 1; if (c.won) r.wins += 1;
    }
  }


  // Rangs modifiables en direct par les admins : noms + MMR de départ de chaque rang
  const DEFAULTS = { names: TIERS.map(t => t.name), starts: { '1v1': STARTS['1v1'].slice(), '2v2': STARTS['2v2'].slice() } };
  function checkRanks(c) {
    const errors = {}, out = { names: [], starts: {} };
    const n = TIERS.length;
    const names = Array.isArray(c && c.names) ? c.names : [];
    for (let i = 0; i < n; i++) {
      const v = String(names[i] == null ? '' : names[i]).replace(/\s+/g, ' ').trim().slice(0, 32);
      if (!v) errors['n' + i] = 'Nom obligatoire.';
      out.names.push(v || DEFAULTS.names[i]);
    }
    for (const mode of ['1v1', '2v2']) {
      const arr = Array.isArray(c && c.starts && c.starts[mode]) ? c.starts[mode] : [];
      const key = mode === '1v1' ? 'a' : 'b';
      out.starts[mode] = [];
      for (let i = 0; i < n; i++) {
        let v = i === 0 ? 0 : Math.floor(Number(arr[i]));
        if (!Number.isFinite(v) || v < 0 || v > 100000) { errors[key + i] = 'Nombre entre 0 et 100000.'; v = DEFAULTS.starts[mode][i]; }
        else if (i > 0 && v <= out.starts[mode][i - 1]) errors[key + i] = 'Doit être plus haut que le rang du dessous.';
        out.starts[mode].push(v);
      }
    }
    return { ok: !Object.keys(errors).length, errors, value: out };
  }
  function configure(c) {
    const r = c ? checkRanks(c) : { ok: true, value: DEFAULTS };
    const v = r.ok ? r.value : DEFAULTS;
    TIERS.forEach((t, i) => { t.name = v.names[i]; });
    for (const mode of ['1v1', '2v2']) STARTS[mode].splice(0, STARTS[mode].length, ...v.starts[mode]);
    return r.ok;
  }
  const currentRanks = () => ({ names: TIERS.map(t => t.name), starts: { '1v1': STARTS['1v1'].slice(), '2v2': STARTS['2v2'].slice() } });

  return { TIERS, STARTS, PLACEMENTS, START_MMR, rankFor, newRating, summary, computeElo, applyElo, DEFAULTS, checkRanks, configure, currentRanks };
})();
if (typeof module !== 'undefined') module.exports = RIVALS_RULES;

// @@RULES_END@@
// @@CORE_START@@
/* RIVALS — logique commune (site + serveur) : portefeuille (en euros, montants stockés en centimes), VIP, karma,
   badges Prestige, équipes, invitations, parrainage, photo de profil, historique.
   Toutes les fonctions travaillent sur l'objet `db` ; elles lèvent CoreError en cas de refus. */
const RIVALS_CORE = (() => {
  const R = typeof RIVALS_RULES !== 'undefined' ? RIVALS_RULES : require('./rules');
  const CFG = {
    // Tous les montants sont en centimes d'euro (500 = 5 €).
    CURRENCY: 'EUR', WIN_REWARD: 10, REF_BONUS: 50, VIP_PRICE: 500, VIP_DAYS: 30,
    DEPOSIT_PRESETS: [500, 1000, 2500, 5000], DEPOSIT_MIN: 500, DEPOSIT_MAX: 5000, TEAM_MAX: 5,
    KARMA_OK: 1, KARMA_LIE: -5
  };
  // Boutique : bannières animées, décorations d'avatar et packs (prix en centimes)
  const SHOP = [
    // Effets de profil (type 'banner') : animation posée par-dessus la fiche joueur
    { id: 'fx_supernova', type: 'banner', name: 'Supernova', price: 599, desc: 'Une étoile qui explose au-dessus de ta fiche : ondes de choc et éclats de lumière.' },
    { id: 'fx_galaxy', type: 'banner', name: 'Galaxie spirale', price: 599, desc: 'Une galaxie qui tourne lentement, poussière d’étoiles et étoiles filantes.' },
    { id: 'fx_cosmos', type: 'banner', name: 'Pluie de comètes', price: 499, desc: 'Des comètes qui traversent ta fiche dans un ciel étoilé.' },
    { id: 'fx_abyss', type: 'banner', name: 'Ténèbres', price: 599, desc: 'Fumée noire, tentacules d’ombre et yeux qui s’ouvrent dans le noir.' },
    { id: 'fx_inferno', type: 'banner', name: 'Enfer', price: 599, desc: 'Des flammes qui dévorent le bas de ta fiche et des braises qui montent.' },
    { id: 'fx_divine', type: 'banner', name: 'Lumière divine', price: 699, desc: 'Rayons célestes et plumes dorées qui tombent du ciel.' },
    { id: 'fx_storm', type: 'banner', name: 'Colère de Zeus', price: 599, desc: 'Des éclairs qui frappent ta fiche dans un ciel d’orage.' },
    { id: 'fx_blackhole', type: 'banner', name: 'Trou noir', price: 699, desc: 'Un trou noir et son disque de feu qui avale la lumière.' },
    // Décorations d'avatar
    { id: 'd_supernova', type: 'deco', name: 'Cœur de supernova', price: 499, desc: 'Rayons d’étoile, ondes de choc et anneaux néon autour de ta photo.' },
    { id: 'd_galaxy', type: 'deco', name: 'Anneau galactique', price: 499, desc: 'Un anneau de galaxie et une planète en orbite.' },
    { id: 'd_abyss', type: 'deco', name: 'Couronne des ténèbres', price: 499, desc: 'Des tentacules d’ombre qui ondulent au-dessus de ta tête.' },

function createDb() {
  const db = { version: 2, users: {}, matches: {} };
  BOTS.forEach(([u, e, a, b], i) => {
    const id = 'bot_' + i;
    db.users[id] = { id, username: u, epic: e, bot: true, createdAt: Date.now() - (60 - i) * 86400000,
      ratings: { '1v1': { mmr: a[0], played: a[1], wins: a[2] }, '2v2': { mmr: b[0], played: b[1], wins: b[2] } } };
  });
  return db;
}

const Validate = {
  username(v) {
    v = norm(v);
    if (!v) return 'Choisis un identifiant RIVALS.';
    if (v.length < 3 || v.length > 16) return 'L’identifiant doit faire entre 3 et 16 caractères.';
    if (!/^[A-Za-z0-9_.-]+$/.test(v)) return 'Utilise seulement des lettres, des chiffres, « _ », « - » ou « . ».';
    return null;
  },
  epic(v, required = false) {
    v = norm(v);
    if (!v) return required ? 'Renseigne ton pseudo Epic Games.' : null;
    if (v.length < 3 || v.length > 16) return 'Un pseudo Epic Games fait entre 3 et 16 caractères.';
    return null;
  },
  password(v) {
    if (!v) return 'Choisis un mot de passe.';
    if (v.length < 6) return 'Le mot de passe doit contenir au moins 6 caractères.';
    return null;
  }
};

async function hashPassword(pw, salt) {
  // Hachage côté navigateur pour ne pas stocker le mot de passe en clair.
  // Ce n'est PAS une sécurité réelle : un vrai backend doit hacher côté serveur (bcrypt/argon2).
  try {
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h = 0; for (const c of salt + pw) h = (h * 31 + c.charCodeAt(0)) | 0; return 'w' + h;
}

const findByUsername = u => Object.values(DB.users).find(x => x.username.toLowerCase() === norm(u).toLowerCase());
const teamOf = (m, uid) => m.teams[0].includes(uid) ? 0 : m.teams[1].includes(uid) ? 1 : -1;

function localRating(uid, mode) {
  const u = DB.users[uid]; u.ratings = u.ratings || {};
  if (!u.ratings[mode]) u.ratings[mode] = RULES.newRating(mode);
  return u.ratings[mode];
}
const ratingsOf = uid => ({ '1v1': RULES.summary('1v1', localRating(uid, '1v1')), '2v2': RULES.summary('2v2', localRating(uid, '2v2')) });
const publicUser = u => u && ({ id: u.id, username: u.username, epic: u.epic || '', bot: !!u.bot, admin: !!u.admin, createdAt: u.createdAt, ratings: ratingsOf(u.id), ...CORE.publicExtra(DB, u) });

function localFinalize(m, winner, text, opts) {
  const ch = RULES.computeElo(m.teams, winner, id => localRating(id, m.mode));
  RULES.applyElo(ch, id => localRating(id, m.mode));
  m.mmr = ch; m.winner = winner; m.status = 'finished'; m.finishedAt = Date.now();
  m.history.push({ at: Date.now(), text });
  CORE.onFinalize(DB, m, opts);
}
// Règle : déclarer une défaite termine le match ; deux victoires déclarées → litige (admin)
function localEvaluate(m, uid, t, won) {
  if (!won) { localFinalize(m, 1 - t, `${DB.users[uid].username} a déclaré une défaite : victoire de l’équipe ${TEAM(1 - t)}.`); return; }
  const other = m.declarations[1 - t];
  if (other && other.won) {
    if (m.status !== 'disputed') {
      m.status = 'disputed'; m.disputedAt = Date.now();
      m.history.push({ at: Date.now(), text: 'Contradiction : les deux équipes déclarent une victoire. Un admin a été appelé.' });
      setTimeout(() => LocalApi.emitEvent({ type: 'dispute', match: structuredClone(m), disputes: LocalApi.disputeCount(), event: { kind: 'dispute' } }), 0);
    }
    return;
  }
  m.status = 'reported';
}

    // Prototype : un adversaire simulé répond pour montrer le fonctionnement du chat.
    const myTeam = teamOf(m, uid);
    const bot = myTeam >= 0 && m.teams[1 - myTeam].find(id => DB.users[id] && DB.users[id].bot);
    if (bot) {
      const first = !m.chat.some(c => c.by === bot);
      setTimeout(() => {
        const mm2 = DB.matches[matchId]; if (!mm2) return;
        const line = first ? `Salut ! Mon pseudo Epic, c’est ${DB.users[bot].epic}. Je t’ajoute.` : BOT_LINES[Math.floor(Math.random() * BOT_LINES.length)];
        mm2.chat.push({ id: rid(8), by: bot, text: line, at: Date.now() }); commit();
        LocalApi.emitEvent({ type: 'match', match: structuredClone(mm2), event: { kind: 'chat', by: bot } });
      }, 1100 + Math.random() * 1400);
    }
    return structuredClone(m);
  },

  botsAvailable(excludeIds = []) { return Object.values(DB.users).filter(u => u.bot && !excludeIds.includes(u.id)); },
  async resetAll() { await wait(); Storage.reset(); DB = createDb(); Storage.save(DB); }
};

/* ========================= 3. MATCHMAKER ========================= */
/* En production : start() ouvrirait un WebSocket (ex. wss://api.rivals.gg/queue),
   le serveur pousserait l'état du lobby, puis l'id du match créé. */
class LocalMatchmaker {
  constructor() { this.listeners = new Set(); this.timers = []; this.reset(); }
  reset() { this.state = 'idle'; this.mode = null; this.slots = []; this.startedAt = 0; this.matchId = null; }
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit() { this.listeners.forEach(fn => fn(this)); }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  clear() { this.timers.forEach(clearTimeout); this.timers = []; }

  start(mode, me, partner = null) {
    this.clear(); this.state = 'searching'; this.mode = mode; this.startedAt = Date.now();
    const exclude = [me.id, partner && partner.id].filter(Boolean);
    const pool = LocalApi.botsAvailable(exclude).sort(() => Math.random() - .5);
    // Ordre des places : 1v1 = [moi, adversaire] ; 2v2 = [moi, coéquipier, adv1, adv2]
    this.slots = mode === '1v1' ? [me, null] : [me, partner, null, null];
    const missing = this.slots.map((s, i) => s ? -1 : i).filter(i => i >= 0);
    let t = 0;
    missing.forEach((idx, k) => {
      t += mode === '1v1' ? 2500 + Math.random() * 3500 : 1200 + Math.random() * 2000;
      this.later(() => { this.slots[idx] = publicUser(DB.users[pool[k].id]); this.emit(); }, t);
    });
    this.later(() => this.found(), t + 400);
    this.emit();
  }
  async found() {
    this.state = 'found'; this.emit();
    const ids = this.slots.map(s => s.id);
    const teams = this.mode === '1v1' ? [[ids[0]], [ids[1]]] : [[ids[0], ids[1]], [ids[2], ids[3]]];
    await wait(900, 1300);
    if (this.state !== 'found') return;
    const m = await LocalApi.createMatch(this.mode, teams);
    this.matchId = m.id; this.state = 'ready'; this.emit();
  }
  cancel() { this.clear(); this.reset(); this.emit(); }
}

const TOKEN_KEY = 'rivals.token';

  const cache = { user: null, users: {}, matches: {}, stats: { '1v1': { played: 0, wins: 0, losses: 0, rate: 0 }, '2v2': { played: 0, wins: 0, losses: 0, rate: 0 } } };
  const handlers = new Set();
  let ws = null, retry = null;
  const token = () => Storage.get(TOKEN_KEY);
  const emit = d => handlers.forEach(h => h(d));

  function absorb(s) {
    if (!s) return;

    if (s.users) Object.assign(cache.users, s.users);
    if (s.matches) s.matches.forEach(m => cache.matches[m.id] = m);
    if (s.match) cache.matches[s.match.id] = s.match;
    if (s.stats) cache.stats = s.stats;
    if (s.dmUnread != null) cache.dmUnread = s.dmUnread;
    if (s.disputes !== undefined) cache.disputes = s.disputes;
    if (s.balance !== undefined) cache.balance = s.balance;
    if (s.inviteTotal !== undefined) cache.invites = s.inviteTotal;
    if (s.links) cache.links = s.links;
    if (s.flash) cache.flash = s.flash;

  function absorbPf(p) { cache.user = p.user; cache.users[p.user.id] = p.user; cache.balance = p.wallet.balance; cache.invites = p.invites.length; return p; }
  function dropSession() {
    Storage.del(TOKEN_KEY); cache.user = null; cache.matches = {};
    disconnect();
  }
  async function req(method, path, body) {
    let res;
    try {
      res = await fetch('/api' + path, {
        method,
        headers: Object.assign({ 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' }, token() ? { Authorization: 'Bearer ' + token() } : {}),
        body: body ? JSON.stringify(body) : undefined

    let data = {}; try { data = await res.json(); } catch (e) {}

    if (!res.ok) { const err = new ApiError(data.error || `Erreur du serveur (${res.status}).`, data.fields || {}); err.code = data.code; err.status = res.status; throw err; }

    ws.onopen = () => emit({ type: 'connected' });
    ws.onmessage = e => { let d; try { d = JSON.parse(e.data); } catch (_) { return; } if (d.type === 'kicked') { dropSession(); emit(d); return; } if (d.type === 'server') cache.server = applyServerInfo(d.server); if (d.type === 'match' || d.type === 'snapshot') absorb(d); else if (d.type === 'dispute') { cache.disputes = d.disputes; if (d.users) Object.assign(cache.users, d.users); } else if (d.type === 'invite') cache.invites = d.inviteTotal; emit(d); };
    ws.onclose = ev => { ws = null; emit({ type: 'disconnected' }); if (token() && ev.code !== 4003) retry = setTimeout(connect, 2000); };
  }
  function disconnect() { clearTimeout(retry); if (ws) { const w = ws; ws = null; w.onclose = null; w.close(); } }

  const api = {
    mode: 'server', cache,
    onEvent(fn) { handlers.add(fn); },
    send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); return true; } connect(); return false; },
    online() { return !!(ws && ws.readyState === 1); },
    hasAccounts() { return Storage.get('rivals.seen') === '1'; },
    async boot() { if (!token()) return; try { absorb(await req('GET', '/me')); connect(); } catch (e) { dropSession(); } },

    async login(v) { const d = await req('POST', '/login', v); Storage.set(TOKEN_KEY, d.token); Storage.set('rivals.seen', '1'); absorb(d); connect(); return cache.user; },
    async logout() { try { await req('POST', '/logout'); } catch (e) {} dropSession(); },
    me() { return cache.user; },
    getUser(id) { return cache.users[id] || { id, username: 'Joueur', epic: '' }; },
    async updateProfile(_uid, v) { absorb(await req('PATCH', '/me', v)); return cache.user; },
    async changePassword(v) { const d = await req('POST', '/me/password', v); absorb(d); return d; },
    async revokeSessions() { const d = await req('POST', '/me/sessions/revoke'); absorb(d); return d; },
    async tfaSetup() { return req('POST', '/me/2fa/setup'); },
    async tfaEnable(code) { const d = await req('POST', '/me/2fa/enable', { code }); absorb(d); return d; },
    async tfaDisable(v) { const d = await req('POST', '/me/2fa/disable', v); absorb(d); return d; },
    statsFor(_uid, mode) { return cache.stats[mode]; },
    async leaderboard(mode) { return (await req('GET', '/leaderboard?mode=' + encodeURIComponent(mode))).rows; },
    async getMatch(id) { try { const d = await req('GET', '/matches/' + encodeURIComponent(id)); absorb(d); return structuredClone(d.match); } catch (e) { return null; } },
    listMatches() { return Object.values(cache.matches).filter(m => cache.user && teamOf(m, cache.user.id) >= 0).sort((a, b) => b.createdAt - a.createdAt); },
    disputeCount() { return cache.disputes || 0; },
    balance() { return cache.balance || 0; },
    inviteCount() { return cache.invites || 0; },

    links() { return cache.links || { required: false, ok: true }; },

    async adminEpicUnlink(id) { return req('POST', `/admin/users/${encodeURIComponent(id)}/epic-unlink`); },
    async discordUnlink() { const d = await req('POST', '/discord/unlink'); cache.links = d.links; cache.user = { ...d.user, security: d.user.security || (cache.user && cache.user.security) }; cache.users[d.user.id] = d.user; return d; },
    async verifyLinks() { const d = await req('POST', '/links/verify'); cache.links = d.links; cache.user = { ...d.user, security: d.user.security || (cache.user && cache.user.security) }; cache.users[d.user.id] = d.user; return d; },

    async dmList() { const d = await req('GET', '/dm'); cache.dmUnread = d.unread; return d; },
    async dmGet(uid) { const d = await req('GET', '/dm/' + encodeURIComponent(uid)); cache.dmUnread = d.unread; return d; },
    async dmRead(uid) { const d = await req('POST', `/dm/${encodeURIComponent(uid)}/read`); cache.dmUnread = d.unread; return d; },
    async dmSend(uid, text, media) { return req('POST', '/dm/' + encodeURIComponent(uid), { text, media }); },
    async findUser(name) { return (await req('GET', '/users/find?name=' + encodeURIComponent(name))).user; },
    dmUnread() { return cache.dmUnread || 0; },
    async searchMedia(type, q, offset) { return req('GET', `/media/search?type=${encodeURIComponent(type)}&q=${encodeURIComponent(q || '')}&offset=${offset || 0}`); },

    async respondInvite(id, accept) { return absorbPf(await req('POST', '/invites/' + encodeURIComponent(id), { accept })); },
    async getPlayer(id) { const d = await req('GET', '/users/' + encodeURIComponent(id)); const { banner, ...pub } = d.user; cache.users[id] = pub; return { ...d.user, card: d.card }; },
    activeMatch() { return api.listMatches().find(m => OPEN.includes(m.status)) || null; },
    async declare(id, _uid, won) { const d = await req('POST', `/matches/${encodeURIComponent(id)}/declare`, { won }); absorb(d); return d.match; },
    async adminPlayers() { return req('GET', '/admin/players'); },

    async admin(method, path, body) { const d = await req(method, '/admin' + path, body); if (d.users) Object.assign(cache.users, d.users); if (d.settings) cache.server = applyServerInfo(d.settings); return d; },
    async sendChat(id, _uid, text, media, image) { const d = await req('POST', `/matches/${encodeURIComponent(id)}/chat`, image ? { text, image } : { text, media }); absorb(d); return d.match; }

class RemoteMatchmaker {
  constructor(api) { this.api = api; this.listeners = new Set(); this.reset(); api.onEvent(d => this.handle(d)); }
  reset() { this.state = 'idle'; this.mode = null; this.slots = []; this.startedAt = 0; this.matchId = null; }
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  emit() { this.listeners.forEach(fn => fn(this)); }
  buildSlots(players) {
    const n = this.mode === '1v1' ? 2 : 4, me = state.user;
    const arr = [me, ...players.filter(p => p.id !== me.id)].slice(0, n);
    while (arr.length < n) arr.push(null);
    return arr;
  }
  start(mode) {
    this.mode = mode;
    if (!this.api.send({ type: 'queue', mode })) { this.reset(); toast('Connexion au serveur en cours. Réessaie dans un instant.', 'error'); return; }
    this.state = 'searching'; this.startedAt = Date.now(); this.slots = this.buildSlots([]); this.emit();
  }
  handle(d) {
    if (d.type === 'queue' && this.state === 'searching' && d.mode === this.mode) { this.slots = this.buildSlots(d.players); this.emit(); }
    else if (d.type === 'queue-error') { if (d.links) this.api.cache.links = d.links; this.reset(); this.emit(); toast(d.error, 'error'); }
    else if (d.type === 'matched') {
      this.mode = d.mode; this.slots = this.buildSlots(d.players); this.state = 'found'; this.matchId = d.matchId; this.emit();
      setTimeout(() => { if (this.state === 'found') { this.state = 'ready'; this.emit(); } }, 900);
    }
    else if (d.type === 'disconnected' && this.state === 'searching') { this.reset(); this.emit(); toast('Connexion perdue : la recherche a été interrompue.', 'error'); }
  }
  cancel() { this.api.send({ type: 'cancel' }); this.reset(); this.emit(); }
}

let Api = LocalApi, mm = null;
async function detectServer() {
  if (!/^https?:$/.test(location.protocol)) return false;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('/api/health', { signal: ctl.signal, headers: { 'ngrok-skip-browser-warning': '1' } });
    clearTimeout(t);
    if (!r.ok) return false;
    const d = await r.json();
    return d && d.app === 'rivals';
  } catch (e) { return false; }
}

/* ========================= 3c. SONS ========================= */
/* Bruitages synthétisés avec Web Audio : rien à télécharger, volume léger,
   coupables avec le bouton haut-parleur (préférence mémorisée). */
const SFX = (() => {
  let ctx = null, master = null, wet = null, muted = false;
  try { muted = localStorage.getItem('rivals.mute') === '1'; } catch (e) {}

      master = ctx.createGain(); master.gain.value = .7; master.connect(comp); comp.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 1.3), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
      const conv = ctx.createConvolver(); conv.buffer = ir;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      wet = ctx.createGain(); wet.gain.value = .22; wet.connect(conv); conv.connect(lp); lp.connect(master);

  const bell = (f, t = 0, g = .12, d = .5, rv = .5) => { tone({ f, t, d, g, rv }); tone({ f: f * 3.01, t, d: d * .35, g: g * .28, rv }); tone({ f: f * 5.4, t, d: d * .12, g: g * .1 }); };

let titleTimer = null;
function flashTitle(text) {
  if (!document.hidden) return;
  const base = document.title; let on = false;
  clearInterval(titleTimer);
  titleTimer = setInterval(() => { document.title = (on = !on) ? text : base; }, 900);
  const stop = () => { if (!document.hidden) { clearInterval(titleTimer); document.title = base; document.removeEventListener('visibilitychange', stop); } };
  document.addEventListener('visibilitychange', stop);
}

function emblemSvg(rank, size, extra = '') {

}
// Aura : plus le rang est haut, plus il y a de couches (halo → rayons → anneau → étincelles → tourbillon → ondes + orbes)
function emblemAura(rank, size) {
  const au = rank && RANK_AURA[rank.family]; if (!au) return '';
  const [c, L] = au; const big = size >= 64, mid = size >= 32;
  let h = `<i class="rk-glow${mid ? '' : ' still'}"></i>`;
  if (mid && L >= 2) h += '<i class="rk-rays"></i>';
  if (mid && L >= 3) h += '<i class="rk-ring"></i>';
  if (big && L >= 5) h += '<i class="rk-flare"></i>';
  if (big && L >= 6) h += '<i class="rk-wave"></i><i class="rk-wave rk-w2"></i>';
  if (big && L >= 4) {
    const n = L * 2;
    for (let k = 0; k < n; k++) { const a = k * 2 * Math.PI / n, r = 62 + (k % 3) * 9; h += `<b class="rk-sp" style="left:${(50 + r * Math.cos(a)).toFixed(0)}%;top:${(50 + r * Math.sin(a)).toFixed(0)}%;animation-delay:${((k * .37) % 2).toFixed(2)}s"></b>`; }
  }
  if (big && L >= 6) h += '<span class="rk-orb"><em></em><em></em><em></em></span>';
  return h;
}
function rankEmblem(rank, size = 40, extra = '') {
  const svg = emblemSvg(rank, size, extra);

  if (!au) return svg;
  return `<span class="rk-au rk-${rank.family}" style="--rc:${au[0]};--rl:${au[1]}">${emblemAura(rank, size)}${svg}</span>`;
}

}

/* ----- Composants réutilisables ----- */
const UI = {
  btn({ label, variant = 'primary', action = '', size = '', type = 'button', iconName = '', attrs = '', block = false }) {
    return `<button type="${type}" class="btn btn-${variant} ${size ? 'btn-' + size : ''} ${block ? 'btn-block' : ''}" ${action ? `data-action="${action}"` : ''} ${attrs}>${iconName ? icon(iconName) : ''}<span>${label}</span></button>`;
  },
  linkBtn({ label, href, variant = 'ghost', size = '', iconName = '' }) {
    return `<a class="btn btn-${variant} ${size ? 'btn-' + size : ''}" href="${href}">${iconName ? icon(iconName) : ''}<span>${label}</span></a>`;
  },
  field({ id, name, label, type = 'text', value = '', hint = '', autocomplete = 'off', optional = false, maxlength = 64, placeholder = '' }) {
    const secret = type === 'secret', pw = type === 'password' || secret;
    return `<div class="field">
      <label for="${id}">${label}${optional ? ' <span class="opt">(facultatif)</span>' : ''}</label>
      <div class="input-wrap">
        <input class="input${secret ? ' masked' : ''}" id="${id}" name="${name}" type="${secret ? 'text' : type}" value="${esc(value)}" autocomplete="${secret ? 'off' : autocomplete}"${secret ? ' data-secret data-lpignore="true" data-1p-ignore data-form-type="other"' : ''} maxlength="${maxlength}" placeholder="${esc(placeholder)}" aria-describedby="${id}-err ${hint ? id + '-hint' : ''}" spellcheck="false" autocapitalize="off">
        ${pw ? `<button type="button" class="btn btn-icon" data-action="toggle-pw" data-target="${id}" aria-label="Afficher le mot de passe">${icon('eye')}</button>` : ''}
      </div>
      ${hint ? `<p class="hint" id="${id}-hint">${hint}</p>` : ''}
      <p class="error" id="${id}-err" data-error-for="${name}"></p>
    </div>`;
  },
  alert(kind, html, iconName) {
    return `<div class="alert alert-${kind}" role="${kind === 'error' ? 'alert' : 'status'}">${icon(iconName || (kind === 'error' || kind === 'warn' ? 'alert' : 'info'))}<div class="alert-body">${html}</div></div>`;
  },
  pill(status) { const s = STATUS[status]; return `<span class="pill ${s.cls}">${s.label}</span>`; },
  avatar(u, cls = '') {
    const vip = u && u.vip && !(u && u.deco) ? ' vip' : '';
    const base = u && u.avatar ? `<img class="avatar ${cls}${vip}" src="${esc(u.avatar)}" alt="" aria-hidden="true">`
      : `<span class="avatar ${cls}${vip}" style="${avatarStyle(u.id)}" aria-hidden="true">${esc(((u && u.username) || '?')[0].toUpperCase())}</span>`;
    return u && u.deco && FX.decos[u.deco] ? `<span class="av-deco">${base}${decoFx(u.deco)}</span>` : base;
  },
  // Pseudo (rouge pour les admins) et badges ADMIN / VIP / tag d'équipe
  name(u, label) { return `<span class="${u && u.admin ? 'is-admin' : ''}">${esc(label || (u && u.username) || 'Joueur')}</span>`; },
  adminTag(u) { return u && u.admin ? `<span class="tag tag-admin" title="Administrateur RIVALS">${icon('shield')}ADMIN</span>` : ''; },
  nameTags(u) { return `${UI.adminTag(u)}${u.vip ? '<span class="tag vip-tag">VIP</span>' : ''}${u.tag ? `<span class="team-tag">[${esc(u.tag)}]</span>` : ''}`; },
  copyBtn(value, what) {
    return `<button type="button" class="btn btn-ghost btn-sm copy-btn" data-action="copy" data-copy="${esc(value)}" data-what="${esc(what)}" aria-label="Copier ${esc(what)} ${esc(value)}">${icon('copy')}<span>Copier</span></button>`;
  },
  idRow(k, v, what) {
    return `<div class="id-row"><div><div class="k">${k}</div><div class="v ${v ? '' : 'missing'}">${v ? esc(v) : 'Non renseigné'}</div></div>${v ? UI.copyBtn(v, what) : ''}</div>`;

  rankBadge(s, { size = 40, mmr = true } = {}) {

};

/* ----- Toasts ----- */
function toast(msg, kind = 'ok') {
  SFX.soft(kind === 'error' ? 'error' : kind === 'info' ? 'info' : 'success');
  const el = document.createElement('div');
  el.className = 'toast toast-' + kind;
  el.innerHTML = icon(kind === 'ok' ? 'check' : kind === 'error' ? 'alert' : 'info') + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2800);
}
